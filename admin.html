  // Column definitions drive header, body and footer from one place. Grouped under
  // EARNINGS / DEDUCTIONS headers to match the layout of the existing Google Sheet.
  const PG_COLS = [
    { key: 'employee',          label: 'Employee',       w: 175, type: 'label', group: '' },
    { key: 'basic_wages',       label: 'Basic Wages',    w: 80,  type: 'calc',  group: '' },
    { key: 'days_in_month',     label: 'Days in Month',  w: 52,  type: 'calc',  group: '' },
    { key: 'working_days',      label: 'Present Days',   w: 56,  type: 'input', group: '' },
    { key: 'absent_days',       label: 'Absent Days',    w: 52,  type: 'calc',  group: '' },
    { key: 'ot_hours',          label: 'OT Hours',       w: 52,  type: 'input', group: '' },
    { key: 'ot_days',           label: 'OT Days',        w: 50,  type: 'calc',  group: '' },
    { key: 'salary_amount',     label: 'Salary',         w: 78,  type: 'calc',  group: 'EARNINGS' },
    { key: 'ot_charges',        label: 'OT Charges',     w: 74,  type: 'calc',  group: 'EARNINGS' },
    { key: 'incentives',        label: 'Incentives',     w: 66,  type: 'input', group: 'EARNINGS' },
    { key: 'total_earnings',    label: 'Total Earnings', w: 82,  type: 'calc',  group: 'EARNINGS' },
    { key: 'incentive_remarks', label: 'Incentive Remarks', w: 120, type: 'text', group: '' },
    { key: 'advance_deduction', label: 'Advance',        w: 68,  type: 'input', group: 'DEDUCTIONS' },
    { key: 'loan_deduction',    label: 'Loan',           w: 68,  type: 'input', group: 'DEDUCTIONS' },
    { key: 'esi_amount',        label: 'ESI',            w: 58,  type: 'calc',  group: 'DEDUCTIONS' },
    { key: 'total_deductions',  label: 'Total Deductions', w: 82, type: 'calc', group: 'DEDUCTIONS' },
    { key: 'net_payable',       label: 'Net Payable',    w: 88,  type: 'net',   group: '' },
    { key: 'slip',              label: 'Slip',           w: 92,  type: 'action', group: '' },
  ];
  // Navigable columns get a coordinate; label/action/text columns are skipped by arrows.
  PG_COLS.forEach((col) => { col._c = null; });
  (() => { let n = 0; PG_COLS.forEach(col => { if (col.type !== 'label') col._c = n++; }); })();
  const PG_NAV_COL_COUNT = PG_COLS.filter(c => c._c !== null).length;

  const PG_SUMMABLE = ['salary_amount','ot_charges','incentives','total_earnings','advance_deduction','loan_deduction','esi_amount','total_deductions','net_payable'];
  let pgWidths = {};

  function parseLocalDate(s) {
    if (!s) return null;
    const [y, m, d] = String(s).split('T')[0].split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  // Days at the current salary are PRESENT days actually recorded, not calendar days —
  // the company grants an increment after roughly 340 days present. The server supplies
  // the total from earlier salary sheets; this month's present days are added live.
  function incrementLabel(e, period) {
    const inc = parseLocalDate(e.employees?.last_increment_date);
    if (!inc) return '<span style="color:var(--muted);">increment — not recorded</span>';
    const days = Math.round((Number(e.prior_present_days) || 0) + (Number(e.working_days) || 0));
    return `increment - ${MONTH_NAMES[inc.getMonth()]} ${inc.getFullYear()} (${days} Days)`;
  }

  function renderPayrollGrid() {
    const { period, entries } = currentPayrollSheet;
    const locked = period.status === 'finalised';
    const canEdit = !locked && (isOwnerUser || myPermissionKeys.includes('payroll.edit'));
    const canFinalise = !locked && (isOwnerUser || myPermissionKeys.includes('payroll.finalise'));
    const sum = (f) => entries.reduce((s, e) => s + Number(e[f] || 0), 0);
    const wOf = (col) => pgWidths[col.key] || col.w;

    const bodyCell = (e, col) => {
      const w = `style="width:${wOf(col)}px;"`;
      if (col.type === 'label') {
        return `<td class="pg-label" ${w}>
          <div class="pg-emp-name">${e.employees?.name || '—'} - ${e.employees?.employee_code || ''}</div>
          <div class="pg-emp-inc" data-inc-for="${e.id}">${incrementLabel(e, period)}</div>
        </td>`;
      }
      if (col.type === 'action') {
        return `<td style="width:${wOf(col)}px; text-align:center; padding:4px 8px;"><button class="btn btn-sm pay-slip-btn pg-nav" data-id="${e.id}" data-col="${col.key}" data-r="${e._r}" data-c="${col._c}">View Slip</button></td>`;
      }
      if (col.type === 'text') {
        return `<td ${w}><textarea class="pg-cell pg-text pg-nav" data-id="${e.id}" data-field="${col.key}" data-col="${col.key}" data-r="${e._r}" data-c="${col._c}" rows="2" readonly>${e[col.key] || ''}</textarea></td>`;
      }
      if (col.type === 'input') {
        return `<td ${w}><input class="pg-cell pg-nav" data-id="${e.id}" data-field="${col.key}" data-col="${col.key}" data-r="${e._r}" data-c="${col._c}" value="${Number(e[col.key] || 0)}" readonly inputmode="decimal" /></td>`;
      }
      // Calculated cells are focusable so arrow keys can land on them, but they hold no
      // input and so can never be typed into.
      const cls = col.type === 'net' ? 'pg-net' : 'pg-calc';
      return `<td class="${cls} pg-nav pg-readonly-cell" ${w} tabindex="-1" data-calc="${col.key}" data-id="${e.id}" data-r="${e._r}" data-c="${col._c}">${Number(e[col.key] || 0).toFixed(2)}</td>`;
    };

    document.getElementById('salaryCalcContent').innerHTML = `
      ${locked ? `<div class="msg success" style="display:block; margin:8px 16px;">This sheet is finalised. Deductions have been posted to the ledgers and it can no longer be edited.</div>` : ''}
      <div class="msg" id="payGridMsg" style="margin:0 16px;"></div>
      <div class="paygrid-wrap" id="paygridWrap">
        <table class="paygrid" id="paygridTable">
          <colgroup>${PG_COLS.map(col => `<col data-col="${col.key}" style="width:${wOf(col)}px;" />`).join('')}</colgroup>
          <thead>
            <tr>${PG_COLS.map(col => {
              // Earnings and deductions are told apart by header colour rather than a
              // separate banner row, which cost vertical space for very little gain.
              const groupCls = col.group === 'EARNINGS' ? 'pg-h-earn' : (col.group === 'DEDUCTIONS' ? 'pg-h-ded' : '');
              return `<th class="${col.type === 'label' ? 'pg-label-h' : ''} ${groupCls}" data-col="${col.key}">${col.label}<span class="pg-resizer" data-col="${col.key}"></span></th>`;
            }).join('')}</tr>
          </thead>
          <tbody>
            ${entries.map((e, i) => { e._r = i; return `<tr data-row="${i}">${PG_COLS.map(col => bodyCell(e, col)).join('')}</tr>`; }).join('')}
          </tbody>
          <tfoot><tr>${PG_COLS.map(col => {
            if (col.key === 'employee') return `<td class="pg-label" style="width:${wOf(col)}px;">TOTAL — ${entries.length} employees</td>`;
            if (!PG_SUMMABLE.includes(col.key)) return `<td style="width:${wOf(col)}px;"></td>`;
            return `<td style="width:${wOf(col)}px;" id="tot_${col.key}">${sum(col.key).toFixed(2)}</td>`;
          }).join('')}</tr></tfoot>
        </table>
      </div>
      ${!locked ? `<p class="pay-hint" style="margin:4px 16px 10px;">Arrow keys move between cells. <strong>Enter</strong> starts editing; Enter again saves and moves right. <strong>Esc</strong> cancels. Grey columns are calculated. Drag a column edge to resize — widths carry over to every future month.</p>` : ''}
    `;

    // The sheet's own controls live in the page header, so the grid gets the full width
    setTopbarLead(`<button class="btn btn-sm btn-outline" id="payBackBtn" title="Return to the list of salary sheets.">‹ Back</button>`);
    setTopbarActions(`
      <button class="btn btn-sm btn-outline" id="payResetColsBtn" title="Reset all column widths back to their defaults.">Reset Columns</button>
      ${canEdit ? `<button class="btn btn-sm" id="paySaveBtn" disabled title="Save your figures to the database. The sheet stays editable and nothing is deducted from any loan or advance ledger yet.">Save Draft</button>` : ''}
      ${canFinalise ? `<button class="btn btn-sm btn-outline" id="payFinaliseBtn" title="Lock this sheet and post the deductions: loan amounts are recorded against each loan and advance amounts reduce each outstanding advance. This cannot be undone.">Finalise &amp; Post</button>` : ''}
    `);
    document.getElementById('pageTitle').textContent = `Salary Sheet — ${monthLabel(period.period_month_no, period.period_year)}`;
    document.getElementById('pageSub').innerHTML = `<span class="status-tag ${locked ? 'approved' : 'calculated'}">${period.status}</span> <span style="margin-left:6px;">${entries.length} employees</span>`;
    document.querySelector('#view-salary-calculator .content')?.classList.add('content-flush');

    sizePayrollGrid();
    document.getElementById('payBackBtn').addEventListener('click', () => {
      if (payrollDirty && !confirm('You have unsaved changes. Leave without saving?')) return;
      loadPayrollPeriods();
    });
    if (canEdit) wirePayrollGridKeys();
    wirePayrollColumnResize();
    document.getElementById('payResetColsBtn').addEventListener('click', async () => {
      pgWidths = {};
      await apiPayroll({ action: 'save_column_widths', widths: {} });
      renderPayrollGrid();
    });
    document.getElementById('paySaveBtn')?.addEventListener('click', savePayrollGrid);
    document.getElementById('payFinaliseBtn')?.addEventListener('click', finalisePayrollSheet);
    document.querySelectorAll('.pay-slip-btn').forEach(b => b.addEventListener('click', () => openSalarySlip(b.dataset.id)));
  }

  // Fill the remaining window height so the sheet still uses the whole screen, while
  // keeping its own scroll context — which is what makes the frozen header, footer and
  // employee column actually hold their position.
  function sizePayrollGrid() {
    const wrap = document.getElementById('paygridWrap');
    if (!wrap) return;
    const top = wrap.getBoundingClientRect().top + (window.scrollY || 0);
    // max-height rather than height: the container then shrinks to fit a short sheet
    // instead of leaving dead space under the totals row, but still caps at the window
    // and scrolls internally once there are enough rows to need it.
    wrap.style.height = '';
    wrap.style.maxHeight = Math.max(220, window.innerHeight - top - 4) + 'px';
  }
  window.addEventListener('resize', () => { if (document.getElementById('paygridWrap')) sizePayrollGrid(); });

  // scrollIntoView can't see the frozen column or header: they overlap the cell without
  // the browser considering it hidden, so a cell tucked behind them is left off-screen.
  // This scrolls by the exact overlap instead.
  function ensureCellVisible(el) {
    const wrap = document.getElementById('paygridWrap');
    if (!wrap || !el) return;
    const wr = wrap.getBoundingClientRect();
    const cr = el.getBoundingClientRect();
    const frozenW = wrap.querySelector('td.pg-label')?.getBoundingClientRect().width || 0;
    const headH = wrap.querySelector('thead')?.getBoundingClientRect().height || 0;
    const footH = wrap.querySelector('tfoot')?.getBoundingClientRect().height || 0;

    if (cr.left < wr.left + frozenW) wrap.scrollLeft -= (wr.left + frozenW - cr.left);
    else if (cr.right > wr.right) wrap.scrollLeft += (cr.right - wr.right);

    if (cr.top < wr.top + headH) wrap.scrollTop -= (wr.top + headH - cr.top);
    else if (cr.bottom > wr.bottom - footH) wrap.scrollTop += (cr.bottom - (wr.bottom - footH));
  }

  function wirePayrollColumnResize() {
    document.querySelectorAll('.pg-resizer').forEach(handle => {
      handle.addEventListener('mousedown', (ev) => {
        ev.preventDefault(); ev.stopPropagation();
        const colKey = handle.dataset.col;
        const colEl = document.querySelector(`col[data-col="${colKey}"]`);
        const startX = ev.clientX;
        const startW = colEl.offsetWidth || parseInt(colEl.style.width, 10) || 80;
        document.body.classList.add('pg-resizing');
        const onMove = (e2) => {
          const newW = Math.max(45, startW + (e2.clientX - startX));
          colEl.style.width = newW + 'px';
          pgWidths[colKey] = newW;
        };
        const onUp = async () => {
          document.body.classList.remove('pg-resizing');
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
          try { await apiPayroll({ action: 'save_column_widths', widths: pgWidths }); } catch (e) { /* layout only */ }
        };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    });
  }

  // Spreadsheet cell behaviour: a cell is SELECTED by default (read-only, arrow keys move
  // between cells). Enter switches that cell into EDIT mode; Enter again commits and moves
  // right; Esc cancels and restores the previous value. Typing a digit on a selected cell
  // starts editing straight away, as a spreadsheet would.
  function pgEnterEdit(input) {
    if (!input.readOnly) return;
    input.dataset.prev = input.value;
    input.readOnly = false;
    input.classList.add('pg-editing');
    input.select();
  }
  function pgExitEdit(input, commit) {
    if (input.readOnly) return;
    if (!commit && input.dataset.prev !== undefined) input.value = input.dataset.prev;
    input.readOnly = true;
    input.classList.remove('pg-editing');
    if (commit) input.dispatchEvent(new Event('change', { bubbles: true }));
  }

  function wirePayrollGridKeys() {
    const grid = document.getElementById('paygridTable');
    const at = (r, col) => grid.querySelector(`.pg-nav[data-r="${r}"][data-c="${col}"]`);
    const focusCell = (el) => {
      if (!el) return;
      grid.querySelectorAll('.pg-nav.pg-selected').forEach(n => n.classList.remove('pg-selected'));
      el.classList.add('pg-selected');
      el.focus({ preventScroll: true });
      ensureCellVisible(el);
    };
    const rowCount = currentPayrollSheet.entries.length;

    grid.querySelectorAll('.pg-nav').forEach(cell => {
      const isInput = cell.tagName === 'INPUT';
      const isText = cell.tagName === 'TEXTAREA';
      const isAction = cell.tagName === 'BUTTON';
      const isEditable = isInput || isText;
      const r = Number(cell.dataset.r);
      const col = Number(cell.dataset.c);

      cell.addEventListener('mousedown', () => {
        setTimeout(() => { focusCell(cell); if (isEditable) pgEnterEdit(cell); }, 0);
      });

      cell.addEventListener('keydown', (ev) => {
        const editing = isEditable && !cell.readOnly;

        if (ev.key === 'Escape' && editing) { ev.preventDefault(); pgExitEdit(cell, false); return; }

        if (ev.key === 'Enter') {
          // Shift+Enter adds a line break inside a remarks cell rather than committing
          if (isText && editing && ev.shiftKey) return;
          ev.preventDefault();
          // On the Slip button, Enter does what clicking it does: open the salary slip.
          if (isAction) { cell.click(); return; }
          if (!isEditable) {
            // Read-only cells can't be edited, so Enter simply advances the same way it
            // does everywhere else: right, wrapping to the next row at the end.
            let n = at(r, col + 1);
            if (!n && r + 1 < rowCount) n = at(r + 1, 0);
            focusCell(n || cell);
            return;
          }
          if (!editing) { pgEnterEdit(cell); return; }
          pgExitEdit(cell, true);
          // A rejected value keeps the selection on the cell so it can be corrected;
          // the reset handler refocuses and reopens it for editing.
          if (cell.dataset.invalid) return;
          // Move to the next navigable cell on the right, wrapping to the next row
          let next = at(r, col + 1);
          if (!next && r + 1 < rowCount) next = at(r + 1, 0);
          focusCell(next || cell);
          return;
        }

        if (editing) return;   // while typing, arrows belong to the text cursor

        let target = null;
        // Left and right stay within the row and simply stop at either end; moving
        // between employees is what up and down are for.
        if (ev.key === 'ArrowRight') target = at(r, col + 1);
        else if (ev.key === 'ArrowLeft') target = at(r, col - 1);
        else if (ev.key === 'ArrowDown') target = at(r + 1, col);
        else if (ev.key === 'ArrowUp') target = at(r - 1, col);
        else if (isInput && /^[0-9.]$/.test(ev.key)) { pgEnterEdit(cell); cell.value = ''; return; }
        else if (isText && ev.key.length === 1 && !ev.ctrlKey && !ev.metaKey) { pgEnterEdit(cell); cell.value = ''; return; }
        else return;

        ev.preventDefault();
        focusCell(target);
      });

      if (isText) {
        cell.addEventListener('blur', () => { if (!cell.readOnly) pgExitEdit(cell, true); });
        cell.addEventListener('change', () => {
          const entry = currentPayrollSheet.entries.find(e => e.id === cell.dataset.id);
          if (entry) { entry.incentive_remarks = cell.value; markPayrollDirty(); }
        });
      }

      if (isInput) {
        cell.addEventListener('blur', () => { if (!cell.readOnly) pgExitEdit(cell, true); });

        cell.addEventListener('change', () => {
          const msg = document.getElementById('payGridMsg');
          const entry = currentPayrollSheet.entries.find(e => e.id === cell.dataset.id);
          if (!entry) return;
          const val = cell.value.trim();
          const reset = (text) => {
            msg.className = 'msg error'; msg.textContent = text;
            cell.value = 0; entry[cell.dataset.field] = 0;
            recalcRowPreview(entry.id); markPayrollDirty();
            // Flag the cell so the Enter handler knows not to advance past it.
            cell.dataset.invalid = '1';
            // Deferred so the popup doesn't fire from inside the change/blur event, then
            // the cursor goes straight back into the offending cell ready for a retype.
            setTimeout(() => {
              alert(text);
              delete cell.dataset.invalid;
              focusCell(cell);
              pgEnterEdit(cell);
            }, 0);
          };

          if (val !== '' && isNaN(Number(val))) return reset('Only numbers are allowed in this column.');
          if (Number(val) < 0) return reset('Negative values are not allowed.');
          // Present days beyond the length of the month is a data-entry mistake, so it is
          // rejected and reset rather than quietly rounded down.
          if (cell.dataset.field === 'working_days' && Number(val) > Number(entry.days_in_month)) {
            return reset(`Present days cannot exceed ${entry.days_in_month} days for ${entry.employees?.name || 'this employee'}. The cell has been reset to 0.`);
          }

          msg.className = 'msg';
          entry[cell.dataset.field] = Number(val || 0);
          recalcRowPreview(entry.id);
          markPayrollDirty();
        });
      }
    });

  }

  // Closing the tab or refreshing would otherwise discard a sheet's worth of typing
  // without any warning at all — the Back button prompt only covered one exit route.
  window.addEventListener('beforeunload', (ev) => {
    if (!payrollDirty) return;
    ev.preventDefault();
    ev.returnValue = '';
    return '';
  });

  function markPayrollDirty() {
    payrollDirty = true;
    const btn = document.getElementById('paySaveBtn');
    if (btn) { btn.disabled = false; btn.textContent = 'Save Draft'; }
  }

  // A local preview only, so the row reacts instantly while typing. The authoritative
  // figures always come back from the server on save — this is never what gets stored.
  function recalcRowPreview(entryId) {
    const e = currentPayrollSheet.entries.find(x => x.id === entryId);
    if (!e) return;
    const period = currentPayrollSheet.period;
    const basic = Number(e.basic_wages) || 0;
    const dim = Number(e.days_in_month) || 30;
    const perDay = dim > 0 ? basic / dim : 0;
    const otDays = (Number(e.ot_hours) || 0) / 8;
    const salary = Math.round(perDay * (Number(e.working_days) || 0) * 100) / 100;
    const otCharges = Math.round(perDay * otDays * 100) / 100;
    const earnings = Math.round((salary + otCharges + (Number(e.incentives) || 0)) * 100) / 100;

    const ceiling = Number(period.esi_wage_ceiling ?? 21000);
    const rate = Number(period.esi_employee_rate ?? 0.75);
    const esiApplicable = !!e.employees?.esi_applicable;
    const esi = (esiApplicable && basic <= ceiling) ? Math.round(salary * (rate / 100) * 100) / 100 : 0;

    const ded = Math.round(((Number(e.loan_deduction) || 0) + (Number(e.advance_deduction) || 0) + esi) * 100) / 100;
    const net = Math.round((earnings - ded) * 100) / 100;
    const absent = Math.round((dim - (Number(e.working_days) || 0)) * 100) / 100;

    Object.assign(e, { absent_days: absent, ot_days: otDays, salary_amount: salary, ot_charges: otCharges, total_earnings: earnings, esi_amount: esi, total_deductions: ded, net_payable: net });

    const setCell = (field, value) => {
      const td = document.querySelector(`[data-calc="${field}"][data-id="${entryId}"]`);
      if (td) td.textContent = Number(value).toFixed(2);
    };
    setCell('absent_days', absent);
    setCell('ot_days', otDays);
    // The days-at-current-salary figure includes this month's present days, so it moves too
    const incEl = document.querySelector(`[data-inc-for="${entryId}"]`);
    if (incEl) incEl.innerHTML = incrementLabel(e, period);
    setCell('salary_amount', salary);
    setCell('ot_charges', otCharges);
    setCell('total_earnings', earnings);
    setCell('esi_amount', esi);
    setCell('total_deductions', ded);
    setCell('net_payable', net);
    refreshPayrollTotals();
  }

  function refreshPayrollTotals() {
    const entries = currentPayrollSheet.entries;
    // Footer cell ids are derived from the column keys in PG_COLS, so this stays correct
    // automatically if columns are ever added or reordered.
    ['salary_amount','ot_charges','incentives','total_earnings','advance_deduction',
     'loan_deduction','other_deduction','esi_amount','total_deductions','net_payable']
      .forEach(f => {
        const el = document.getElementById('tot_' + f);
        if (el) el.textContent = entries.reduce((s, e) => s + Number(e[f] || 0), 0).toFixed(2);
      });
  }

  async function savePayrollGrid() {
    const btn = document.getElementById('paySaveBtn');
    const msg = document.getElementById('payGridMsg');
    msg.className = 'msg';
    setButtonLoading(btn, true, 'Saving');
    const payload = currentPayrollSheet.entries.map(e => ({
      id: e.id, employee_id: e.employee_id,
      working_days: e.working_days, ot_hours: e.ot_hours,
      incentives: e.incentives, incentive_remarks: e.incentive_remarks || null,
      loan_deduction: e.loan_deduction, advance_deduction: e.advance_deduction,
      remarks: e.remarks || null,
    }));
    const res = await apiPayroll({ action: 'save_payroll_entries', period_id: currentPayrollSheet.period.id, entries: payload });
    setButtonLoading(btn, false);
    if (!res.success) { msg.className = 'msg error'; msg.textContent = res.error; return; }
    payrollDirty = false;
    btn.disabled = true;
    btn.textContent = 'Saved';
    msg.className = 'msg success';
    msg.textContent = `Saved ${res.saved} rows.`;
    // Reload so the displayed figures are the server's, not the local preview
    openPayrollSheet(currentPayrollSheet.period.id);
  }

  async function finalisePayrollSheet() {
    if (payrollDirty) { alert('Please save your changes before finalising.'); return; }
    const p = currentPayrollSheet.period;
    const totalNet = currentPayrollSheet.entries.reduce((s, e) => s + Number(e.net_payable || 0), 0);
    const totalLoan = currentPayrollSheet.entries.reduce((s, e) => s + Number(e.loan_deduction || 0), 0);
    const totalAdv = currentPayrollSheet.entries.reduce((s, e) => s + Number(e.advance_deduction || 0), 0);

    if (!confirm(
      `Finalise the salary sheet for ${monthLabel(p.period_month_no, p.period_year)}?\n\n` +
      `Net payable: ${fmtMoney(totalNet)}\n` +
      `Loan deductions to post: ${fmtMoney(totalLoan)}\n` +
      `Advance recoveries to post: ${fmtMoney(totalAdv)}\n\n` +
      `These amounts will be deducted from the loan and advance ledgers, and the sheet will become read-only. This cannot be undone.`
    )) return;

    const btn = document.getElementById('payFinaliseBtn');
    setButtonLoading(btn, true, 'Finalising');
    const res = await apiPayroll({ action: 'finalise_payroll', period_id: p.id });
    setButtonLoading(btn, false);
    if (!res.success) { alert(res.error); return; }
    alert(res.message);
    openPayrollSheet(p.id);
  }

  // ============ LOANS & ADVANCES ============
  // Two genuinely different things, shown as two tabs under one sidebar item:
  //   LOAN    - money lent, repaid over multiple months by design, carries a running balance
  //   ADVANCE - salary paid early (usually the 25th), recovered from THAT month's salary.
  //             Not an installment plan. It only carries a balance when the month's salary
  //             could not cover it, in which case the shortfall carries to the next month.
  // Each renderer serves two entry points: the standalone sidebar view (all employees) and
  // the Employee Profile tab (scoped to one employee, which hides the employee column).
  let loansData = null;
  let advancesData = null;
  let laActiveTab = 'loans';
  let loanStatusFilter = 'open';
  let advanceStatusFilter = 'open';
  let laSearchQuery = '';

  // The back end now speaks the shared status vocabulary for these two ledgers:
  //   draft -> submitted -> approved -> completed, plus cancelled.
  // It still sends the old word alongside as `legacy_status`, but every
  // comparison below is on the real `status`. A loan/advance is still "open"
  // (money outstanding, ledger live) in any state before completed, which is
  // exactly what the old word 'active' / 'outstanding' used to mean.
  const LA_OPEN_STATUSES = ['draft', 'submitted', 'approved'];
  const laIsOpen = (s) => LA_OPEN_STATUSES.includes(s);
  const laStatusTagClass = (s) => s === 'completed' ? 'approved' : (s === 'cancelled' ? 'rejected' : 'calculated');
  const LOAN_STATUS_LABEL = { draft: 'Draft', submitted: 'Pending Approval', approved: 'Active', completed: 'Closed', cancelled: 'Cancelled' };
  const ADVANCE_STATUS_LABEL = { draft: 'Draft', submitted: 'Pending Approval', approved: 'Outstanding', completed: 'Recovered', cancelled: 'Cancelled' };
  const LOAN_FILTER_LABEL = { open: 'active', completed: 'closed', cancelled: 'cancelled' };
  const ADVANCE_FILTER_LABEL = { open: 'outstanding', completed: 'recovered', cancelled: 'cancelled' };

  function fmtMoney(n) {
    const v = Number(n || 0);
    return '₹' + v.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function fmtShortDate(d) {
    if (!d) return '—';
    return new Date(d).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  function fmtPeriod(p) {
    if (!p) return '—';
    const [y, m] = p.split('-');
    return new Date(Number(y), Number(m) - 1, 1).toLocaleDateString('en-GB', { month: 'short', year: 'numeric' });
  }

  async function loadLoansAdvances(employeeId, containerId) {
    const target = containerId || 'loansAdvancesContent';
    showSpinner(target);
    // employeeListData is normally populated by loadControlPanel(), but this screen can be
    // opened directly from the sidebar without ever visiting Employee Master — in which case
    // it would still be null and the employee dropdown would render empty.
    const needEmployees = !employeeId && !employeeListData;
    const [loansRes, advRes, empRes] = await Promise.all([
      apiHRMS({ action: 'get_loans_data', employee_id: employeeId || null }),
      apiHRMS({ action: 'get_advances_data', employee_id: employeeId || null }),
      needEmployees ? apiHR({ action: 'get_employee_list' }) : Promise.resolve(null),
    ]);
    if (empRes && empRes.success) employeeListData = empRes.employees;
    if (!loansRes.success) {
      document.getElementById(target).innerHTML = `<div class="msg error" style="display:block">${loansRes.error}</div>`;
      return;
    }
    if (!advRes.success) {
      document.getElementById(target).innerHTML = `<div class="msg error" style="display:block">${advRes.error}</div>`;
      return;
    }
    loansData = loansRes.loans;
    advancesData = advRes.advances;
    renderLoansAdvances(employeeId, target);
  }

  function renderLoansAdvances(employeeId, containerId) {
    const target = containerId || 'loansAdvancesContent';
    const scoped = !!employeeId;
    const canCreate = isOwnerUser || myPermissionKeys.includes('loans_advances.create');
    const canEdit = isOwnerUser || myPermissionKeys.includes('loans_advances.edit');

    const html = `<div class="panel panel-no-clip">
      <div class="panel-header" style="flex-wrap:wrap; gap:10px;">
        <span class="panel-title">Loans &amp; Advances</span>
        ${!scoped ? `<input type="text" id="laSearch" placeholder="Search employee…" value="${laSearchQuery}" style="font-size:12.5px; padding:6px 10px; border-radius:6px; border:1px solid var(--border); min-width:200px;" />` : ''}
      </div>
      <div class="subtabs" id="laTabs">
        <button type="button" class="subtab-item la-tab-btn ${laActiveTab === 'loans' ? 'active' : ''}" data-latab="loans">Loans</button>
        <button type="button" class="subtab-item la-tab-btn ${laActiveTab === 'advances' ? 'active' : ''}" data-latab="advances">Advances</button>
      </div>
      <div class="panel-body">
        <div class="la-pane" data-lapane="loans" style="${laActiveTab === 'loans' ? '' : 'display:none;'}">${renderLoansPane(employeeId, scoped, canCreate, canEdit)}</div>
        <div class="la-pane" data-lapane="advances" style="${laActiveTab === 'advances' ? '' : 'display:none;'}">${renderAdvancesPane(employeeId, scoped, canCreate, canEdit)}</div>
      </div>
    </div>`;

    document.getElementById(target).innerHTML = html;

    document.querySelectorAll('.la-tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        laActiveTab = btn.dataset.latab;
        document.querySelectorAll('.la-tab-btn').forEach(b => b.classList.toggle('active', b.dataset.latab === laActiveTab));
        document.querySelectorAll('.la-pane').forEach(p => { p.style.display = p.dataset.lapane === laActiveTab ? '' : 'none'; });
      });
    });
    document.getElementById('laSearch')?.addEventListener('input', (ev) => {
      laSearchQuery = ev.target.value;
      renderLoansAdvances(employeeId, target);
    });

    wireLoansPane(employeeId, target);
    wireAdvancesPane(employeeId, target);
  }

  // ---------------- LOANS PANE ----------------
  function renderLoansPane(employeeId, scoped, canCreate, canEdit) {
    let rows = loansData || [];
    if (loanStatusFilter === 'open') rows = rows.filter(l => laIsOpen(l.status));
    else if (loanStatusFilter !== 'all') rows = rows.filter(l => l.status === loanStatusFilter);
    if (!scoped && laSearchQuery) {
      const q = laSearchQuery.toLowerCase();
      rows = rows.filter(l => (l.employees?.name || '').toLowerCase().includes(q) || (l.employees?.employee_code || '').toLowerCase().includes(q));
    }
    const totalOutstanding = rows.filter(l => laIsOpen(l.status)).reduce((s, l) => s + Number(l.balance), 0);

    return `
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:12px;">
        <p style="font-size:12px; color:var(--muted); margin:0;">Money lent to an employee, repaid over multiple months.</p>
        <div style="display:flex; gap:8px; align-items:center;">
          <select id="loanStatusFilter" style="font-size:12.5px; padding:6px 10px; border-radius:6px; border:1px solid var(--border);">
            <option value="open" ${loanStatusFilter === 'open' ? 'selected' : ''}>Active</option>
            <option value="completed" ${loanStatusFilter === 'completed' ? 'selected' : ''}>Closed</option>
            <option value="cancelled" ${loanStatusFilter === 'cancelled' ? 'selected' : ''}>Cancelled</option>
            <option value="all" ${loanStatusFilter === 'all' ? 'selected' : ''}>All</option>
          </select>
          ${canCreate ? `<button class="btn btn-sm" id="loanAddBtn">+ New Loan</button>` : ''}
        </div>
      </div>
      ${loanStatusFilter === 'open' && rows.length > 0 ? `<div style="padding:10px 14px; background:var(--surface-sunken); border:1px solid var(--border); border-radius:6px; margin-bottom:14px; font-size:13px;">Total outstanding: <strong>${fmtMoney(totalOutstanding)}</strong></div>` : ''}
      <div class="table-scroll">
        <table class="ledger"><thead><tr>
          ${!scoped ? '<th>Employee</th>' : ''}
          <th>Amount</th><th>Repaid</th><th>Balance</th><th>Disbursed</th><th>Schedule</th><th>Status</th><th>Action</th>
        </tr></thead><tbody>
          ${rows.length === 0 ? `<tr><td colspan="${scoped ? 7 : 8}" style="text-align:center; color:var(--muted); padding:16px;">No ${loanStatusFilter === 'all' ? '' : (LOAN_FILTER_LABEL[loanStatusFilter] || loanStatusFilter) + ' '}loans.</td></tr>` : rows.map(l => `
            <tr class="${laIsOpen(l.status) ? 'row-open' : 'row-approved'}">
              ${!scoped ? `<td><strong>${l.employees?.name || '—'}</strong><div style="font-size:11px; color:var(--muted);">${l.employees?.employee_code || ''}</div></td>` : ''}
              <td>${fmtMoney(l.principal_amount)}</td>
              <td>${fmtMoney(l.total_repaid)}</td>
              <td><strong style="color:${Number(l.balance) > 0 ? 'var(--danger)' : 'var(--green)'};">${fmtMoney(l.balance)}</strong></td>
              <td>${fmtShortDate(l.disbursed_on)}</td>
              <td style="font-size:12px;">${l.monthly_deduction ? fmtMoney(l.monthly_deduction) + '/mo' : (l.total_installments ? l.total_installments + ' installments' : '—')}</td>
              <td><span class="status-tag ${laStatusTagClass(l.status)}">${LOAN_STATUS_LABEL[l.status] || l.status}</span></td>
              <td class="action-cell">
                <div style="display:flex; gap:4px; flex-wrap:wrap;">
                  <button class="btn btn-sm btn-outline loan-history-btn" data-id="${l.id}">History</button>
                  ${l.status === 'approved' && canEdit ? `<button class="btn btn-sm loan-repay-btn" data-id="${l.id}">+ Repayment</button>` : ''}
                </div>
              </td>
            </tr>
            <tr class="loan-history-row" data-history-for="${l.id}" style="display:none;">
              <td colspan="${scoped ? 7 : 8}" style="background:var(--surface-sunken); padding:12px 16px;">
                ${l.reason ? `<div style="font-size:12.5px; margin-bottom:8px;"><strong>Reason:</strong> ${l.reason}</div>` : ''}
                ${l.transactions.length === 0 ? '<div style="font-size:12.5px; color:var(--muted);">No repayments recorded yet.</div>' : `
                  <table class="ledger" style="background:#fff;"><thead><tr><th>Date</th><th>Amount</th><th>Type</th><th>Payroll Month</th><th>Notes</th></tr></thead><tbody>
                    ${l.transactions.map(t => `<tr><td>${fmtShortDate(t.txn_date)}</td><td>${fmtMoney(t.amount)}</td><td>${t.txn_type}</td><td>${fmtPeriod(t.payroll_period)}</td><td>${t.notes || '—'}</td></tr>`).join('')}

            </tr>`).join('')}

  }

  function wireLoansPane(employeeId, target) {
    document.getElementById('loanStatusFilter')?.addEventListener('change', (ev) => {
      loanStatusFilter = ev.target.value;
      renderLoansAdvances(employeeId, target);
    });
    document.querySelectorAll('.loan-history-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const row = document.querySelector(`.loan-history-row[data-history-for="${btn.dataset.id}"]`);
        const showing = row.style.display !== 'none';
        row.style.display = showing ? 'none' : 'table-row';

      });

    document.getElementById('loanAddBtn')?.addEventListener('click', () => renderLoanForm(employeeId, target));
    document.querySelectorAll('.loan-repay-btn').forEach(btn => {
      btn.addEventListener('click', () => renderRepaymentForm(btn.dataset.id, employeeId, target));
    });
  }

  // ---------------- ADVANCES PANE ----------------
  function renderAdvancesPane(employeeId, scoped, canCreate, canEdit) {
    let rows = advancesData || [];
    if (advanceStatusFilter === 'open') rows = rows.filter(a => laIsOpen(a.status));
    else if (advanceStatusFilter !== 'all') rows = rows.filter(a => a.status === advanceStatusFilter);
    if (!scoped && laSearchQuery) {
      const q = laSearchQuery.toLowerCase();
      rows = rows.filter(a => (a.employees?.name || '').toLowerCase().includes(q) || (a.employees?.employee_code || '').toLowerCase().includes(q));
    }
    const totalOutstanding = rows.filter(a => laIsOpen(a.status)).reduce((s, a) => s + Number(a.outstanding), 0);

    return `
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:12px;">
        <p style="font-size:12px; color:var(--muted); margin:0;">Salary paid early, recovered from that month's salary. Any shortfall carries to the next month.</p>
        <div style="display:flex; gap:8px; align-items:center;">
          <select id="advStatusFilter" style="font-size:12.5px; padding:6px 10px; border-radius:6px; border:1px solid var(--border);">
            <option value="open" ${advanceStatusFilter === 'open' ? 'selected' : ''}>Outstanding</option>

    openModal('New Loan', `

        <div class="field"><label>Disbursed On *</label><input type="date" id="ln_date" value="${new Date().toISOString().split('T')[0]}" /></div>

      <button class="btn" id="lnSaveBtn">Save Loan</button>

    document.getElementById('ln_method').addEventListener('change', (ev) => {
      const monthly = ev.target.value === 'monthly';
      document.getElementById('ln_monthly_field').style.display = monthly ? 'block' : 'none';
      document.getElementById('ln_inst_field').style.display = monthly ? 'none' : 'block';
    });
    document.getElementById('lnCancelBtn').addEventListener('click', closeModal);

    document.getElementById('lnSaveBtn').addEventListener('click', async () => {
      const msg = document.getElementById('lnMsg');
      msg.className = 'msg';
      const method = document.getElementById('ln_method').value;
      const loan = {
        employee_id: employeeId || document.getElementById('ln_employee').value,
        principal_amount: document.getElementById('ln_amount').value,
        disbursed_on: document.getElementById('ln_date').value,
        monthly_deduction: method === 'monthly' ? document.getElementById('ln_monthly').value : null,
        total_installments: method === 'installments' ? document.getElementById('ln_installments').value : null,
        reason: document.getElementById('ln_reason').value.trim() || null,
      };
      if (!loan.employee_id) { msg.className = 'msg error'; msg.textContent = 'Please select an employee.'; return; }
      if (!loan.principal_amount || Number(loan.principal_amount) <= 0) { msg.className = 'msg error'; msg.textContent = 'Amount must be greater than zero.'; return; }
      if (!loan.disbursed_on) { msg.className = 'msg error'; msg.textContent = 'Disbursed On date is required.'; return; }
      if (method === 'monthly' && !loan.monthly_deduction) { msg.className = 'msg error'; msg.textContent = 'Enter the monthly deduction amount.'; return; }
      if (method === 'installments' && !loan.total_installments) { msg.className = 'msg error'; msg.textContent = 'Enter the number of installments.'; return; }

      const btn = document.getElementById('lnSaveBtn');
      setButtonLoading(btn, true, 'Saving');
      const res = await apiHRMS({ action: 'create_loan', loan });
      setButtonLoading(btn, false);
      if (!res.success) { msg.className = 'msg error'; msg.textContent = res.error; return; }
      closeModal();
      loadLoansAdvances(employeeId, target);
    });
  }

      setButtonLoading(btn, false);

  function renderAdvanceRecoveryForm(advanceId, employeeId, target) {
    const adv = (advancesData || []).find(a => a.id === advanceId);
    if (!adv) return;
    // Default to recovering the whole outstanding amount — full recovery from that month's
    // salary is the normal case; a partial amount means a shortfall that carries forward.
    const nextMonth = (() => {
      const [y, m] = (adv.payroll_period || new Date().toISOString().slice(0,7)).split('-').map(Number);
      const d = new Date(y, m, 1); // m is already 1-based, so this lands on the next month
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    })();

    openModal(`Record Recovery — ${adv.employees?.name || ''}`, `
      <div style="padding:10px 12px; background:var(--surface-sunken); border:1px solid var(--border); border-radius:6px; margin-bottom:14px; font-size:13px;">
        Outstanding: <strong>${fmtMoney(adv.outstanding)}</strong> · Advance against salary of <strong>${fmtPeriod(adv.payroll_period)}</strong>
      </div>
      <div class="form-grid">
        <div class="field"><label>Amount Recovered (₹) *</label><input type="number" id="rec_amount" min="0.01" step="0.01" value="${adv.outstanding}" /></div>
        <div class="field"><label>If Short, Carry To</label><input type="month" id="rec_carry" value="${nextMonth}" /></div>
      </div>
      <p style="font-size:11.5px; color:var(--muted); margin:10px 0 0;">Recovering the full outstanding amount closes this advance. Recovering less leaves the remainder outstanding and moves it to the month above.</p>
      <div class="msg" id="recMsg"></div>
    `, `
      <button class="btn btn-outline" id="recCancelBtn">Cancel</button>
      <button class="btn" id="recSaveBtn">Record Recovery</button>
    `);

    document.getElementById('recCancelBtn').addEventListener('click', closeModal);
    document.getElementById('recSaveBtn').addEventListener('click', async () => {
      const msg = document.getElementById('recMsg');
      msg.className = 'msg';
      const amount = document.getElementById('rec_amount').value;
      if (!amount || Number(amount) <= 0) { msg.className = 'msg error'; msg.textContent = 'Amount must be greater than zero.'; return; }

      const btn = document.getElementById('recSaveBtn');
      setButtonLoading(btn, true, 'Recording');
      const res = await apiHRMS({
        action: 'record_advance_recovery',
        advance_id: advanceId,
        amount,
        carry_forward_period: document.getElementById('rec_carry').value || null,
      });
      setButtonLoading(btn, false);
      if (!res.success) { msg.className = 'msg error'; msg.textContent = res.error; return; }
      closeModal();
      if (res.fully_recovered) alert('Fully recovered — this advance is now closed.');
      loadLoansAdvances(employeeId, target);
    });
  }

  function renderEmployeeMasterList() {
    if (!employeeListData) {
      document.getElementById('hrtab-employee-master').innerHTML = '<div class="empty-state">Loading...</div>';
      return;
    }

    const rawSearchQ = empListSearchQuery.trim();
    const searchQ = rawSearchQ.toLowerCase();
    const filtered = employeeListData.filter(e => {
      const statusMatch = empListStatusFilter === 'all' ? true
        : empListStatusFilter === 'active_suspended' ? (e.status === 'active' || e.status === 'suspended')
        : e.status === empListStatusFilter;
      if (!statusMatch) return false;
      if (!searchQ) return true;
      const haystack = [e.name, e.departments?.name, e.employee_code, e.mobile_number, e.designations?.name].filter(Boolean).join(' ').toLowerCase();
      return haystack.includes(searchQ);
    });

    // Group by department
    const groups = {};
    filtered.forEach(e => {
      const deptName = e.departments?.name || 'Unassigned';
      if (!groups[deptName]) groups[deptName] = [];
      groups[deptName].push(e);
    });
    const deptNames = Object.keys(groups).sort((a, b) => a.localeCompare(b));
    const DEPT_COLORS = ['#2563a8', '#0f766e', '#7c3aed', '#b45309', '#be123c', '#4d7c0f', '#0369a1', '#9333ea', '#b91c1c', '#15803d'];

        if (!confirm(`Are you sure you want to ${statusLabel} this employee?`)) return;
        setButtonLoading(btn, true, '');
        const res = await apiHR({ action: 'update_employee_status', employee_id: btn.dataset.id, new_status: btn.dataset.status });
        if (res.success) {
          const idx = employeeListData.findIndex(e => e.id === btn.dataset.id);
          if (idx >= 0) employeeListData[idx].status = res.employee.status;
          renderEmployeeMasterList();

  // ============ EMPLOYEE VIEW (read-only) ============
  async function openEmployeeView(employeeId) {

      return;

    renderEmployeeView(res);

  function wireMultiSelectDropdown(id) {
    const trigger = document.getElementById(`${id}-trigger`);
    const panel = document.getElementById(`${id}-panel`);
    const display = document.getElementById(`${id}-display`);
    if (!trigger || !panel) return;
    trigger.addEventListener('click', (ev) => {
      ev.stopPropagation();
      document.querySelectorAll('.msdd-panel').forEach(p => { if (p !== panel) p.style.display = 'none'; });
      panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    });
    document.addEventListener('click', (ev) => {
      if (panel.style.display !== 'none' && !panel.contains(ev.target) && ev.target !== trigger) panel.style.display = 'none';
    });
    panel.querySelectorAll('.msdd-checkbox').forEach(cb => {
      cb.addEventListener('change', () => {
        const selected = [...panel.querySelectorAll('.msdd-checkbox:checked')].map(c => c.dataset.value);
        display.textContent = selected.length ? selected.join(', ') : 'Select...';
      });
    });

  // Reusable real-time field validation — validates on blur (as soon as focus leaves the field),
  // shows red border + inline error message immediately, clears as soon as it's corrected.
  const VALIDATORS = {
    pan: { test: v => /^[A-Z]{5}[0-9]{4}[A-Z]$/.test(v), message: 'Invalid PAN format (should be AAAAA9999A)' },
    gstin: { test: v => /^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][0-9A-Z]Z[0-9A-Z]$/.test(v), message: 'Invalid GSTIN format' },
    aadhar: { test: v => /^[0-9]{12}$/.test(v.replace(/\s/g, '')), message: 'Aadhar must be exactly 12 digits' },
    mobile: { test: v => /^[6-9][0-9]{9}$/.test(v), message: 'Invalid mobile number (10 digits, starting 6-9)' },
    ifsc: { test: v => /^[A-Z]{4}0[0-9A-Z]{6}$/.test(v), message: 'Invalid IFSC format (should be AAAA0999999)' },
    pincode: { test: v => /^[1-9][0-9]{5}$/.test(v), message: 'Invalid pincode (6 digits)' },
    email: { test: v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v), message: 'Invalid email address' },
  };

  function wireFieldValidation(fieldId, validatorKey, options = {}) {
    const el = document.getElementById(fieldId);
    if (!el) return;
    const validator = VALIDATORS[validatorKey];
    if (!validator) return;

    let errorEl = document.getElementById(fieldId + '_inlineError');
    if (!errorEl) {
      errorEl = document.createElement('div');
      errorEl.id = fieldId + '_inlineError';
      errorEl.className = 'field-inline-error';
      el.insertAdjacentElement('afterend', errorEl);
    }

    function check() {
      const raw = el.value.trim();
      const val = options.uppercase ? raw.toUpperCase() : raw;
      if (options.uppercase && el.value !== val) el.value = val;
      if (!val) { // empty is fine here — mandatory-ness is a separate, submit-time check
        el.classList.remove('field-error-highlight');
        errorEl.style.display = 'none';
        return;
      }
      if (!validator.test(val)) {
        el.classList.add('field-error-highlight');
        errorEl.textContent = validator.message;
        errorEl.style.display = 'block';
      } else {
        el.classList.remove('field-error-highlight');
        errorEl.style.display = 'none';
      }
    }
    el.addEventListener('blur', check);
    el.addEventListener('input', () => {
      // Clear the red state as soon as they start fixing it — full re-check happens again on next blur
      if (el.classList.contains('field-error-highlight')) {
        el.classList.remove('field-error-highlight');
        errorEl.style.display = 'none';
      }
    });
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // Files selected are held here until the employee is saved (create or update),
  // since a brand-new employee doesn't have an ID yet to attach files to.
  let pendingUploads = {};

  function wireDocUploadTrigger(slot, options = {}) {
    const btn = document.getElementById(`uploadBtn_${slot}`);
    const input = document.getElementById(`upload_${slot}`);
    if (!btn || !input) return;
    btn.addEventListener('click', () => input.click());
    input.addEventListener('change', async (ev) => {
      const file = ev.target.files[0];
      if (!file) return;
      const base64 = await fileToBase64(file);
      const ext = file.name.split('.').pop().toLowerCase();
      pendingUploads[slot] = { base64, ext, document_name: options.documentName || slot };
      if (options.isPhoto) {
        document.getElementById('photoStatusInput').value = `Selected: ${file.name} (will save with the form)`;
        document.getElementById('photoPreviewBox').innerHTML = `<img src="${base64}" style="width:38px; height:38px; object-fit:cover; border-radius:6px; border:1px solid var(--border);" />`;
      } else {
        const status = document.getElementById(`uploadStatus_${slot}`);
        if (status) status.textContent = `Selected: ${file.name} (will save with the form)`;
      }
    });
  }

  function setupDocumentUploadTriggers(documents) {
    pendingUploads = {};
    wireDocUploadTrigger('photo', { isPhoto: true });
    wireDocUploadTrigger('aadhar');
    wireDocUploadTrigger('driving_license');
    wireDocUploadTrigger('pf_certificate');
    wireDocUploadTrigger('esi_certificate');
  }

  // Inline single-row "Add" form + ledger table with Edit/Delete, matching HR Dropdowns pattern
  function setupRepeatableSection(containerId, initialRows, fields, addLabel) {
    const container = document.getElementById(containerId);
    let rows = initialRows.length > 0 ? [...initialRows] : [];
    let editingIndex = null;
    let formOpen = false;

    function fieldInputHtml(f, val) {
      if (f.type === 'select') {
        return `<select data-key="${f.key}" style="min-width:140px;">${opt(f.options, val)}</select>`;
      }
      if (f.type === 'checkbox') {
        return `<label style="display:flex; align-items:center; gap:5px; font-size:12.5px; color:var(--muted); white-space:nowrap; padding-bottom:10px;"><input type="checkbox" data-key="${f.key}" ${val ? 'checked' : ''} style="width:auto;" />${f.label}</label>`;
      }
      return `<input type="${f.type || 'text'}" data-key="${f.key}" value="${val ?? ''}" placeholder="${f.label}" style="min-width:130px;" />`;
    }

    function displayVal(f, row) {
      if (f.type === 'select') return (f.options || []).find(o => o.id === row[f.key])?.name || '—';
      if (f.type === 'checkbox') return row[f.key] ? 'Yes' : 'No';
      return row[f.key] || '—';
    }

    function render() {
      const editingRow = editingIndex !== null ? rows[editingIndex] : {};
      const showForm = formOpen || editingIndex !== null;

      const formRowHtml = showForm ? `
        <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:end; padding:14px; background:var(--surface); border:1px solid var(--border); border-radius:8px; margin-bottom:12px;">
          ${fields.map(f => {
            const val = f.type === 'checkbox' ? editingRow[f.key] : (editingRow[f.key] ?? '');
            const label = (f.required ? f.label + ' *' : f.label);
            return `<div class="field" style="margin-bottom:0;">${f.type !== 'checkbox' ? `<label>${label}</label>` : ''}${fieldInputHtml(f, val)}</div>`;
          }).join('')}
          <button type="button" class="btn btn-sm" id="${containerId}-addBtn">${editingIndex !== null ? 'Update' : 'Add'}</button>
          <button type="button" class="btn btn-sm btn-outline" id="${containerId}-cancelEditBtn">Cancel</button>
        </div>` : `
        <button type="button" class="btn btn-sm btn-outline" id="${containerId}-openBtn" style="margin-bottom:12px;">+ ${addLabel || 'Add'}</button>`;

      const tableHtml = `
        <div class="table-scroll">
          <table class="ledger"><thead><tr>
            ${fields.map(f => `<th>${f.label}</th>`).join('')}<th>Action</th>
          </tr></thead><tbody>
            ${rows.length === 0 ? `<tr><td colspan="${fields.length + 1}" style="text-align:center; color:var(--muted); padding:16px;">None added yet.</td></tr>` : rows.map((row, idx) => `
              <tr>
                ${fields.map(f => `<td data-label="${f.label}">${displayVal(f, row)}</td>`).join('')}
                <td data-label="Action" class="action-cell">
                  <div style="display:flex; gap:4px;">
                    <button type="button" class="icon-btn ${containerId}-editBtn" data-idx="${idx}" title="Edit">${ACTION_ICONS.edit}</button>
                    <button type="button" class="icon-btn icon-btn-danger ${containerId}-deleteBtn" data-idx="${idx}" title="Delete">${ACTION_ICONS.exit}</button>
                  </div>
                </td>
              </tr>`).join('')}
          </tbody></table>
        </div>`;

      container.innerHTML = formRowHtml + tableHtml;

      document.getElementById(`${containerId}-openBtn`)?.addEventListener('click', () => {
        formOpen = true;
        render();
      });

      document.getElementById(`${containerId}-addBtn`)?.addEventListener('click', () => {
        const newRow = {};
        fields.forEach(f => {
          const input = container.querySelector(`[data-key="${f.key}"]`);
          if (!input) return;
          newRow[f.key] = f.type === 'checkbox' ? input.checked : input.value.trim();
        });

        // Block entirely blank rows
        const anyFilled = fields.some(f => {
          const v = newRow[f.key];
          return f.type === 'checkbox' ? false : !!v;
        });
        if (!anyFilled) {
          alert('Please fill in at least the required fields before adding.');
          return;
        }
        // Block if a required field is missing
        const missingRequired = fields.find(f => f.required && !newRow[f.key]);
        if (missingRequired) {
          alert(`"${missingRequired.label}" is required.`);
          return;
        }

        if (editingIndex !== null) {
          rows[editingIndex] = newRow;
          editingIndex = null;
        } else {
          rows.push(newRow);
        }
        formOpen = false;
        render();
      });

      document.getElementById(`${containerId}-cancelEditBtn`)?.addEventListener('click', () => {
        editingIndex = null;
        formOpen = false;
        render();
      });

      container.querySelectorAll(`.${containerId}-editBtn`).forEach(btn => {
        btn.addEventListener('click', () => {
          editingIndex = Number(btn.dataset.idx);
          render();
        });
      });
      container.querySelectorAll(`.${containerId}-deleteBtn`).forEach(btn => {
        btn.addEventListener('click', () => {
          if (!confirm('Remove this entry?')) return;
          rows.splice(Number(btn.dataset.idx), 1);
          if (editingIndex === Number(btn.dataset.idx)) editingIndex = null;
          render();
        });
      });
    }

    container.getRows = () => rows;
    render();
  }

      permanent_state_id: val('f_permanent_state_id') || null,
      permanent_pincode: val('f_permanent_pincode'),

      driving_license_number: hasDrivingLicense ? val('f_driving_license_number') : null,
      driving_license_category: hasDrivingLicense ? val('f_driving_license_category') : null,

      emergency_contact_name: val('f_emergency_contact_name'),
      emergency_contact_relation: val('f_emergency_contact_relation'),
      emergency_contact_mobile: val('f_emergency_contact_mobile'),
      emergency_contact_address: val('f_emergency_contact_address'),
      salary_payment_method: paymentMethod,
      bank_name: val('f_bank_name'),
      bank_account_number: val('f_bank_account_number'),
      bank_ifsc: val('f_bank_ifsc'),
      bank_branch: val('f_bank_branch'),
      bank_account_holder_name: val('f_bank_account_holder_name'),
      pan_number: val('f_pan_number'),
      uan_number: val('f_uan_number'),
      salary_basic: val('f_salary_basic'),
      salary_hra: val('f_salary_hra'),
      salary_da: val('f_salary_da'),

      ref_employee_contact: val('f_ref_employee_contact'),

    // ---------- Mandatory field validation ----------
    const errors = [];
    const err = (label, targetId) => errors.push({ label, targetId });
    if (!core.employee_code) err('Employee Code', 'f_employee_code');
    if (!core.name) err('Full Name', 'f_name');
    if (!core.mobile_number) err('Mobile Number', 'f_mobile_number');
    if (!core.branch_id) err('Branch', 'f_branch_id');
    if (!core.department_id) err('Department', 'f_department_id');
    if (!core.designation_id) err('Designation', 'f_designation_id');
    if (!core.employee_category_id) err('Employee Category', 'f_employee_category_id');
    if (!core.date_of_joining) err('Date of Joining', 'f_date_of_joining');
    if (!core.wage_type) err('Wage Type', 'f_wage_type');
    if (vehicleApplicable) {
      if (!core.vehicle_number) err('Vehicle Number', 'f_vehicle_number');
      if (!core.rate_per_km) err('Rate per KM', 'f_rate_per_km');
      if (!core.driving_license_number) err('Driving License No (required since Vehicle KM is applicable)', 'f_driving_license_number');
      if (!hasDoc('driving_license')) err('Driving License Upload (required since Vehicle KM is applicable)', 'uploadBtn_driving_license');
    }
    if (!core.father_husband_name) err('Father/Husband Name', 'f_father_husband_name');
    if (!core.marital_status) err('Marital Status', 'f_marital_status');
    if (!core.gender) err('Gender', 'f_gender');
    if (!core.date_of_birth) err('Date of Birth', 'f_date_of_birth');
    if (!core.aadhar_no) err('Aadhar No', 'f_aadhar_no');
    if (!hasDoc('aadhar')) err('Aadhar Card Upload', 'uploadBtn_aadhar');
    if (!core.present_address) err('Present Address', 'f_present_address');
    if (!core.present_state_id) err('Present State', 'f_present_state_id');
    if (!core.present_city_id) err('Present City', 'f_present_city_id');
    if (!checked('f_same_as_present')) {
      if (!core.permanent_address) err('Permanent Address', 'f_permanent_address');
      if (!core.permanent_state_id) err('Permanent State', 'f_permanent_state_id');
      if (!core.permanent_city_id) err('Permanent City', 'f_permanent_city_id');
    }
    if (core.driving_license_number && !core.driving_license_validity) err('License Validity (since License No is filled)', 'f_driving_license_validity');
    if (!core.emergency_contact_name) err('Emergency Contact Name', 'f_emergency_contact_name');
    if (!core.emergency_contact_relation) err('Emergency Contact Relation', 'f_emergency_contact_relation');
    if (!core.emergency_contact_mobile) err('Emergency Contact Mobile', 'f_emergency_contact_mobile');
    if (paymentMethod === 'bank') {
      if (!core.bank_name) err('Bank Name (Payment Method = Bank)', 'f_bank_name');
      if (!core.bank_account_number) err('Account Number (Payment Method = Bank)', 'f_bank_account_number');
      if (!core.bank_ifsc) err('IFSC Code (Payment Method = Bank)', 'f_bank_ifsc');
    }
    if (pfApplicable) {
      if (!core.pf_number) err('PF Number', 'f_pf_number');
      if (!core.uan_number) err('UAN Number', 'f_uan_number');
      if (!hasDoc('pf_certificate')) err('PF Certificate Upload', 'uploadBtn_pf_certificate');
    }
    if (esiApplicable) {
      if (!core.esi_number) err('ESI Number', 'f_esi_number');
      if (!hasDoc('esi_certificate')) err('ESI Certificate Upload', 'uploadBtn_esi_certificate');
    }
    if (!core.salary_basic) err('Salary Basic', 'f_salary_basic');
    if (!hasDoc('photo')) err('Photo Upload', 'uploadBtn_photo');

    if (educationRows.length === 0) err('At least one Education / Qualification entry', 'educationRows');
    const familyRows = document.getElementById('familyRows').getRows();
    familyRows.forEach((r, i) => { if (!r.member_name) err(`Family row ${i + 1}: Name`, 'familyRows'); });
    const workRows = document.getElementById('workRows').getRows();
    workRows.forEach((r, i) => { if (!r.company_name) err(`Work Experience row ${i + 1}: Company Name`, 'workRows'); });

    // Clear any previous error highlighting
    document.querySelectorAll('.field-error-highlight').forEach(el => el.classList.remove('field-error-highlight'));

    if (errors.length > 0) {
      // Highlight every field that has an error
      errors.forEach(e => {
        const el = document.getElementById(e.targetId);
        if (el) el.classList.add('field-error-highlight');
      });

      msg.className = 'msg error';
      msg.innerHTML = 'Please complete the following before saving:<br>• ' + errors.map(e => e.label).join('<br>• ');

      // Jump to and focus the first error field
      const firstEl = document.getElementById(errors[0].targetId);
      if (firstEl) {
        firstEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        setTimeout(() => firstEl.focus?.(), 350);
      }
      return;
    }

    setButtonLoading(btn, true, 'Saving');

    let empResult;
    if (employeeId) {
      empResult = await apiHR({ action: 'update_employee', employee_id: employeeId, core });
    } else {
      empResult = await apiHR({ action: 'create_employee', core, pin: null });
    }

    if (!empResult.success) {
      msg.className = 'msg error';
      msg.textContent = empResult.error || 'Failed to save employee.';
      setButtonLoading(btn, false);
      return;
    }

    const finalEmployeeId = empResult.employee.id;

    // Save all child record sections
    const childSaves = [
      apiHR({ action: 'save_child_records', employee_id: finalEmployeeId, table: 'employee_family_members', records: familyRows }),
      apiHR({ action: 'save_child_records', employee_id: finalEmployeeId, table: 'employee_education', records: educationRows }),
      apiHR({ action: 'save_child_records', employee_id: finalEmployeeId, table: 'employee_work_experience', records: workRows }),
      apiHR({ action: 'save_child_records', employee_id: finalEmployeeId, table: 'employee_nominees', records: document.getElementById('nomineeRows').getRows() }),
    ];

    // Upload any pending documents now that we have a real employee_id
    const uploadSaves = Object.entries(pendingUploads).map(([slot, data]) =>
      apiHR({ action: 'upload_document', employee_id: finalEmployeeId, slot, file_base64: data.base64, file_ext: data.ext, document_name: data.document_name })
    );

    await Promise.all([...childSaves, ...uploadSaves]);
    pendingUploads = {};

    msg.className = 'msg success';
    msg.textContent = empResult.generatedPin
      ? `Employee saved successfully. Their login PIN is: ${empResult.generatedPin} (last 4 digits of mobile number). Share this with them.`
      : 'Employee saved successfully.';
    const listRes = await apiHR({ action: 'get_employee_list' });
    if (listRes.success) employeeListData = listRes.employees;
    setTimeout(() => renderEmployeeMasterList(), empResult.generatedPin ? 3500 : 800);
  }

  // --- Restore session on page refresh instead of forcing re-login ---
  function setNavCollapsed(collapsed) {
    const shell = document.getElementById('appShell');
    shell.classList.toggle('nav-collapsed', collapsed);
    sessionStorage.setItem('nav_collapsed', collapsed ? '1' : '0');
  }
  document.getElementById('navToggleBtn').addEventListener('click', () => {
    setNavCollapsed(!document.getElementById('appShell').classList.contains('nav-collapsed'));
  });

  /* ---- THE MENU DRAWER ON A PHONE ----
     Opens on the hamburger, closes on the backdrop, on Escape, and on picking
     anything — because a menu you have to close by hand after choosing is a
     menu that covers the thing you just chose. */
  function setNavOpen(open) {
    const shell = document.getElementById('appShell');
    const btn = document.getElementById('navOpenBtn');
    shell.classList.toggle('nav-open', open);
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    btn.setAttribute('aria-label', open ? 'Close the menu' : 'Open the menu');
    // The page behind must not scroll under the drawer.
    document.body.style.overflow = open ? 'hidden' : '';
    if (open) {
      const first = document.querySelector('#sidebarNav .nav-item');
      if (first) first.focus();
    }
  }
  function navIsOpen() {
    return document.getElementById('appShell').classList.contains('nav-open');
  }
  document.getElementById('navOpenBtn').addEventListener('click', () => setNavOpen(!navIsOpen()));
  document.getElementById('navBackdrop').addEventListener('click', () => setNavOpen(false));
  // Picking anything closes it. Bound to the container once, so a menu item
  // added later is covered without anyone remembering to bind it.
  document.getElementById('sidebarNav').addEventListener('click', (e) => {
    if (e.target.closest('.nav-item')) setNavOpen(false);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && navIsOpen()) { setNavOpen(false); document.getElementById('navOpenBtn').focus(); }
  });
  // Turning the phone sideways into a desk width must not leave the page
  // frozen with body overflow hidden and a drawer nobody can see.
  window.addEventListener('resize', () => {
    if (window.innerWidth > 880 && navIsOpen()) setNavOpen(false);
  });
  if (sessionStorage.getItem('nav_collapsed') === '1') {
    document.getElementById('appShell').classList.add('nav-collapsed');
  }
  // Tooltips for the collapsed state, taken from each item's own label.
  document.querySelectorAll('#sidebarNav .nav-item').forEach(btn => {
    const label = btn.querySelector('.nav-label')?.textContent?.trim();
    if (label) btn.setAttribute('data-tip', label);
  });
  // Clicking a group while collapsed would otherwise appear to do nothing, since the
  // child list is hidden — so expand the sidebar first, then let the normal toggle run.
  document.querySelectorAll('#sidebarNav .nav-parent').forEach(btn => {
    btn.addEventListener('click', () => {
      if (document.getElementById('appShell').classList.contains('nav-collapsed')) setNavCollapsed(false);
    }, true);
  });

    vendor_master: 'Vendor Master',
    vendor_data_bank: 'Vendor Data Bank',
    admin_permissions: 'Who Can Do What',

    admin_audit: 'Audit Trail',
  };
  // The locked five. There is no Delete column and there never should be:
  // nothing in this ERP is deleted, wrong entries are cancelled, and the
  // cancellation is itself an event. See migration 48.
  const ACTION_ORDER = ['view', 'create', 'edit', 'approve', 'cancel'];
  const ACTION_LABELS = { view: 'See', create: 'Add', edit: 'Change', approve: 'Approve', cancel: 'Cancel' };
  const AVATAR_COLORS = ['#2563a8', '#0f766e', '#7c3aed', '#b45309', '#be123c', '#4d7c0f', '#0369a1', '#9333ea'];

  let selectedPermEmployeeId = null;
  let permSearchQuery = '';
  let permDeptFilter = 'all';
  let permStatusFilter = 'all';
  let pendingGrantedIds = null; // working set of permission_ids for the selected employee, null until loaded
  let permDirty = false;

  async function loadAdminPanel() {
    adminPanelLoaded = true;
    showSpinner('adminPanelContent');
    const res = await apiPermissions({ action: 'get_permissions_data' });
    if (res.success) {
      if (!requireLists(res, ['employees', 'permissions', 'grants'], 'adminPanelContent')) return;
      permissionsData = res;
    } else {
