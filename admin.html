<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>REF ERP — Admin</title>
<script>window.__BUILD_VERSION__ = '1789740928';</script>
<script>
(function() {
  function checkVersion() {
    fetch('version.txt?_=' + Date.now(), { cache: 'no-store' })
      .then(function(r) { return r.text(); })
      .then(function(v) {
        v = v.trim();
        if (v && v !== window.__BUILD_VERSION__) {
          window.location.href = window.location.pathname + '?_v=' + Date.now();
        }
      })
      .catch(function() {
        // Network hiccup — try again soon instead of silently waiting the full interval
        setTimeout(checkVersion, 8000);
      });
  }
  checkVersion();
  setInterval(checkVersion, 60000);
  // Also check immediately whenever the tab regains focus or the browser comes back online —
  // catches the case where a network drop caused the regular 60s checks to keep failing silently
  window.addEventListener('focus', checkVersion);
  window.addEventListener('online', checkVersion);
  document.addEventListener('visibilitychange', function() { if (!document.hidden) checkVersion(); });
})();
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');

  :root {
    --ink: #1a2229;
    --paper: #f4f6f8;
    --surface: #ffffff;
    --surface-sunken: #eef1f4;
    --border: #d8dee5;
    --steel: #2d4a5e;
    --steel-dark: #1f3547;
    --steel-tint: #e7edf1;
    --amber: #b7791f;
    --amber-bg: #fbf1de;
    --green: #2f7a52;
    --green-bg: #e7f3ec;
    --slate: #5b6b7a;
    --slate-bg: #eaedf0;
    --danger: #a13d33;
    --danger-bg: #fbeceb;
    --muted: #6b7684;
    --sidebar-w: 232px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    font-size: 14px;
  }
  h1, h2, h3, .label-face { font-family: 'Inter', sans-serif; }
  .mono { font-family: 'IBM Plex Mono', monospace; }

  .auth-card {
    width: 100%;
    max-width: 360px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 32px 26px;
  }
  .auth-brand { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 2px; color: var(--steel); margin-bottom: 4px; }
  .auth-title { font-size: 20px; font-weight: 650; margin: 0 0 22px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 5px; font-weight: 500; }
  .field input, .field select {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 11px;
    font-size: 14px;
    font-family: inherit;
    background: var(--surface-sunken);
    outline: none;
  }
  .field input:focus, .field select:focus { border-color: var(--steel); background: #fff; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 9px 16px;
    border-radius: 6px;
    border: 1px solid transparent;
    background: var(--steel);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
  }
  .btn:hover { background: var(--steel-dark); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.btn-loading {
    background: var(--muted) !important;
    color: #fff !important;
    cursor: wait;
    opacity: 1;
  }
  .btn.btn-loading::after {
    content: '';
    width: 12px; height: 12px;
    margin-left: 4px;
    border: 2px solid rgba(255,255,255,0.5);
    border-top-color: #fff;
    border-radius: 50%;
    display: inline-block;
    animation: btn-spin 0.6s linear infinite;
  }
  @keyframes btn-spin { to { transform: rotate(360deg); } }
  .btn-block { width: 100%; }
  .btn-outline { background: transparent; border-color: var(--border); color: var(--ink); }
  .btn-outline:hover { background: var(--surface-sunken); }
  .btn-danger { background: var(--danger); }
  .btn-danger:hover { background: #872f27; }
  .btn-sm { padding: 6px 11px; font-size: 12px; }

  .msg { margin-top: 12px; padding: 9px 11px; border-radius: 6px; font-size: 12.5px; display: none; line-height: 1.5; }
  .msg.error { display: block; background: var(--danger-bg); border: 1px solid #efd2cf; color: var(--danger); }
  .msg.success { display: block; background: var(--green-bg); border: 1px solid #cfe4d8; color: var(--green); }

  .app-shell { display: flex; min-height: 100vh; }

  .sidebar {
    width: var(--sidebar-w);
    background: var(--steel-dark);
    color: #fff;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  .sidebar-brand { padding: 22px 20px 18px; border-bottom: 1px solid rgba(255,255,255,0.1); }
  .sidebar-brand .name { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 1.5px; }
  .sidebar-brand .tag { font-size: 10.5px; color: rgba(255,255,255,0.55); letter-spacing: 1.5px; margin-top: 2px; }
  .sidebar-nav { flex: 1; padding: 14px 10px; }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 10px 12px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: rgba(255,255,255,0.72);
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    margin-bottom: 3px;
    border-left: 3px solid transparent;
    text-align: left;
  }
  .nav-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
  .nav-item.active { background: rgba(255,255,255,0.09); color: #fff; border-left-color: var(--amber); font-weight: 600; }
  .nav-item svg { flex-shrink: 0; width: 17px; height: 17px; }
  .nav-item .nav-label { flex: 1; }
  .nav-arrow { width: 12px !important; height: 12px !important; opacity: 0.45; transition: transform 0.15s ease; }
  .nav-item.nav-parent.expanded .nav-arrow { transform: rotate(90deg); }
  .nav-children { padding-left: 0; }
  .nav-item.level-2 { font-size: 12.5px; padding-left: 34px; }
  .nav-item.level-3 { font-size: 12px; padding-left: 46px; color: rgba(255,255,255,0.62); }
  .nav-item.level-3.active { color: #fff; }
  .nav-item.nav-parent.level-2 .nav-arrow { margin-left: auto; }
  .nav-section-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.32);
    padding: 12px 20px 4px 34px;
  }
  /* Distinct accent colors per icon, matching the reference's colorful style */
  .ic-blue { color: #5b9bd5; }
  .ic-slate { color: #9aa7b5; }
  .ic-teal { color: #4fb8a6; }
  .ic-purple { color: #b28ce0; }
  .ic-amber { color: var(--amber); }
  .sidebar-footer { padding: 14px 20px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 11.5px; color: rgba(255,255,255,0.5); }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 40;
  }
  .topbar-title { font-size: 17px; font-weight: 650; }
  .topbar-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .topbar-divider { width: 1px; align-self: stretch; margin: 2px 0; background: var(--border); }
  /* No buttons on this page means no divider to draw */
  #topbarActions:empty + .topbar-divider { display: none; }
  .user-chip { font-size: 12.5px; color: var(--muted); text-align: right; }
  .user-chip .name { color: var(--ink); font-weight: 600; }

  .content { padding: 24px 28px; flex: 1; }
  /* The salary sheet runs edge to edge and scrolls with the page rather than inside a box */
  .content.content-flush { padding: 0; }


  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 18px;
    overflow: hidden;
  }
  .panel.panel-no-clip { overflow: visible; }

  /* Collapsible sidebar */
  .sidebar { transition: width 0.16s ease; }
  .app-shell.nav-collapsed .sidebar { width: 52px; }
  .app-shell.nav-collapsed .sidebar .nav-label,
  .app-shell.nav-collapsed .sidebar .nav-arrow,
  .app-shell.nav-collapsed .sidebar .nav-section-label,
  .app-shell.nav-collapsed .sidebar .sidebar-brand .tag { display: none; }
  .app-shell.nav-collapsed .sidebar .nav-children { display: none !important; }
  .app-shell.nav-collapsed .sidebar .nav-item { justify-content: center; padding-left: 0; padding-right: 0; }
  /* At 52px wide there isn't room for the brand text and the toggle together — the
     40px of side padding alone left only 12px — so the text goes and the toggle stays,
     centred, since it is the only way back to the expanded menu. */
  .app-shell.nav-collapsed .sidebar .sidebar-brand .name { display: none; }
  .app-shell.nav-collapsed .sidebar .sidebar-brand {
    justify-content: center; padding: 18px 0;
  }
  .app-shell.nav-collapsed .sidebar .nav-toggle-btn { margin: 0; }
  /* When collapsed, hovering an icon shows a tooltip with the item's name. */
  .app-shell.nav-collapsed .sidebar .nav-item { position: relative; }
  .app-shell.nav-collapsed .sidebar .nav-item::after {
    content: attr(data-tip);
    position: absolute; left: 100%; top: 50%; transform: translateY(-50%);
    margin-left: 8px; background: #24313d; color: #fff; font-size: 11.5px;
    padding: 5px 9px; border-radius: 5px; white-space: nowrap;
    opacity: 0; pointer-events: none; transition: opacity 0.12s; z-index: 300;
  }
  .app-shell.nav-collapsed .sidebar .nav-item:hover::after { opacity: 1; }

  /* ---- THE MENU ON A PHONE ----
     The left nav is hidden under 880px, which is right — there is no room for
     it. But for months there was NOTHING to bring it back, so on a phone the
     ERP was one screen and a Log out button. This is the way back: a hamburger
     in the top bar that slides the same menu in over the page, and a backdrop
     that closes it. Same menu, same items, same order — not a second menu that
     can drift away from the first. */
  .nav-open-btn {
    display: none;                       /* desktop has the menu already */
    background: none; border: 1px solid var(--border); border-radius: 8px;
    color: var(--ink); cursor: pointer; flex-shrink: 0;
    width: 44px; height: 44px; align-items: center; justify-content: center;
  }
  .nav-backdrop { display: none; }

  .nav-toggle-btn {
    background: none; border: none; cursor: pointer; color: rgba(255,255,255,0.75);
    padding: 5px 6px; border-radius: 5px; display: flex; align-items: center; flex-shrink: 0;
  }
  .nav-toggle-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }

  /* Spreadsheet grid. Horizontal scrolling is necessary: the full column set is wider
     than any screen, and hiding the overflow made the deduction columns unreachable.
     The employee column, header and totals row stay frozen instead. */
  .paygrid-wrap { border-top: 1px solid var(--border); background: #fff; overflow: auto; }
  table.paygrid { border-collapse: separate; border-spacing: 0; font-size: 12px; table-layout: fixed; width: max-content; }
  table.paygrid th {
    background: #e3e9ee; border-right: 1px solid #c3ced8; border-bottom: 1px solid #9fb0bf;
    padding: 4px 5px; font-size: 10.5px; color: #2b3d4f; font-weight: 700;
    position: sticky; top: 0; z-index: 15;
    text-align: center; vertical-align: middle;
    white-space: normal; word-break: break-word; overflow-wrap: anywhere; line-height: 1.15;
    height: 34px; user-select: none; position: sticky;
  }
  /* Earnings and deductions are distinguished by colour instead of a banner row */
  table.paygrid th.pg-h-earn { background: #d8ecdd; color: #14532d; }
  table.paygrid th.pg-h-ded  { background: #f7dedd; color: #7c2d2d; }
  table.paygrid th.pg-label-h { left: 0; z-index: 20; background: #d4dde5; text-align: left; }
  table.paygrid td { border-right: 1px solid #e6ebf0; border-bottom: 1px solid #e6ebf0; padding: 0; overflow: hidden; }
  table.paygrid tbody tr:nth-child(odd) td { background: #ffffff; }
  table.paygrid tbody tr:nth-child(even) td { background: #f7fafc; }
  table.paygrid tbody tr:hover td { background: #eaf2fb; }
  /* The frozen first column needs a solid background in every row state, or rows show
     through it while scrolling sideways. */
  table.paygrid td.pg-label {
    padding: 3px 7px; position: sticky; left: 0; z-index: 12;
    border-right: 1px solid #9fb0bf;
  }
  table.paygrid tbody tr:nth-child(odd) td.pg-label { background: #fbfcfd; }
  table.paygrid tbody tr:nth-child(even) td.pg-label { background: #eef3f7; }
  table.paygrid tbody tr:hover td.pg-label { background: #e4eefa; }
  .pg-emp-name { font-weight: 600; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pg-emp-inc { font-size: 9.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  table.paygrid td.pg-calc { padding: 4px 6px; text-align: right; color: #5a6b7c; }
  table.paygrid td.pg-net { padding: 4px 6px; text-align: right; font-weight: 700; color: #14532d; }
  table.paygrid input.pg-cell {
    width: 100%; border: none; padding: 4px 6px; font-size: 12px; font-family: inherit;
    text-align: right; background: transparent; outline: none; box-sizing: border-box; cursor: cell;
  }
  table.paygrid input.pg-cell.pg-editing { background: #fff9e6; cursor: text; }
  table.paygrid .pg-nav.pg-selected { box-shadow: inset 0 0 0 2px #1a73e8; position: relative; z-index: 8; }
  /* Inherits the standard .btn look (steel fill, 6px corners) so it matches Save;
     only the grid-specific sizing is adjusted here. */
  table.paygrid button.pay-slip-btn {
    padding: 4px 10px; font-size: 10.5px; white-space: nowrap;
  }
  table.paygrid button.pg-nav.pg-selected { box-shadow: 0 0 0 2px #0b3d91; }
  table.paygrid td.pg-readonly-cell { outline: none; cursor: default; }
  table.paygrid textarea.pg-text {
    width: 100%; border: none; padding: 3px 6px; font-size: 11.5px; font-family: inherit;
    background: transparent; outline: none; box-sizing: border-box; resize: none;
    white-space: pre-wrap; word-break: break-word; line-height: 1.25; cursor: cell;
  }
  table.paygrid textarea.pg-text.pg-editing { background: #fff9e6; cursor: text; }
  table.paygrid tfoot tr td {
    background: #e3e9ee !important; font-weight: 700; padding: 5px 6px; text-align: right;
    position: sticky; bottom: 0; z-index: 14; border-top: 1px solid #9fb0bf;
  }
  table.paygrid tfoot tr td.pg-label { left: 0; z-index: 18; text-align: left; background: #d4dde5 !important; }
  .pg-resizer { position: absolute; top: 0; right: -3px; width: 7px; height: 100%; cursor: col-resize; z-index: 11; }
  .pg-resizer:hover { background: #1a73e8; opacity: 0.4; }
  body.pg-resizing { cursor: col-resize !important; user-select: none !important; }
  .pay-toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
  .pay-hint { font-size: 11px; color: var(--muted); margin: 4px 0 0; }

  /* Modal — used for create/edit forms so the list view stays clean and separate */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45);
    display: flex; align-items: flex-start; justify-content: center;
    z-index: 200; padding: 40px 20px; overflow-y: auto;
  }
  .modal-box {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.18); width: 100%; max-width: 640px;
    animation: modalIn 0.14s ease-out;
  }
  @keyframes modalIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  .modal-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 18px; border-bottom: 1px solid var(--border);
  }
  .modal-title { font-size: 14.5px; font-weight: 600; color: var(--ink); }
  .modal-close {
    background: none; border: none; font-size: 20px; line-height: 1; color: var(--muted);
    cursor: pointer; padding: 0 4px;
  }
  .modal-close:hover { color: var(--ink); }
  .modal-body { padding: 18px; }
  .modal-footer {
    display: flex; justify-content: flex-end; gap: 8px;
    padding: 14px 18px; border-top: 1px solid var(--border);
  }
  .field-error-highlight {
    border-color: var(--danger) !important;
    background: var(--danger-bg) !important;
    box-shadow: 0 0 0 3px rgba(165,69,58,0.15);
  }
  .field-inline-error { color: var(--danger); font-size: 11px; margin-top: 4px; display: none; }

  .emp-dept-group { margin-bottom: 22px; }
  .emp-dept-header {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 0 8px;
    background: none;
    border: none;
    border-bottom: 2px solid var(--border);
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 650;
    color: var(--ink);
    text-align: left;
  }
  .emp-dept-header:hover .emp-dept-name { filter: brightness(0.8); }
  .emp-dept-name { transition: filter 0.1s ease; }
  .emp-dept-body { padding: 10px 0 0; }
  .emp-dept-table thead th { text-align: center; border-bottom: 2px solid var(--ink); }

  .perm-grid-table th, .perm-grid-table td { text-align: center; vertical-align: middle; }
  .perm-grid-table th:first-child, .perm-grid-table td:first-child { text-align: left; }
  .perm-grid-table td input[type="checkbox"], .perm-grid-table th input[type="checkbox"] { width: 16px; height: 16px; margin: 0 auto; display: block; cursor: pointer; }
  .perm-col-header { user-select: none; }
  .perm-col-header:hover { background: var(--surface-sunken); }
  .perm-category-row td { background: #e8f0f9; }
  .perm-grid-table thead th { background: #eef1f4 !important; position: sticky; z-index: 25; }

  .view-toggle { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .view-toggle-btn {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    background: #fff;
    border: none;
    color: var(--muted);
    cursor: pointer;
  }
  .view-toggle-btn svg { width: 16px; height: 16px; }
  .view-toggle-btn + .view-toggle-btn { border-left: 1px solid var(--border); }
  .view-toggle-btn.active { background: var(--steel); color: #fff; }

  .emp-list-sticky-header { position: sticky; top: 0; z-index: 20; background: var(--surface); }
  .emp-dept-table thead th { position: sticky; background: #eef1f4; z-index: 15; }

  .emp-card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; padding: 14px; }
  .emp-pagination { display: flex; justify-content: space-between; align-items: center; padding: 14px 4px 4px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; gap: 10px; }
  .emp-card { border: 1px solid var(--border); border-radius: 8px; padding: 14px; background: #fff; }
  .emp-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .emp-card-name a { color: var(--steel); font-weight: 650; font-size: 14px; text-decoration: none; }
  .emp-card-code { font-size: 11.5px; color: var(--muted); margin-top: 2px; font-family: 'IBM Plex Mono', monospace; }
  .emp-card-meta { font-size: 12.5px; color: var(--ink); line-height: 1.7; margin-bottom: 10px; }
  .panel-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .panel-header.header-pending { background: var(--amber-bg); border-bottom-color: #ecd9ae; }
  .panel-header.header-recent { background: var(--slate-bg); border-bottom-color: #d2d9df; }
  .panel-title { font-size: 13.5px; font-weight: 650; font-family: 'Inter', sans-serif; }
  .section-label { font-size: 12.5px; font-weight: 700; color: var(--steel); text-transform: uppercase; letter-spacing: 0.4px; margin: 20px 0 10px; padding-top: 14px; border-top: 1px solid var(--border); }
  .pill-section-label { display:inline-block; font-size:11px; font-weight:700; color:var(--green); text-transform:uppercase; letter-spacing:0.4px; border:1px solid var(--green); border-radius:5px; padding:3px 10px; }
  .vv-info-grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:0; border:1px solid var(--border); border-radius:6px; overflow:hidden; margin-top:12px; }
  .vv-info-cell { padding:12px 14px; border-right:1px solid var(--border); border-bottom:1px solid var(--border); }
  .vv-info-cell:nth-child(4n) { border-right:none; }
  .vv-info-label { font-size:11px; color:var(--muted); margin-bottom:3px; }
  .vv-info-value { font-size:13.5px; font-weight:600; color:var(--ink); }
  .vv-subsection { margin-top:26px; padding-top:20px; border-top:1px solid var(--border); }
  .form-section-heading {
    font-size: 15.5px;
    font-weight: 700;
    color: var(--ink);
    margin: 0 0 16px;
    padding-top: 22px;
    border-top: 1px solid var(--border);
    scroll-margin-top: 64px;
  }
  .etab-content:first-of-type .form-section-heading { border-top: none; padding-top: 0; }
  .form-subnav-sticky { position: sticky; top: 0; z-index: 5; }

  @media (max-width: 880px) {
    /* The menu is a drawer, not a column. It is off to the left until the
       hamburger is pressed, and it lies OVER the page rather than squeezing
       it, so nothing reflows when it opens. */
    .nav-open-btn { display: inline-flex; }
    .app-shell { position: relative; }
    .sidebar {
      display: flex;
      position: fixed; top: 0; left: 0; bottom: 0;
      width: 272px; max-width: 84vw; height: 100vh;
      transform: translateX(-100%);
      transition: transform 0.18s ease;
      z-index: 70;
      box-shadow: 2px 0 18px rgba(15,23,32,0.28);
    }
    .app-shell.nav-open .sidebar { transform: none; }
    /* A phone never collapses the menu to icons — it is open or it is away. */
    .app-shell.nav-collapsed .sidebar { width: 272px; max-width: 84vw; }
    .app-shell.nav-collapsed .sidebar .nav-label,
    .app-shell.nav-collapsed .sidebar .nav-arrow,
    .app-shell.nav-collapsed .sidebar .nav-section-label,
    .app-shell.nav-collapsed .sidebar .sidebar-brand .name,
    .app-shell.nav-collapsed .sidebar .sidebar-brand .tag { display: block; }
    .app-shell.nav-collapsed .sidebar .nav-children { display: block !important; }
    .app-shell.nav-collapsed .sidebar .nav-item { justify-content: flex-start; }
    .nav-toggle-btn { display: none; }     /* collapsing is a desk idea */

    .nav-backdrop {
      display: block; position: fixed; inset: 0;
      background: rgba(15,23,32,0.45); z-index: 65;
      opacity: 0; pointer-events: none; transition: opacity 0.18s ease;
    }
    .app-shell.nav-open .nav-backdrop { opacity: 1; pointer-events: auto; }
    /* Tapping a menu item on a phone is a tap, not a hover-and-click. */
    .sidebar .nav-item { min-height: 44px; }

    .content { padding: 14px; }
    .topbar { padding: 12px 14px; }
    .subtabs { padding: 0 14px 0; -webkit-overflow-scrolling: touch; }
    .subtab-item { padding: 12px 2px; font-size: 12.5px; }
    .form-grid { grid-template-columns: 1fr; gap: 10px; }
    .panel-body { padding: 14px; }

    /* Prevent iOS Safari from auto-zooming when tapping inputs */
    input, select, textarea { font-size: 16px !important; }

    /* ---- TAP TARGETS ----
       Measured at 380px: Log out was 68x28, Add loan 91x28, the km-tracker
       sub-tabs 19px wide. A thumb is about 9mm across; 44px is the smallest
       square it hits reliably. Height comes from padding so nothing is
       stretched out of shape. */
    .btn, .btn-sm, a.btn { min-height: 44px; }
    .btn-sm { padding: 10px 12px; font-size: 13px; }
    .subtab-item { min-width: 56px; min-height: 44px; padding: 13px 10px; }
    .sidebar .nav-item { min-height: 44px; }
    /* The documentation screen has a menu of its own, inside the page. */
    .doc-tree-toggle, .doc-tree-leaf { min-height: 44px; }
    select { min-height: 44px; }

    /* ---- TEXT ----
       Made bigger, never smaller. Shrinking text to fit is how a screen
       "works" on a phone and still cannot be read. Nothing under 12px, and
       the things a person actually reads at 13px or more. */
    .topbar-sub, #pageSub { font-size: 12.5px; }
    .pill-section-label, .nav-section-label, .nav-future-note,
    .sidebar-footer, .empty-state { font-size: 12px; }
    .msg { font-size: 13px; }

    /* ---- NOTHING GOES SIDEWAYS ----
       The documentation screen pushed the page 7px wider than the phone
       because one long unbroken word would not wrap. A word breaks before a
       page does. */
    .panel-body, .content { overflow-wrap: anywhere; }
    /* A wide table scrolls inside its own box. The page never does. */
    .table-scroll, .pg-wrap, .grid-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

    /* ---- THE KEYBOARD MUST NOT SIT ON THE FIELD ----
       A field near the bottom of a form disappears behind the keyboard when
       it is tapped. scroll-margin gives the browser room to put it above. */
    input, select, textarea { scroll-margin-top: 90px; scroll-margin-bottom: 120px; }

    /* Compact topbar on small screens: role text hides, name stays */
    .topbar-title { font-size: 15.5px; }
    .topbar-sub { font-size: 11px; }
    .user-chip { font-size: 12px; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .user-chip #userRole { display: none; }

    /* Roster rows (employees/vehicles/payments) must wrap instead of overflowing off-screen */
    .roster-item {
      flex-wrap: wrap;
      gap: 8px;
    }
    .roster-item > div:first-child { flex: 1 1 100%; }
    .roster-item > div:last-child {
      flex: 1 1 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: flex-start;
    }

    /* Vehicle-assignment control row (select + Assign button) */
    .roster-item select.assign-vehicle-select {
      max-width: 100% !important;
      flex: 1 1 auto;
    }

    /* Modals: never exceed viewport height, scroll internally if content + keyboard is tall */
    .auth-card {
      max-height: 88vh;
      overflow-y: auto;
      width: calc(100% - 20px);
      padding: 22px 18px;
    }

    /* Button groups inside table action cells must wrap on very narrow phones */
    table.ledger td.action-cell > div { flex-wrap: wrap; justify-content: flex-end; }

    /* Standalone submit buttons: full-width for easier tapping on mobile */
    #addEmpBtn, #addVehBtn, #saveSettingsBtn { width: 100%; }

    .table-scroll { max-height: none; overflow: visible; }
    table.ledger thead { display: none; }
    table.ledger, table.ledger tbody, table.ledger tr, table.ledger td { display: block; width: 100%; }
    table.ledger tr {
      border: 1px solid var(--border);
      border-radius: 7px;
      margin-bottom: 10px;
      padding: 4px 0;
      border-left-width: 1px !important;
    }
    table.ledger tr.row-pending { border-left: 3px solid var(--amber) !important; }
    table.ledger tr.row-approved { border-left: 3px solid var(--green) !important; }
    table.ledger tr.row-paid { border-left: 3px solid var(--slate) !important; }
    table.ledger td {
      border-bottom: none;
      padding: 6px 12px;
      display: flex;

      align-items: center;
      gap: 10px;
    }
    table.ledger td::before {

      flex-shrink: 0;
    }
    table.ledger td.action-cell { justify-content: flex-end; padding-top: 10px; }
  }

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app-config.js"></script>
<script>
  let currentUser = null;
  let dashboardData = null;

  // Clear a field's red error highlight as soon as the user starts fixing it
  ['input', 'change', 'click'].forEach(evt => {
    document.addEventListener(evt, (e) => {
      if (e.target.classList && e.target.classList.contains('field-error-highlight')) {
        e.target.classList.remove('field-error-highlight');
      }
    }, true);
  });

  function spinnerHtml(label) {
    return `<div class="spinner-wrap"><div class="spinner"></div><div style="margin-top:12px; font-size:12.5px;">${label || 'Loading...'}</div></div>`;
  }
  // Reusable modal — keeps create/edit forms separate from list views
  function openModal(title, bodyHtml, footerHtml) {
    closeModal();
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.id = 'appModalOverlay';
    overlay.innerHTML = `<div class="modal-box" role="dialog" aria-modal="true">
      <div class="modal-header">
        <span class="modal-title">${title}</span>
        <button type="button" class="modal-close" id="appModalClose" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">${bodyHtml}</div>
      ${footerHtml ? `<div class="modal-footer">${footerHtml}</div>` : ''}
    </div>`;
    document.body.appendChild(overlay);
    document.getElementById('appModalClose').addEventListener('click', closeModal);
    overlay.addEventListener('click', (ev) => { if (ev.target === overlay) closeModal(); });
    document.addEventListener('keydown', modalEscHandler);
    return overlay;
  }

  function modalEscHandler(ev) {
    if (ev.key === 'Escape') closeModal();
  }

  function closeModal() {
    document.getElementById('appModalOverlay')?.remove();
    document.removeEventListener('keydown', modalEscHandler);
  }

  // Lets a view put its own controls into the page header, keeping the body clear.
  function setTopbarActions(html) {
    const slot = document.getElementById('topbarActions');
    if (slot) slot.innerHTML = html || '';
  }

  // Sits to the left of the page title, for things like a Back button.
  function setTopbarLead(html) {
    const slot = document.getElementById('topbarLead');
    if (slot) slot.innerHTML = html || '';
  }

  function showSpinner(containerId, label) {
    const el = document.getElementById(containerId);
    if (el) el.innerHTML = spinnerHtml(label);
  }

  function setButtonLoading(btn, isLoading, loadingText, originalText) {
    if (isLoading) {
      btn.dataset.originalText = originalText !== undefined ? originalText : btn.textContent;
      btn.disabled = true;
      btn.classList.add('btn-loading');
      btn.textContent = loadingText || 'Processing';
    } else {
      btn.disabled = false;
      btn.classList.remove('btn-loading');
      btn.textContent = btn.dataset.originalText || originalText || btn.textContent;
    }
  }

  const appShell = document.getElementById('appShell');

  const pageTitles = {
    approvals: ['Approvals', 'Entries waiting for your review'],
    employees: ['Employees', 'Manage team members, roles, and rates'],
    vehicles: ['Vehicles', 'Manage company and employee-owned vehicles'],
    reports: ['Reports', 'Browse and filter all vehicle log entries'],
    payments: ['Payments', 'See what is owed and record payments made'],
    settings: ['Settings', 'Configure system-wide rules'],
  };

  async function apiAdmin(payload) { return REF.call('admin-actions', payload); }

  async function apiHR(payload) { return REF.call('hr-actions', payload); }

  async function apiPermissions(payload) { return REF.call('permissions-actions', payload); }

  async function apiPayroll(payload) { return REF.call('payroll-actions', payload); }

  async function apiHRMS(payload) { return REF.call('hrms-actions', payload); }

  async function apiVendor(payload) { return REF.call('vendor-actions', payload); }

  let controlPanelLoaded = false;
  let adminPanelLoaded = false;
  let vendorMasterLoaded = false;
  let kmTrackerLoaded = false;
  let documentationLoaded = false;
  let vendorDropdowns = null;
  let vendorListData = null;
  let permissionsData = null;
  let dropdownsData = null;
  let employeeListData = null;

  async function loadControlPanel() {
    controlPanelLoaded = true;
    showSpinner('hrtab-employee-master');
    showSpinner('hrtab-hr-dropdowns');
    const [dd, el] = await Promise.all([
      apiHR({ action: 'get_dropdowns' }),
      apiHR({ action: 'get_employee_list' }),
    ]);
    if (dd.success) dropdownsData = dd.dropdowns;
    if (el.success) employeeListData = el.employees;
    renderHRDropdowns();
    renderEmployeeMasterList();
  }

  const VIEW_PERMISSION_MAP = {
    'km-tracker': 'km_tracker.view',
    'employee-master': 'employee_master.view',
    'hr-dropdowns': 'employee_master.view',
    'loans-advances': 'loans_advances.view',
    'salary-calculator': 'payroll.view',
    'vendor-master': 'vendor_master.view',
  };

  let isOwnerUser = false;
  let myPermissionKeys = [];

  async function applyNavVisibility() {
    isOwnerUser = currentUser.is_owner;
    myPermissionKeys = currentUser.permissions || [];
    document.querySelectorAll('.nav-item[data-view]').forEach(btn => {
      const view = btn.dataset.view;
      if (view === 'admin-panel') {
        btn.style.display = isOwnerUser ? '' : 'none';
        return;
      }
      if (view === 'documentation' || view === 'home') return; // always visible to any logged-in ERP user
      const requiredKey = VIEW_PERMISSION_MAP[view];
      if (!requiredKey) return; // no mapping — leave as-is
      const hasAccess = isOwnerUser || myPermissionKeys.includes(requiredKey);
      btn.style.display = hasAccess ? '' : 'none';
    });
    // Hide any expandable parent group whose children are now all hidden — avoids an empty, pointless section
    document.querySelectorAll('.nav-children').forEach(childrenEl => {
      const visibleChildren = Array.from(childrenEl.children).filter(c => c.style.display !== 'none');
      const toggleBtn = document.querySelector(`.nav-parent[data-toggle="${childrenEl.id}"]`);
      if (toggleBtn) {
        const wrapper = toggleBtn.parentElement;
        const hideGroup = childrenEl.id && visibleChildren.length === 0;
        toggleBtn.style.display = hideGroup ? 'none' : '';
        if (hideGroup) childrenEl.style.display = 'none';
      }
    });
  }

  function completeLogin(user) {
    currentUser = user;
    appShell.style.display = 'flex';
    document.getElementById('userName').textContent = currentUser.name;
    document.getElementById('userRole').textContent = (currentUser.is_owner ? 'OWNER' : (currentUser.roles[0] || 'STAFF')).toUpperCase();
    applyNavVisibility();
    switchMainView('home');
  }

  // --- Sidebar tree: expandable parents (Control Panel, Masters, HR) ---
  document.querySelectorAll('.nav-parent').forEach(btn => {
    btn.addEventListener('click', () => {
      const childrenEl = document.getElementById(btn.dataset.toggle);
      const isOpen = childrenEl.style.display !== 'none';
      childrenEl.style.display = isOpen ? 'none' : 'block';
      btn.classList.toggle('expanded', !isOpen);
    });
  });

  // --- Sidebar tree: leaf items (Km Tracker, Employee Master, HR Dropdowns, Admin Panel) ---
  const viewTitles = {
    'home': ['Home', 'Your approvals and requests'],
    'km-tracker': ['Km Tracker', 'Daily odometer tracking, approvals, and payments'],
    'employee-master': ['Employee Master', 'Add and manage employee records'],
    'hr-dropdowns': ['HR Dropdowns', 'Supporting master data used across HR'],
    'loans-advances': ['Loans & Advances', 'Employee loan and advance ledger'],
    'salary-calculator': ['Salary Calculator', 'Monthly salary sheets and salary slips'],
    'vendor-master': ['Vendor', 'Register and manage vendors, GST registrations, and bank accounts'],
    'admin-panel': ['Admin Panel', 'Role-based permissions and administration'],
    'documentation': ['Documentation', 'Every design decision made across this ERP, and why'],
  };

  function switchMainView(viewKey) {
    if (!viewTitles[viewKey]) viewKey = 'home';
    // Leaving the salary sheet by the sidebar is just as destructive as pressing Back,
    // so it gets the same confirmation rather than silently dropping the work.
    if (payrollDirty && viewKey !== 'salary-calculator') {
      if (!confirm('You have unsaved changes on the salary sheet. Leave without saving?')) return;
      payrollDirty = false;
    }
    if (viewKey !== 'salary-calculator') {
      setTopbarActions(''); setTopbarLead('');
      document.querySelector('#view-salary-calculator .content')?.classList.remove('content-flush');
    }
    document.querySelectorAll('.nav-item[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === viewKey));
    document.querySelectorAll('.view-content').forEach(v => v.style.display = 'none');
    document.getElementById('view-' + viewKey).style.display = 'block';
    document.getElementById('pageTitle').textContent = viewTitles[viewKey][0];
    document.getElementById('pageSub').textContent = viewTitles[viewKey][1];
    sessionStorage.setItem('admin_active_view', viewKey);

    const isControlPanelView = ['employee-master', 'hr-dropdowns', 'admin-panel'].includes(viewKey);
    if (isControlPanelView && !controlPanelLoaded) {
      loadControlPanel();
    }
    if (viewKey === 'vendor-master' && !vendorMasterLoaded) {
      loadVendorMaster();
    }
    if (viewKey === 'admin-panel' && !adminPanelLoaded) {
      loadAdminPanel();
    }
    if (viewKey === 'documentation' && !documentationLoaded) {
      documentationLoaded = true;
      showSpinner('documentationContent');
      const script = document.createElement('script');
      script.src = 'documentation.js?v=' + window.__BUILD_VERSION__;
      script.onload = () => { window.loadDocumentation(); };
      script.onerror = () => {
        document.getElementById('documentationContent').innerHTML = '<div class="msg error" style="display:block">Failed to load the Documentation module. Please refresh and try again.</div>';
      };
      document.head.appendChild(script);
    }
    if (viewKey === 'salary-calculator') {
      loadPayrollPeriods();
    }
    if (viewKey === 'loans-advances') {
      loadLoansAdvances(); // always refresh — balances change as repayments are recorded
    }
    if (viewKey === 'home') {
      loadHome(); // always refresh — approvals/requests change frequently, unlike static master data
    }
    if (viewKey === 'km-tracker' && !kmTrackerLoaded) {
      kmTrackerLoaded = true;
      loadDashboard();
    }

    // Every view's full ancestor tree path — including nested sub-trees like "HR" inside "Masters" —
    // must expand so the active item is actually visible in the nav, not just its top-level parent.
    const VIEW_ANCESTOR_TREES = {
      'employee-master': ['tree-control-panel', 'tree-hr'],
      'hr-dropdowns': ['tree-control-panel', 'tree-hr'],
      'loans-advances': ['tree-hrms'],
      'salary-calculator': ['tree-hrms'],
      'vendor-master': ['tree-control-panel'],
      'admin-panel': ['tree-control-panel'],
      'documentation': ['tree-control-panel'],
    };
    (VIEW_ANCESTOR_TREES[viewKey] || []).forEach(treeId => {
      const el = document.getElementById(treeId);
      if (el) el.style.display = 'block';
      document.querySelector(`.nav-parent[data-toggle="${treeId}"]`)?.classList.add('expanded');
    });
  }

  document.querySelectorAll('.nav-item[data-view]').forEach(btn => {
    btn.addEventListener('click', () => switchMainView(btn.dataset.view));
  });

  // --- Km Tracker's own subtabs (Approvals / Reports / Payments / Settings) ---
  function switchTab(tab) {
    document.querySelectorAll('#subtabsNav .subtab-item').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === tab);
    });
    document.querySelectorAll('#view-km-tracker .tab-content').forEach(c => c.style.display = 'none');
    document.getElementById('tab-' + tab).style.display = 'block';
  }
  document.querySelectorAll('#subtabsNav .subtab-item').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  function openLightbox(url, caption) {
    document.getElementById('lightboxImg').src = url;
    document.getElementById('lightboxCaption').textContent = caption || '';
    document.getElementById('lightbox').classList.add('open');
  }
  document.getElementById('lightboxClose').addEventListener('click', () => document.getElementById('lightbox').classList.remove('open'));
  document.getElementById('lightbox').addEventListener('click', (e) => { if (e.target.id === 'lightbox') e.currentTarget.classList.remove('open'); });

  /* A reply that says "success" must still carry what it promised. An ABSENT
     list is a broken reply, not an empty one, and rendering it as "nothing
     here" is how a screen lies quietly — the same fault as a counter reading
     zero on a full table. Three screens crashed on it instead: km-tracker,
     vendor-master and the admin panel all did `res.<list>.filter(...)` and
     threw, leaving a blank page with no explanation. */
  function requireLists(res, keys, containerId) {
    const missing = keys.filter(k => !Array.isArray(res[k]));
    if (!missing.length) return true;
    const el = document.getElementById(containerId);
    if (el) el.innerHTML =
      '<div class="panel"><div class="panel-body msg error" style="display:block;">' +
      'The server answered but left out: ' + missing.map(escapeHtml).join(', ') +
      '. This is not an empty screen — something is wrong. Reload the page, and ' +
      'tell Raghbir if it keeps happening.</div></div>';
    return false;
  }

  /* A message from the server goes on screen as TEXT, never as markup. */
  function escapeHtml(v) {
    return String(v === null || v === undefined ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  async function loadHome() {
    showSpinner('homeContent');
    const isOwner = currentUser.is_owner;

    const [pendingRes, myRes] = await Promise.all([
      isOwner ? apiHR({ action: 'get_pending_erp_requests' }) : Promise.resolve({ success: true, requests: [] }),
      apiHR({ action: 'get_my_erp_requests' }),
    ]);

    // A reply that says success but carries no list used to crash this screen
    // on .length. Caught by the screen tests; see docs/23-screen-tests.md.
    // And a reply that FAILED is not an empty list: showing "Nothing pending"
    // when the call was refused is the same lie as a counter reading zero on
    // a full table. Say which it was.
    const pendingFailed = isOwner && !pendingRes.success;
    const myFailed = !myRes.success;
    const pending = (pendingRes.success && pendingRes.requests) || [];
    const myRequests = (myRes.success && myRes.requests) || [];

    const html = `
      <div class="panel panel-no-clip">
        <div class="panel-header"><span class="panel-title">Home</span></div>
        <div class="panel-body">

          ${isOwner ? `
          <span class="pill-section-label">Pending Approvals</span>
          <p style="font-size:12px; color:var(--muted); margin:6px 0 14px;">Things that need your decision — organized by department/category.</p>
          ${pendingFailed
            ? `<div class="empty-state" style="color:var(--danger);">Could not read the pending approvals — ${escapeHtml(pendingRes.error || 'the request was refused')}. This is NOT "nothing pending": reload the page.</div>`
            : pending.length === 0 ? '<div class="empty-state">Nothing pending right now.</div>' : `
            <p class="section-label" style="margin-top:0;">HRMS</p>
            <div id="homeApprovalsList">
              ${pending.map(r => `
                <div class="home-approval-row" data-request-id="${r.id}" style="border:1px solid var(--border); border-radius:6px; padding:12px 14px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
                  <div>
                    <div style="font-size:13.5px; font-weight:600;">ERP Login Request — ${r.employee?.name || 'Unknown'} <span style="font-weight:400; color:var(--muted);">(${r.employee?.employee_code || '—'})</span></div>
                    <div style="font-size:12px; color:var(--muted); margin-top:2px;">Requested email: ${r.requested_email} · Department: ${r.employee?.departments?.name || '—'} · Requested by ${r.requester?.name || 'Unknown'} on ${fmtDate ? fmtDate(r.created_at) : new Date(r.created_at).toLocaleDateString()}</div>
                  </div>
                  <div style="display:flex; gap:8px;">
                    <button type="button" class="btn btn-sm home-approve-btn" data-id="${r.id}">Approve</button>
                    <button type="button" class="btn btn-sm btn-outline home-reject-btn" data-id="${r.id}" style="color:var(--danger); border-color:#efd2cf;">Reject</button>
                  </div>
                </div>`).join('')}
            </div>`}
          ` : ''}

          <span class="pill-section-label" style="${isOwner ? 'margin-top:26px; display:inline-block; padding-top:20px; border-top:1px solid var(--border);' : ''}">My Requests</span>
          <p style="font-size:12px; color:var(--muted); margin:6px 0 14px;">Status of ERP access requests you've submitted for others.</p>
          ${myFailed

            : myRequests.length === 0 ? `<div class="empty-state">You haven't submitted any requests.</div>` : `
            ${myRequests.map(r => `

                ${r.status === 'rejected' && r.rejection_reason ? `<div style="margin-top:8px; padding:8px 10px; background:var(--danger-bg); border-radius:6px; font-size:12.5px;">Reason: ${r.rejection_reason}</div>` : ''}

        if (!res.success) { alert(res.error); return; }

        const res = await apiHR({ action: 'reject_erp_login_request', request_id: btn.dataset.id, reason });

  async function loadDashboard() {
    showSpinner('tab-approvals');
    const data = await apiAdmin({ action: 'get_dashboard' });
    if (!data.success) {
      document.getElementById('tab-approvals').innerHTML = `<div class="msg error" style="display:block">${data.error}</div>`;
      return;
    }
    if (!requireLists(data, ['entries', 'vehicles', 'employees'], 'tab-approvals')) return;
    dashboardData = data;
    renderApprovals();

    renderSettings();

  function photoCell(url, missing, label, time, location) {
    if (url) {
      return `<img src="${url}" class="photo-thumb" onclick="openLightbox('${url}', '${label} · ${time || ''} · ${(location||'').replace(/'/g,"")}')" />`;
    }
    if (missing) return `<div class="photo-missing">no photo</div>`;
    return `<div class="photo-missing">—</div>`;
  }

  let pendingRejectId = null;

  function openRejectModal(entryId) {
    pendingRejectId = entryId;
    document.getElementById('rejectReasonInput').value = '';
    document.getElementById('rejectMsg').className = 'msg';
    document.getElementById('rejectModal').classList.add('open');
  }
  document.getElementById('rejectCancelBtn').addEventListener('click', () => {
    document.getElementById('rejectModal').classList.remove('open');
    pendingRejectId = null;
  });
  document.getElementById('rejectConfirmBtn').addEventListener('click', async () => {
    const reason = document.getElementById('rejectReasonInput').value.trim();
    const msg = document.getElementById('rejectMsg');
    const btn = document.getElementById('rejectConfirmBtn');
    msg.className = 'msg';
    if (!reason) {
      msg.className = 'msg error';
      msg.textContent = 'A reason is required to reject this entry.';
      return;
    }
    setButtonLoading(btn, true, 'Rejecting');
    const res = await apiAdmin({ action: 'reject_entry', entry_id: pendingRejectId, reason });
    setButtonLoading(btn, false);
    if (res.success) {
      document.getElementById('rejectModal').classList.remove('open');
      pendingRejectId = null;
      loadDashboard();
    } else {
      msg.className = 'msg error';
      msg.textContent = res.error || 'Failed to reject entry.';
    }
  });

  const ENTRY_STATUS_TAG = { draft: 'pending_evening', submitted: 'calculated', approved: 'approved', completed: 'paid', cancelled: 'rejected' };
  const ENTRY_STATUS_LABEL = { draft: 'Pending evening', submitted: 'Awaiting approval', approved: 'Approved', completed: 'Paid', cancelled: 'Rejected' };

  function buildTable(rows, showActions) {
    let html = `<div class="table-scroll"><table class="ledger"><thead><tr>
      <th>Employee</th><th>Date</th><th>Vehicle</th><th>Morning</th><th>Evening</th><th>KM</th><th>Cost</th><th>Status</th>${showActions ? '<th>Action</th>' : ''}
    </tr></thead><tbody>`;
    rows.forEach(e => {
      const rowClass = e.status === 'submitted' ? 'row-pending' : e.status === 'approved' ? 'row-approved' : e.status === 'cancelled' ? 'row-rejected' : e.status === 'completed' ? 'row-paid' : 'row-open';
      const rejectionNote = e.status === 'cancelled' && e.rejection_reason ? `<div class="rejection-note">Reason: ${e.rejection_reason}</div>` : '';
      html += `<tr class="${rowClass}">
        <td data-label="Employee">${e.employees?.name || '—'}</td>
        <td data-label="Date" class="mono">${e.entry_date}</td>
        <td data-label="Vehicle">${e.vehicles?.vehicle_name || '—'}</td>
        <td data-label="Morning">
          <div style="display:flex; align-items:center; gap:8px;">
            ${photoCell(e.morning_photo_signed_url, e.morning_photo_missing, 'Morning', e.morning_timestamp ? new Date(e.morning_timestamp).toLocaleTimeString() : '', e.morning_location_text)}
            <div class="reading-cell">${e.morning_reading ?? '—'}<span class="time">${e.morning_timestamp ? new Date(e.morning_timestamp).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : ''}</span></div>
          </div>
        </td>
        <td data-label="Evening">
          <div style="display:flex; align-items:center; gap:8px;">
            ${photoCell(e.evening_photo_signed_url, e.evening_photo_missing, 'Evening', e.evening_timestamp ? new Date(e.evening_timestamp).toLocaleTimeString() : '', e.evening_location_text)}
            <div class="reading-cell">${e.evening_reading ?? '—'}<span class="time">${e.evening_timestamp ? new Date(e.evening_timestamp).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : ''}</span></div>
          </div>
        </td>
        <td data-label="KM" class="num-cell">${e.km_traveled ?? '—'}</td>
        <td data-label="Cost" class="num-cell">${e.cost !== null ? '₹' + e.cost : '—'}</td>
        <td data-label="Status"><span class="status-tag ${ENTRY_STATUS_TAG[e.status] || 'pending_evening'}">${ENTRY_STATUS_LABEL[e.status] || e.status.replace('_',' ')}</span>${rejectionNote}</td>
        ${showActions ? `<td class="action-cell" data-label="">
          <div style="display:flex; gap:6px;">
            <button class="btn btn-sm approve-btn" data-id="${e.id}">Approve</button>
            <button class="btn btn-sm btn-danger reject-btn" data-id="${e.id}">Reject</button>
          </div>
        </td>` : ''}
      </tr>`;
    });
    html += '</tbody></table></div>';
    return html;
  }

  function renderApprovals() {
    const pending = dashboardData.entries.filter(e => e.status === 'submitted');

      <div class="panel-header header-pending"><span class="panel-title">Pending Approval<span class="count-chip">${pending.length}</span></span></div>

  function openFiltersModal() {
    const employeeOptions = dashboardData.employees.map(e => `<option value="${e.id}" ${activeFilters.employee === e.id ? 'selected' : ''}>${e.name}</option>`).join('');
    const vehicleOptions = dashboardData.vehicles.map(v => `<option value="${v.id}" ${activeFilters.vehicle === v.id ? 'selected' : ''}>${v.vehicle_name}</option>`).join('');
    const statusOpts = ['draft','submitted','approved','completed','cancelled'].map(s => `<option value="${s}" ${activeFilters.status === s ? 'selected' : ''}>${ENTRY_STATUS_LABEL[s] || s.replace('_',' ')}</option>`).join('');

    const modalHtml = `
      <div class="auth-card" style="max-width:420px" onclick="event.stopPropagation()">
        <p class="auth-title" style="margin-bottom:14px;">Filter Entries</p>
        <div class="form-grid">
          <div class="field"><label>Employee</label><select id="modalFilterEmployee"><option value="">All employees</option>${employeeOptions}</select></div>
          <div class="field"><label>Vehicle</label><select id="modalFilterVehicle"><option value="">All vehicles</option>${vehicleOptions}</select></div>
          <div class="field"><label>Status</label><select id="modalFilterStatus"><option value="">All statuses</option>${statusOpts}</select></div>
          <div class="field"></div>
          <div class="field"><label>From Date</label><input type="date" id="modalFilterFrom" value="${activeFilters.from}" /></div>
          <div class="field"><label>To Date</label><input type="date" id="modalFilterTo" value="${activeFilters.to}" /></div>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-outline" id="modalCancelBtn" style="flex:1">Cancel</button>
          <button class="btn" id="modalApplyBtn" style="flex:1">Apply Filters</button>
        </div>
      </div>`;

    let modal = document.getElementById('filtersModal');
    if (!modal) {
      modal = document.createElement('div');
      modal.className = 'lightbox';
      modal.id = 'filtersModal';
      document.body.appendChild(modal);
      modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });
    }
    modal.innerHTML = modalHtml;
    modal.classList.add('open');

    document.getElementById('modalCancelBtn').addEventListener('click', () => modal.classList.remove('open'));
    document.getElementById('modalApplyBtn').addEventListener('click', () => {
      activeFilters = {
        employee: document.getElementById('modalFilterEmployee').value,
        vehicle: document.getElementById('modalFilterVehicle').value,
        status: document.getElementById('modalFilterStatus').value,
        from: document.getElementById('modalFilterFrom').value,
        to: document.getElementById('modalFilterTo').value,
      };
      modal.classList.remove('open');
      applyReportFilters();
    });
  }

  function applyReportFilters() {
    const chipsArea = document.getElementById('activeFilterChips');
    const chips = [];
    if (activeFilters.employee) {
      const emp = dashboardData.employees.find(e => e.id === activeFilters.employee);
      chips.push(`Employee: ${emp ? emp.name : '—'}`);
    }
    if (activeFilters.vehicle) {
      const veh = dashboardData.vehicles.find(v => v.id === activeFilters.vehicle);
      chips.push(`Vehicle: ${veh ? veh.vehicle_name : '—'}`);
    }
    if (activeFilters.status) chips.push(`Status: ${ENTRY_STATUS_LABEL[activeFilters.status] || activeFilters.status.replace('_',' ')}`);
    if (activeFilters.from) chips.push(`From: ${activeFilters.from}`);
    if (activeFilters.to) chips.push(`To: ${activeFilters.to}`);

    chipsArea.innerHTML = chips.length === 0
      ? '<span style="color:var(--muted); font-size:12.5px;">No filters applied</span>'
      : chips.map(c => `<span class="role-tag" style="font-size:11px;">${c}</span>`).join('');

    const filtered = dashboardData.entries.filter(e => {
      if (activeFilters.employee && e.employee_id !== activeFilters.employee) return false;
      if (activeFilters.vehicle && e.vehicle_id !== activeFilters.vehicle) return false;
      if (activeFilters.status && e.status !== activeFilters.status) return false;
      if (activeFilters.from && e.entry_date < activeFilters.from) return false;
      if (activeFilters.to && e.entry_date > activeFilters.to) return false;
      return true;
    });

    document.getElementById('reportsCountLabel').textContent = `${filtered.length} Entr${filtered.length === 1 ? 'y' : 'ies'}`;
    document.getElementById('reportsTableArea').innerHTML = filtered.length === 0
      ? '<div class="empty-state">No entries match these filters.</div>'
      : buildTable(filtered, false);
  }

          </div>
          ${assignedVehicle ? `<div class="roster-meta" style="margin-top:4px;">Currently assigned: <strong>${assignedVehicle.vehicle_name}</strong></div>` : `<div class="roster-meta" style="margin-top:4px; color:var(--amber);">No vehicle assigned yet — employee cannot submit readings.</div>`}`;

          <div><div class="roster-name">${emp.name}<span class="role-tag">${emp.role}</span></div>
          <div class="roster-meta">${emp.mobile_number} · ${emp.status}</div></div>
          <div>
          ${emp.status === 'active' && emp.role !== 'owner' ? `<button class="btn btn-sm btn-danger init-removal-btn" data-id="${emp.id}">Remove</button>` : ''}
          ${emp.status === 'pending_removal' && currentUser.is_owner ? `<button class="btn btn-sm approve-removal-btn" data-id="${emp.id}">Confirm Removal</button>` : ''}
          </div>
        </div>
        ${vehicleControl}
      </div>`;
    });
    html += '</div></div>';

    document.getElementById('tab-employees').innerHTML = html;

    document.getElementById('addEmpBtn').addEventListener('click', async () => {
      const msg = document.getElementById('addEmpMsg');
      const btn = document.getElementById('addEmpBtn');
      msg.className = 'msg';
      setButtonLoading(btn, true, 'Adding');
      const res = await apiHR({
        action: 'add_employee',
        name: document.getElementById('newEmpName').value.trim(),
        mobile_number: document.getElementById('newEmpMobile').value.trim(),
        pin: document.getElementById('newEmpPin').value.trim(),
        role: document.getElementById('newEmpRole').value,
        rate_per_km: document.getElementById('newEmpRate').value || null,
      });
      if (res.success) { msg.className = 'msg success'; msg.textContent = `Added ${res.employee.name}.`; loadDashboard(); }
      else { msg.className = 'msg error'; msg.textContent = res.error || 'Failed to add employee.'; setButtonLoading(btn, false); }

    document.querySelectorAll('.init-removal-btn').forEach(btn => {
      btn.addEventListener('click', async () => {

        setButtonLoading(btn, true, 'Processing');
        const res = await apiAdmin({ action: 'initiate_removal', employee_id: btn.dataset.id });

      });
    });

  function renderPayments() {
    // Group APPROVED (unpaid) entries by employee + month
    const owedGroups = {};
    dashboardData.entries.filter(e => e.status === 'approved').forEach(e => {
      const [year, month] = e.entry_date.split('-');
      const key = `${e.employee_id}_${year}_${month}`;
      if (!owedGroups[key]) {
        owedGroups[key] = { employee_id: e.employee_id, year: Number(year), month: Number(month), km: 0, cost: 0, count: 0 };
      }
      owedGroups[key].km += Number(e.km_traveled || 0);
      owedGroups[key].cost += Number(e.cost || 0);
      owedGroups[key].count += 1;
    });

    const monthNames = ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    let owedRows = '';
    Object.values(owedGroups).forEach(g => {
      const emp = dashboardData.employees.find(e => e.id === g.employee_id);
      owedRows += `<div class="roster-item">
        <div>
          <div class="roster-name">${emp ? emp.name : '—'}</div>
          <div class="roster-meta">${monthNames[g.month]} ${g.year} · ${g.count} entr${g.count === 1 ? 'y' : 'ies'} · ${g.km} km</div>
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
          <span class="num-cell">₹${g.cost.toFixed(2)}</span>

  function escapeRegex(str) {
    return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }
  function highlightMatch(text, query) {
    if (text === null || text === undefined) return '—';
    const str = String(text);
    if (!query) return str;
    const re = new RegExp('(' + escapeRegex(query) + ')', 'gi');
    return str.replace(re, '<mark style="background:#fde68a; padding:0 1px; border-radius:2px;">$1</mark>');
  }

  function renderHolidays() {
    const { holidays, holidayTypes, branches } = holidaysData;
    const yearList = [...new Set(holidays.map(h => h.calendar_year))].filter(Boolean).sort().reverse();
    // Rows still awaiting a date sort to the top \u2014 they need action
    holidays.sort((a, b) => {
      if (!a.holiday_date && b.holiday_date) return -1;
      if (a.holiday_date && !b.holiday_date) return 1;
      return (a.holiday_date || '').localeCompare(b.holiday_date || '');
    });
    const filtered = holidayYearFilter === 'all' ? holidays : holidays.filter(h => String(h.calendar_year) === String(holidayYearFilter));
    const pendingCount = filtered.filter(h => !h.holiday_date && h.is_active).length;
    const hasPendingDiwali = filtered.some(h => h.template_key === 'diwali' && !h.holiday_date);

    const html = `<div class="panel">

                <td>${h.holiday_date ? new Date(h.holiday_date).toLocaleDateString('en-GB', { weekday: 'short' }) : '\u2014'}</td>
                <td><strong>${h.holiday_name}</strong></td>

        ? await apiHRMS({ action: 'update_holiday', holiday_id: holidayId, holiday })
        : await apiHRMS({ action: 'create_holiday', holiday });
      setButtonLoading(btn, false);
      if (!res.success) { msg.className = 'msg error'; msg.textContent = res.error; return; }
      closeModal();
      if (res.auto_filled) {
        alert(`${res.auto_filled.name} was automatically set to ${res.auto_filled.date} (the day after Diwali).`);
      }
      loadHolidays();
    });
  }


  // ============ SALARY CALCULATOR ============
  // Deliberately mirrors the company's existing Google Sheet: same columns, same order,
  // same formulas. All arithmetic is done server-side; the numbers shown here are what
  // the server calculated and stored, never what the browser worked out on its own.
  let payrollPeriods = null;
  let currentPayrollSheet = null;   // { period, entries }
  let payrollDirty = false;

  const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  function monthLabel(m, y) {
    return `${MONTH_NAMES[m - 1]} ${y}`;
  }

  async function loadPayrollPeriods() {
    showSpinner('salaryCalcContent');
    const res = await apiPayroll({ action: 'get_payroll_periods' });

  function renderPayrollPeriodList() {

  function openCreatePayrollModal() {
    const now = new Date();
    const thisYear = now.getFullYear();
    const thisMonth = now.getMonth() + 1;   // 1-based
    // Default to LAST month, since salary for a month is normally prepared after it ends.
    const defMonth = thisMonth === 1 ? 12 : thisMonth - 1;
    const defYear = thisMonth === 1 ? thisYear - 1 : thisYear;
    // Offer the previous year too — in January you're usually creating December's sheet.
    const years = [thisYear, thisYear - 1];

    openModal('Create Salary Sheet', `
      <p style="font-size:12.5px; color:var(--muted); margin:0 0 14px;">Choose the month this salary sheet is for. Every active employee will be added automatically, with their loan and advance amounts pre-filled from the ledgers.</p>

        </select></div>
        <div class="field"><label>Year *</label><select id="pay_year">
          ${years.map(y => `<option value="${y}" ${y === defYear ? 'selected' : ''}>${y}</option>`).join('')}

  async function openPayrollSheet(periodId) {
    showSpinner('salaryCalcContent');
    const [res, wRes] = await Promise.all([
      apiPayroll({ action: 'get_payroll_sheet', period_id: periodId }),

      document.getElementById('salaryCalcContent').innerHTML = `<div class="msg error" style="display:block">${res.error}</div>`;

    payrollDirty = false;
