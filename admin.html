  function initials(name) {
    return (name || '?').split(' ').filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  }
  function avatarColor(name) {
    let hash = 0;
    for (let i = 0; i < (name || '').length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
    return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
  }

  // ---- Permission grid ----------------------------------------------------
  // This grid used to rebuild itself completely after every single click. That
  // is what threw the page back to the top: replacing the panel's innerHTML
  // destroys the two scrolling divs, so the browser has nowhere to put the old
  // scroll position and starts again at zero. Focus went with it.
  //
  // Now a click touches only what it changed:
  //   a cell checkbox    -> its own box, and the category box above it
  //   a category box     -> the cells under it, in that column
  //   a column header    -> that column only
  //   Grant/Revoke All   -> every box, but still no HTML is rebuilt
  //   search or a filter -> the employee list only; the grid is left alone
  //   picking a person   -> the grid only; the employee list keeps its place
  //
  // Nothing below writes innerHTML on the whole panel except the first draw.
  // Handlers are bound once, to the two containers, so a partial redraw never
  // leaves a dead button behind.

  function selectPermEmployee(id) {
    selectedPermEmployeeId = id;
    const grants = permissionsData.grants.filter(g => g.employee_id === id).map(g => g.permission_id);
    pendingGrantedIds = new Set(grants);
    permDirty = false;
  }

  function permFilteredEmployees() {
    return permissionsData.employees.filter(e => {
      if (permStatusFilter !== 'all' && e.status !== permStatusFilter) return false;
      if (permDeptFilter !== 'all' && e.departments?.name !== permDeptFilter) return false;
      if (permSearchQuery) {
        const hay = [e.name, e.employee_code, e.designations?.name].filter(Boolean).join(' ').toLowerCase();
        if (!hay.includes(permSearchQuery.toLowerCase())) return false;
      }
      return true;
    });
  }

  function permEmpRowHtml(e) {
    const isSel = e.id === selectedPermEmployeeId;
    const hasAccess = permissionsData.grants.some(g => g.employee_id === e.id) || e.role === 'owner';
    return `<button type="button" class="perm-emp-row ${isSel ? 'active' : ''}" data-id="${e.id}" style="width:100%; display:flex; align-items:center; gap:10px; padding:10px 14px; border:none; border-bottom:1px solid var(--border); background:${isSel ? 'var(--steel-dark)' : '#fff'}; color:${isSel ? '#fff' : 'var(--ink)'}; cursor:pointer; text-align:left;">
        <div style="width:32px; height:32px; border-radius:50%; background:${avatarColor(e.name)}; color:#fff; display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:700; flex-shrink:0;">${initials(e.name)}</div>
        <div style="flex:1; min-width:0;">
          <div style="font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${e.name}</div>
          <div style="font-size:11px; opacity:0.7; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${e.designations?.name || '—'} · ${e.departments?.name || '—'}</div>
        </div>
        <span class="perm-emp-access" style="font-size:9.5px; font-weight:700; padding:2px 6px; border-radius:4px; white-space:nowrap; background:${hasAccess ? (isSel ? 'rgba(255,255,255,0.2)' : 'var(--green-bg)') : (isSel ? 'rgba(255,255,255,0.1)' : 'var(--surface-sunken)')}; color:${hasAccess ? (isSel ? '#fff' : 'var(--green)') : (isSel ? 'rgba(255,255,255,0.6)' : 'var(--muted)')};">${hasAccess ? 'HAS ACCESS' : 'NO ACCESS'}</span>
      </button>`;
  }

  // Redraws the employee list only. Its own scroll position is put back, so a
  // filter change does not send a long list to the top for no reason.
  function renderPermEmployeeList() {
    const box = document.getElementById('permEmpListScroll');
    if (!box) return;
    const keepScroll = box.scrollTop;
    const list = permFilteredEmployees();
    box.innerHTML = list.length === 0
      ? '<div class="empty-state" style="padding:16px;">No matches.</div>'
      : list.map(permEmpRowHtml).join('');
    box.scrollTop = keepScroll;
  }

  // Swaps one row's highlight for another, and refreshes a badge that has just
  // been saved. A row whose appearance has not changed is left alone entirely,
  // so at most two rows in the list are ever rewritten.
  function permUpdateSelectedRow() {
    document.querySelectorAll('#permEmpListScroll .perm-emp-row').forEach(row => {
      const e = permissionsData.employees.find(x => String(x.id) === String(row.dataset.id));
      if (!e) return;
      const wasActive = row.classList.contains('active');
      const isActive = String(e.id) === String(selectedPermEmployeeId);
      const hasAccess = permissionsData.grants.some(g => g.employee_id === e.id) || e.role === 'owner';
      const badge = row.querySelector('.perm-emp-access');
      const badgeSame = badge && badge.textContent === (hasAccess ? 'HAS ACCESS' : 'NO ACCESS');
      if (wasActive === isActive && badgeSame) return;
      row.outerHTML = permEmpRowHtml(e);
    });
  }

  function permDetailHtml() {
    const { permissions, employees } = permissionsData;
    const selectedEmp = employees.find(e => e.id === selectedPermEmployeeId);
    if (!selectedEmp) return '<div class="empty-state">Select an employee.</div>';
    const categories = [...new Set(permissions.map(p => p.category))];

    return `
      <div id="permDetailStickyHeader" style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px; padding:16px 0; background:#fff; position:sticky; top:0; z-index:20;">
        <div>
          <div style="font-size:16px; font-weight:700;">${selectedEmp.name}</div>
          <div style="font-size:12.5px; color:var(--muted); margin-top:2px;">${selectedEmp.designations?.name || '—'} · ${selectedEmp.departments?.name || '—'} · ${selectedEmp.mobile_number || ''}</div>
        </div>
        ${selectedEmp.role !== 'owner' ? `
        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
          <button class="btn btn-sm btn-outline" id="permGrantAllBtn">Grant All</button>
          <button class="btn btn-sm btn-outline" id="permRevokeAllBtn" style="color:var(--danger); border-color:#efd2cf;">Revoke All</button>
          <button class="btn btn-sm" id="permSaveBtn" ${permDirty ? '' : 'disabled'}>Save</button>
        </div>` : ''}
      </div>

      ${selectedEmp.role !== 'owner' && selectedEmp.erp_login_enabled ? `
      <div style="display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); margin-bottom:12px;">
        <span style="font-size:12.5px; font-weight:600; color:var(--ink);">Login Mode:</span>
        <select id="permLoginModeSelect" style="font-size:12.5px; padding:6px 10px; border-radius:6px; border:1px solid var(--border);">
          <option value="single" ${selectedEmp.login_mode === 'single' ? 'selected' : ''}>Single device only</option>
          <option value="multiple" ${selectedEmp.login_mode === 'multiple' ? 'selected' : ''}>Multiple devices allowed</option>
        </select>
        <span style="font-size:11px; color:var(--muted);">Logging in on a new device will sign out the old one if set to single.</span>
      </div>` : ''}

      ${selectedEmp.role === 'owner' ? `
        <div class="empty-state">
          <strong>${selectedEmp.name}</strong> is the Owner — automatic full access to everything, cannot be restricted. No permissions to manage here.
        </div>
      ` : `
        <table class="ledger perm-grid-table">
            <thead><tr>
              <th style="text-align:left;">Module / Sub-head</th>
              ${ACTION_ORDER.map(a => `<th class="perm-col-header" data-action="${a}" tabindex="0" role="button" style="text-align:center; cursor:pointer;" title="Click to toggle all in this column">${ACTION_LABELS[a]}<br/><span style="font-size:10px; font-weight:500; color:var(--muted); text-transform:none;">all</span></th>`).join('')}
            </tr></thead>
            <tbody>
              ${categories.map(cat => {
                const catPerms = permissions.filter(p => p.category === cat);
                const subHeads = [...new Set(catPerms.map(p => p.sub_head))];

                let rowsHtml = `<tr class="perm-category-row" data-category="${cat}">
                  <td style="font-weight:700; color:var(--steel);">${cat}</td>
                  ${ACTION_ORDER.map(a => {
                    const idsForAction = catPerms.filter(p => p.action === a).map(p => p.id);
                    if (idsForAction.length === 0) return `<td style="text-align:center; color:var(--border);">—</td>`;
                    const on = idsForAction.filter(id => pendingGrantedIds.has(id)).length;
                    return `<td style="text-align:center;"><input type="checkbox" class="perm-category-checkbox" data-category="${cat}" data-action="${a}" ${on === idsForAction.length ? 'checked' : ''} style="width:auto;" /></td>`;
                  }).join('')}
                </tr>`;

                subHeads.forEach(sh => {
                  const shPerms = catPerms.filter(p => p.sub_head === sh);
                  rowsHtml += `<tr>
                    <td style="padding-left:28px;">${SUB_HEAD_LABELS[sh] || sh}</td>
                    ${ACTION_ORDER.map(a => {
                      const perm = shPerms.find(p => p.action === a);
                      if (!perm) return `<td style="text-align:center; color:var(--border);">—</td>`;
                      return `<td style="text-align:center;"><input type="checkbox" class="perm-cell-checkbox" data-permission-id="${perm.id}" data-category="${cat}" data-action="${a}" ${pendingGrantedIds.has(perm.id) ? 'checked' : ''} style="width:auto;" /></td>`;
                    }).join('')}
                  </tr>`;
                });

                return rowsHtml;
              }).join('')}
            </tbody>
          </table>
        <div class="msg" id="permMsg"></div>
      `}
    `;
  }

  // Redraws the right-hand grid only, for a genuine change of person. The
  // employee list on the left is untouched and keeps its scroll.
  function renderPermDetail() {
    const area = document.getElementById('permDetailScrollArea');
    if (!area) return;
    area.innerHTML = permDetailHtml();
    area.scrollTop = 0; // a different person is a different page of content
    permPositionGridHeader();
    permRefreshAllCategoryBoxes();
  }

  // The table's column headers freeze directly below the sticky name/buttons row.
  function permPositionGridHeader() {
    const h = document.getElementById('permDetailStickyHeader');
    if (!h) return;
    const top = h.offsetHeight;
    document.querySelectorAll('.perm-grid-table thead th').forEach(th => { th.style.top = top + 'px'; });
  }

  // ---- state sync: these touch .checked only, never innerHTML ----

  function permRefreshCategoryBox(cat, action) {
    document.querySelectorAll('.perm-category-checkbox').forEach(box => {
      if (box.dataset.category !== cat || box.dataset.action !== action) return;
      const ids = permissionsData.permissions
        .filter(p => p.category === cat && p.action === action).map(p => p.id);
      const on = ids.filter(id => pendingGrantedIds.has(id)).length;
      box.checked = ids.length > 0 && on === ids.length;
      // Half a category ticked is neither on nor off. Say so, rather than
      // showing an empty box that quietly hides the ticks underneath it.
      box.indeterminate = on > 0 && on < ids.length;
    });
  }

  function permRefreshAllCategoryBoxes() {
    document.querySelectorAll('.perm-category-checkbox').forEach(box => {
      const ids = permissionsData.permissions
        .filter(p => p.category === box.dataset.category && p.action === box.dataset.action)
        .map(p => p.id);
      const on = ids.filter(id => pendingGrantedIds.has(id)).length;
      box.checked = ids.length > 0 && on === ids.length;
      box.indeterminate = on > 0 && on < ids.length;
    });
  }

  function permRefreshCells(match) {
    document.querySelectorAll('.perm-cell-checkbox').forEach(cb => {
      if (match && !match(cb)) return;
      cb.checked = pendingGrantedIds.has(cb.dataset.permissionId);
    });
  }

  function permRefreshSaveButton() {
    const b = document.getElementById('permSaveBtn');
    if (b) b.disabled = !permDirty;
  }

  function permMarkDirty() {
    permDirty = true;
    permRefreshSaveButton();
  }

  // ---- the full draw: runs once, on load ----

  function renderAdminPanel() {
    if (!permissionsData) return;
    const { employees } = permissionsData;

    if (!selectedPermEmployeeId && employees.length > 0) {
      const first = employees.find(e => e.role !== 'owner') || employees[0];
      selectPermEmployee(first.id);
    }

    const deptNames = [...new Set(employees.map(e => e.departments?.name).filter(Boolean))].sort();

    document.getElementById('adminPanelContent').innerHTML = `<div class="panel panel-no-clip">
      <div class="panel-header"><span class="panel-title">Roles &amp; Permissions</span></div>
      <div style="display:flex; min-height:600px;">

        <!-- LEFT: employee list -->
        <div style="width:300px; height:600px; flex-shrink:0; display:flex; flex-direction:column; border-right:1px solid var(--border);">
          <div style="padding:14px; border-bottom:1px solid var(--border);">
            <input type="text" id="permSearchInput" placeholder="Search name, email, designation..." value="${permSearchQuery}" style="width:100%; margin-bottom:8px; padding:9px 12px; border-radius:8px; border:1px solid var(--border); background:#fff;" />
            <div style="display:flex; gap:8px;">
              <select id="permDeptFilterSelect" style="flex:1; font-size:13px; padding:9px 10px; border-radius:8px; border:1px solid var(--border); background:#fff;">
                <option value="all">All Departments</option>
                ${deptNames.map(d => `<option value="${d}" ${permDeptFilter === d ? 'selected' : ''}>${d}</option>`).join('')}
              </select>
              <select id="permStatusFilterSelect" style="flex:1; font-size:13px; padding:9px 10px; border-radius:8px; border:1px solid var(--border); background:#fff;">
                <option value="all" ${permStatusFilter === 'all' ? 'selected' : ''}>All Status</option>
                <option value="active" ${permStatusFilter === 'active' ? 'selected' : ''}>Active</option>
                <option value="suspended" ${permStatusFilter === 'suspended' ? 'selected' : ''}>Suspended</option>
                <option value="left" ${permStatusFilter === 'left' ? 'selected' : ''}>Left</option>
              </select>
            </div>
          </div>
          <div id="permEmpListScroll" style="flex:1; overflow-y:auto;"></div>
        </div>

        <!-- RIGHT: selected employee's permission grid -->
        <div id="permDetailScrollArea" style="flex:1; padding:0 20px; min-width:0; height:600px; overflow-y:auto; overflow-x:hidden;"></div>

      </div>
    </div>`;

    renderPermEmployeeList();
    document.getElementById('permDetailScrollArea').innerHTML = permDetailHtml();
    permPositionGridHeader();
    permRefreshAllCategoryBoxes();
    permBindAdminPanel();

  // ---- handlers: bound once, to the containers, so a partial redraw cannot
  // ---- leave a button wired to nothing.

  function permBindAdminPanel() {
    const searchEl = document.getElementById('permSearchInput');
    searchEl.addEventListener('input', (ev) => {
      permSearchQuery = ev.target.value;
      renderPermEmployeeList();          // the box itself is never redrawn, so
    });                                  // the caret stays where it was
    document.getElementById('permDeptFilterSelect').addEventListener('change', (ev) => {
      permDeptFilter = ev.target.value; renderPermEmployeeList();
    });
    document.getElementById('permStatusFilterSelect').addEventListener('change', (ev) => {
      permStatusFilter = ev.target.value; renderPermEmployeeList();
    });

    document.getElementById('permEmpListScroll').addEventListener('click', (ev) => {
      const row = ev.target.closest('.perm-emp-row');
      if (!row) return;
      if (String(row.dataset.id) === String(selectedPermEmployeeId)) return;
      selectPermEmployee(row.dataset.id);
      permUpdateSelectedRow();
      renderPermDetail();
    });

    const area = document.getElementById('permDetailScrollArea');

    area.addEventListener('change', async (ev) => {
      const t = ev.target;

      if (t.classList.contains('perm-cell-checkbox')) {
        const pid = t.dataset.permissionId;
        if (t.checked) pendingGrantedIds.add(pid); else pendingGrantedIds.delete(pid);
        permMarkDirty();
        permRefreshCategoryBox(t.dataset.category, t.dataset.action);
        return; // the box the user clicked is already in the right state
      }

      if (t.classList.contains('perm-category-checkbox')) {
        const cat = t.dataset.category, action = t.dataset.action;
        const ids = permissionsData.permissions
          .filter(p => p.category === cat && p.action === action).map(p => p.id);
        if (t.checked) ids.forEach(id => pendingGrantedIds.add(id));
        else ids.forEach(id => pendingGrantedIds.delete(id));
        t.indeterminate = false;
        permMarkDirty();
        permRefreshCells(cb => cb.dataset.category === cat && cb.dataset.action === action);
        return;
      }

      if (t.id === 'permLoginModeSelect') {
        const res = await apiPermissions({ action: 'set_login_mode', employee_id: selectedPermEmployeeId, login_mode: t.value });
        if (res.success) {
          const emp = permissionsData.employees.find(e => e.id === selectedPermEmployeeId);
          if (emp) emp.login_mode = t.value;
        }
      }
    });

    // The column header is a button in everything but name, so Enter and Space
    // work on it and it can be reached by Tab.
    area.addEventListener('keydown', (ev) => {
      const th = ev.target.closest('.perm-col-header');
      if (!th || (ev.key !== 'Enter' && ev.key !== ' ')) return;
      ev.preventDefault();
      th.click();
    });

    area.addEventListener('click', async (ev) => {
      const th = ev.target.closest('.perm-col-header');
      if (th) {
        const action = th.dataset.action;
        const ids = permissionsData.permissions.filter(p => p.action === action).map(p => p.id);
        const allOn = ids.every(id => pendingGrantedIds.has(id));
        if (allOn) ids.forEach(id => pendingGrantedIds.delete(id));
        else ids.forEach(id => pendingGrantedIds.add(id));
        permMarkDirty();
        permRefreshCells(cb => cb.dataset.action === action);
        document.querySelectorAll('.perm-category-checkbox').forEach(box => {
          if (box.dataset.action === action) permRefreshCategoryBox(box.dataset.category, action);
        });
        return;
      }

      if (ev.target.closest('#permGrantAllBtn')) {
        permissionsData.permissions.forEach(p => pendingGrantedIds.add(p.id));
        permMarkDirty(); permRefreshCells(); permRefreshAllCategoryBoxes();
        return;
      }

      if (ev.target.closest('#permRevokeAllBtn')) {
        pendingGrantedIds.clear();
        permMarkDirty(); permRefreshCells(); permRefreshAllCategoryBoxes();
        return;
      }

      const saveBtn = ev.target.closest('#permSaveBtn');
      if (saveBtn) {
        const msg = document.getElementById('permMsg');
        setButtonLoading(saveBtn, true, 'Saving');
        const res = await apiPermissions({
          action: 'bulk_set_permissions',
          employee_id: selectedPermEmployeeId,
          permission_ids: [...pendingGrantedIds],
        });
        setButtonLoading(saveBtn, false);
        if (res.success) {
          permissionsData.grants = permissionsData.grants.filter(g => g.employee_id !== selectedPermEmployeeId)
            .concat([...pendingGrantedIds].map(pid => ({ employee_id: selectedPermEmployeeId, permission_id: pid })));
          permDirty = false;
          permRefreshSaveButton();
          // Only the one badge in the list can have changed. Saving must not
          // cost the reader their place in either column.
          permUpdateSelectedRow();
          if (msg) {
            msg.className = 'msg success'; msg.textContent = 'Saved.';
            setTimeout(() => { const m = document.getElementById('permMsg'); if (m) { m.className = 'msg'; m.textContent = ''; } }, 1800);
          }
        } else {
          permRefreshSaveButton();
          if (msg) { msg.className = 'msg error'; msg.textContent = res.error || 'Failed to save.'; }
        }
      }
    });
  }

  // ============ VENDOR MASTER (v2 — branch-centric) ============
  const VENDOR_STATUS_TAG = { draft: 'pending_evening', pending_approval: 'calculated', approved: 'approved', rejected: 'rejected', suspended: 'calculated' };
  let vendorListSearchQuery = '';
  let vendorListStatusFilter = 'all';
  let vendorListPageSize = 25;
  let vendorListCurrentPage = 1;
  let pendingVendorContacts = [];

  async function loadVendorMaster() {
    vendorMasterLoaded = true;
    showSpinner('vendorMasterContent');
    const [ddRes, listRes] = await Promise.all([
      apiVendor({ action: 'get_vendor_dropdowns' }),
      apiVendor({ action: 'get_vendor_list' }),
    ]);
    if (!ddRes.success) {
      document.getElementById('vendorMasterContent').innerHTML = `<div class="panel"><div class="panel-body msg error" style="display:block;">${ddRes.error}</div></div>`;
      return;
    }
    vendorDropdowns = ddRes;
    if (!listRes.success) {
      document.getElementById('vendorMasterContent').innerHTML = `<div class="panel"><div class="panel-body msg error" style="display:block;">${escapeHtml(listRes.error || 'The vendor list could not be read.')}</div></div>`;
      return;
    }
    if (!requireLists(listRes, ['vendors'], 'vendorMasterContent')) return;
    vendorListData = listRes.vendors;
    switchVendorView('list');
  }

  function switchVendorView(view, vendorId) {
    if (view === 'list') renderVendorMasterList();
    else if (view === 'add') { pendingVendorContacts = []; renderVendorForm('company'); }
    else if (view === 'view') openVendorView(vendorId);
  }

  // ---------------- LIST SCREEN ----------------
  function renderVendorMasterList() {
    const searchQ = vendorListSearchQuery.trim();
    const searchQLower = searchQ.toLowerCase();
    const filtered = vendorListData.filter(v => {
      const statusMatch = vendorListStatusFilter === 'all' ? true : v.status === vendorListStatusFilter;
      if (!statusMatch) return false;
      if (!searchQLower) return true;
      const hay = [v.vendor_name, v.vendor_alias, v.vendor_code, v.pan, v.aadhar_number, v.deals_in, v.primary_contact_name, v.primary_contact_mobile].filter(Boolean).join(' ').toLowerCase();
      return hay.includes(searchQLower);
    });

    const totalPages = Math.max(1, Math.ceil(filtered.length / vendorListPageSize));
    if (vendorListCurrentPage > totalPages) vendorListCurrentPage = totalPages;
    const pageStart = (vendorListCurrentPage - 1) * vendorListPageSize;
    const pageItems = filtered.slice(pageStart, pageStart + vendorListPageSize);

    let html = `<div class="panel">
      <div class="panel-header emp-list-sticky-header" style="flex-wrap:wrap; gap:10px;">
        <span class="panel-title">Vendors<span class="count-chip">${filtered.length}</span></span>
        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
          <input type="text" id="vendorSearchInput" placeholder="Search by name, alias, PAN, GST, contact..." value="${searchQ}" style="width:230px; padding:7px 10px; font-size:12.5px; border:1px solid var(--border); border-radius:6px; background:#fff;" />
          <select id="vendorStatusFilterSelect" style="padding:7px 10px; font-size:12.5px; border:1px solid var(--border); border-radius:6px; background:var(--surface-sunken);">
            <option value="all" ${vendorListStatusFilter === 'all' ? 'selected' : ''}>All Statuses</option>
            <option value="draft" ${vendorListStatusFilter === 'draft' ? 'selected' : ''}>Draft</option>
            <option value="pending_approval" ${vendorListStatusFilter === 'pending_approval' ? 'selected' : ''}>Pending Approval</option>
            <option value="approved" ${vendorListStatusFilter === 'approved' ? 'selected' : ''}>Approved</option>
            <option value="rejected" ${vendorListStatusFilter === 'rejected' ? 'selected' : ''}>Rejected</option>
            <option value="suspended" ${vendorListStatusFilter === 'suspended' ? 'selected' : ''}>Suspended</option>
          </select>
          <select id="vendorPageSizeSelect" style="padding:7px 10px; font-size:12.5px; border:1px solid var(--border); border-radius:6px; background:var(--surface-sunken);">
            <option value="10" ${vendorListPageSize === 10 ? 'selected' : ''}>10 / Page</option>
            <option value="25" ${vendorListPageSize === 25 ? 'selected' : ''}>25 / Page</option>
            <option value="50" ${vendorListPageSize === 50 ? 'selected' : ''}>50 / Page</option>
            <option value="100" ${vendorListPageSize === 100 ? 'selected' : ''}>100 / Page</option>
          </select>
          <button class="btn btn-sm" id="newVendorBtn" title="Add New Vendor">+ Add</button>
        </div>
      </div>
      <table class="ledger emp-dept-table"><thead><tr>
        <th>Code</th><th>Name</th><th>Alias</th><th>Type</th><th>Deals In</th><th>PAN / Aadhar</th><th>Contact</th><th>Status</th>
      </tr></thead><tbody>
        ${pageItems.length === 0 ? '<tr><td colspan="8" style="text-align:center; color:var(--muted); padding:16px;">No vendors match.</td></tr>' : pageItems.map(v => `
          <tr class="${v.status === 'approved' ? 'row-approved' : v.status === 'rejected' ? 'row-open' : 'row-pending'}">
            <td data-label="Code" class="mono">${highlightMatch(v.vendor_code, searchQ)}</td>
            <td data-label="Name"><a href="#" class="vendor-view-link" data-id="${v.id}" style="color:var(--steel); font-weight:600; text-decoration:none;">${highlightMatch(v.vendor_name, searchQ)}</a>${v.is_test_entry ? ' <span class="status-tag rejected" style="font-size:9px;">TEST</span>' : ''}</td>
            <td data-label="Alias">${highlightMatch(v.vendor_alias, searchQ)}</td>
            <td data-label="Type">${v.vendor_type === 'individual' ? 'Individual/Contractor' : 'Company'}</td>
            <td data-label="Deals In">${highlightMatch(v.deals_in, searchQ)}</td>
            <td data-label="PAN / Aadhar" class="mono">${highlightMatch(v.pan || v.aadhar_number, searchQ)}</td>
            <td data-label="Contact">${highlightMatch(v.primary_contact_name, searchQ)} · ${highlightMatch(v.primary_contact_mobile, searchQ)}</td>
            <td data-label="Status"><span class="status-tag ${VENDOR_STATUS_TAG[v.status] || 'pending_evening'}">${v.status.replace('_',' ')}</span></td>
          </tr>`).join('')}
      </tbody></table>
      <div class="emp-pagination">
        <span>Showing ${filtered.length === 0 ? 0 : pageStart + 1}–${Math.min(pageStart + vendorListPageSize, filtered.length)} of ${filtered.length}</span>
        <div style="display:flex; align-items:center; gap:8px;">
          <button type="button" class="btn btn-sm btn-outline" id="vendorPagePrevBtn" ${vendorListCurrentPage <= 1 ? 'disabled' : ''}>‹ Prev</button>
          <span style="font-size:12.5px; color:var(--muted);">Page ${vendorListCurrentPage} of ${totalPages}</span>
          <button type="button" class="btn btn-sm btn-outline" id="vendorPageNextBtn" ${vendorListCurrentPage >= totalPages ? 'disabled' : ''}>Next ›</button>
        </div>
      </div>
    </div>`;

    document.getElementById('vendorMasterContent').innerHTML = html;

    const stickyHeader = document.querySelector('#vendorMasterContent .emp-list-sticky-header');
    if (stickyHeader) {
      const h = stickyHeader.offsetHeight;
      document.querySelectorAll('#vendorMasterContent .emp-dept-table thead th').forEach(th => { th.style.top = h + 'px'; });
    }

    document.getElementById('vendorSearchInput').addEventListener('input', (ev) => {
      vendorListSearchQuery = ev.target.value;
      vendorListCurrentPage = 1;
      renderVendorMasterList();
      const el = document.getElementById('vendorSearchInput');
      el.focus();
      el.setSelectionRange(el.value.length, el.value.length);
    });
    document.getElementById('vendorStatusFilterSelect').addEventListener('change', (ev) => { vendorListStatusFilter = ev.target.value; vendorListCurrentPage = 1; renderVendorMasterList(); });
    document.getElementById('vendorPageSizeSelect').addEventListener('change', (ev) => { vendorListPageSize = Number(ev.target.value); vendorListCurrentPage = 1; renderVendorMasterList(); });
    document.getElementById('vendorPagePrevBtn').addEventListener('click', () => { vendorListCurrentPage = Math.max(1, vendorListCurrentPage - 1); renderVendorMasterList(); });
    document.getElementById('vendorPageNextBtn').addEventListener('click', () => { vendorListCurrentPage++; renderVendorMasterList(); });
    document.getElementById('newVendorBtn').addEventListener('click', () => switchVendorView('add'));
    document.querySelectorAll('.vendor-view-link').forEach(link => {
      link.addEventListener('click', (ev) => { ev.preventDefault(); switchVendorView('view', link.dataset.id); });
    });
  }

      <div style="overflow-x:auto;">
        <table class="ledger" id="${containerId}-table" style="display:none; min-width:900px;">
          <thead><tr>
            <th style="width:36px;">#</th>
            ${fields.map(f => `<th>${f.label}${f.required ? ' *' : ''}</th>`).join('')}

  function renumberGenerateRows(containerId) {
    document.querySelectorAll(`#${containerId} tr`).forEach((tr, i) => {
      const numCell = tr.querySelector('.gen-row-num');
      if (numCell) numCell.textContent = i + 1;
    });
  }
  function wireGenerateRowsSection(containerId, fields) {
    function addRow() {
      const container = document.getElementById(containerId);
      const table = document.getElementById(`${containerId}-table`);
      table.style.display = '';
      const tr = document.createElement('tr');
      tr.innerHTML = `<td class="gen-row-num"></td>
        ${fields.map(f => `<td><input data-key="${f.key}" placeholder="${f.label}${f.required ? ' *' : ''}" style="width:100%;" /></td>`).join('')}
        <td><button type="button" class="btn btn-sm btn-outline gen-row-delete" style="color:var(--danger); border-color:#efd2cf; padding:4px 8px;">✕</button></td>`;
      tr.querySelector('.gen-row-delete').addEventListener('click', () => { tr.remove(); renumberGenerateRows(containerId); if (!container.children.length) table.style.display = 'none'; });
      const mobileInput = tr.querySelector('[data-key="mobile"]');
      if (mobileInput) {
        mobileInput.addEventListener('blur', () => {
          const v = mobileInput.value.trim();
          mobileInput.classList.toggle('field-error-highlight', !!v && !VALIDATORS.mobile.test(v));
        });
        mobileInput.addEventListener('input', () => mobileInput.classList.remove('field-error-highlight'));
      }
      const emailInputs = tr.querySelectorAll('[data-key="email"], [data-key="other_email"]');
      emailInputs.forEach(emailInput => {
        emailInput.addEventListener('blur', () => {
          const v = emailInput.value.trim();
          emailInput.classList.toggle('field-error-highlight', !!v && !VALIDATORS.email.test(v));
        });
        emailInput.addEventListener('input', () => emailInput.classList.remove('field-error-highlight'));
      });
      container.appendChild(tr);
      renumberGenerateRows(containerId);
    }
    document.getElementById(`${containerId}-generateBtn`).addEventListener('click', () => {
      const n = Math.max(0, Math.min(50, parseInt(document.getElementById(`${containerId}-count`).value) || 0));
      for (let i = 0; i < n; i++) addRow();
      document.getElementById(`${containerId}-count`).value = '';
    });
  }
  function collectGenerateRows(containerId, fields) {
    const container = document.getElementById(containerId);
    if (!container) return [];
    const rows = [];
    container.querySelectorAll('tr').forEach(tr => {
      const row = {};
      fields.forEach(f => { row[f.key] = tr.querySelector(`[data-key="${f.key}"]`)?.value.trim() || ''; });
      if (Object.values(row).some(v => v)) rows.push(row);
    });
    return rows;
  }

  async function saveVendorForm(isIndividual) {
    const btn = document.getElementById('vendorSaveBtn');
    const msg = document.getElementById('vendorFormMsg');
    msg.className = 'msg';
    const val = (id) => document.getElementById(id)?.value.trim() || null;
    const vendorTags = isIndividual ? [] : getMultiSelectValues('vf_vendor_tags');

    const core = {
      vendor_type: isIndividual ? 'individual' : 'company',
      vendor_name: val('vf_vendor_name'),
      vendor_alias: val('vf_vendor_alias'),
      is_test_entry: document.getElementById('vf_is_test_entry')?.checked || false,
      deals_in: val('vf_deals_in'),
      pan: !isIndividual ? val('vf_pan')?.toUpperCase() : null,
      aadhar_number: isIndividual ? val('vf_aadhar_number') : null,
      is_trader: vendorTags.includes('Trader'), is_manufacturer: vendorTags.includes('Manufacturer'),
      is_exporter: vendorTags.includes('Exporter'), is_service_provider: vendorTags.includes('Service Provider'),
      msme_registered: val('vf_msme_registered') === 'yes',
      msme_number: val('vf_msme_registered') === 'yes' ? val('vf_msme_number') : null,
      primary_contact_name: isIndividual ? val('vf_vendor_name') : val('vf_primary_contact_name'),
      primary_contact_mobile: val('vf_primary_contact_mobile'),
      other_numbers: val('vf_other_numbers'),
      primary_contact_email: val('vf_primary_contact_email'),
    };
    const hasBankAccount = isIndividual ? (document.getElementById('vf_has_bank_account')?.checked || false) : true;
    const branch = {
      branch_name: isIndividual ? null : val('vf_branch_name'),
      branch_alias: isIndividual ? null : val('vf_branch_alias'),
      gstin: !isIndividual ? val('vf_gstin')?.toUpperCase() : null,
      address: val('vf_branch_address'), state_id: val('vf_branch_state_id'), city_id: val('vf_branch_city_id'),
      pincode: val('vf_branch_pincode'), location_url: val('vf_branch_location_url'),
      contacts: collectGenerateRows('vf_contacts', getContactFields(isIndividual)),
    };
    const bank = hasBankAccount
      ? { bank_name: val('vf_bank_name'), account_number: val('vf_account_number'), ifsc: val('vf_ifsc')?.toUpperCase(), branch: val('vf_bank_branch'), holder_name: core.vendor_name, has_bank_account: true }
      : (isIndividual ? { has_bank_account: false } : null);

    const errors = [];
    const err = (label, targetId) => errors.push({ label, targetId });
    if (!core.vendor_name) err(isIndividual ? 'Individual Name' : 'Company Name', 'vf_vendor_name');
    if (!core.deals_in) err('Deals In', 'vf_deals_in');
    if (!isIndividual && !core.pan) err('PAN Number', 'vf_pan');
    else if (!isIndividual && !/^[A-Z]{5}[0-9]{4}[A-Z]$/.test(core.pan)) err('PAN format is invalid', 'vf_pan');
    if (isIndividual && !core.aadhar_number) err('Aadhar Number', 'vf_aadhar_number');
    else if (isIndividual && !/^[0-9]{12}$/.test(core.aadhar_number || '')) err('Aadhar Number must be 12 digits', 'vf_aadhar_number');
    if (!core.primary_contact_mobile) err('Primary Mobile', 'vf_primary_contact_mobile');
    else if (!/^[6-9][0-9]{9}$/.test(core.primary_contact_mobile)) err('Primary Mobile is invalid', 'vf_primary_contact_mobile');
    if (!isIndividual && !core.primary_contact_name) err('Primary Contact Name', 'vf_primary_contact_name');
    if (!isIndividual && vendorTags.length === 0) err('Vendor Is', 'vf_vendor_tags-trigger');
    if (!pendingUploads['pan_card']) err('PAN Card Upload', 'uploadBtn_pan_card');
    if (isIndividual && !pendingUploads['aadhar_card']) err('Aadhar Card Upload', 'uploadBtn_aadhar_card');
    if (!isIndividual && !pendingUploads['gst_certificate']) err('GST Certificate Upload', 'uploadBtn_gst_certificate');
    if (!isIndividual && core.msme_registered) {
      if (!core.msme_number) err('MSME Number', 'vf_msme_number');
      if (!pendingUploads['msme_certificate']) err('MSME Certificate Upload', 'uploadBtn_msme_certificate');
    }
    if (!isIndividual && !branch.branch_name) err('Branch Name', 'vf_branch_name');
    if (!branch.address) err('Branch Address', 'vf_branch_address');
    if (!branch.state_id) err('Branch State', 'vf_branch_state_id');
    if (!isIndividual && !branch.gstin) err('GST Number', 'vf_gstin');
    if (hasBankAccount) {
      if (!bank.bank_name) err('Bank Name', 'vf_bank_name');
      if (!bank.account_number) err('Account No.', 'vf_account_number');
      if (!bank.ifsc) err('IFSC Code', 'vf_ifsc');
      else if (!/^[A-Z]{4}0[0-9A-Z]{6}$/.test(bank.ifsc)) err('IFSC format is invalid', 'vf_ifsc');
      if (!pendingUploads['cancelled_cheque']) err('Cancelled Cheque Upload', 'uploadBtn_cancelled_cheque');
    }
    branch.contacts.forEach((c, i) => {
      if (!c.name) err(`Contact ${i + 1}: Name is required`, 'vf_contacts');
      if (!c.mobile) err(`Contact ${i + 1}: Mobile is required`, 'vf_contacts');
      else if (!/^[6-9][0-9]{9}$/.test(c.mobile)) err(`Contact ${i + 1}: Mobile is invalid`, 'vf_contacts');
      if (!isIndividual && !c.designation) err(`Contact ${i + 1}: Designation is required`, 'vf_contacts');
    });

    document.querySelectorAll('.field-error-highlight').forEach(el => el.classList.remove('field-error-highlight'));
    if (errors.length > 0) {
      errors.forEach(e => document.getElementById(e.targetId)?.classList.add('field-error-highlight'));
      msg.className = 'msg error';
      msg.innerHTML = 'Please complete the following before saving:<br>• ' + errors.map(e => e.label).join('<br>• ');
      const firstEl = document.getElementById(errors[0].targetId);
      if (firstEl) { firstEl.scrollIntoView({ behavior: 'smooth', block: 'center' }); setTimeout(() => firstEl.focus?.(), 350); }
      return;
    }

    setButtonLoading(btn, true, 'Saving');
    const res = await apiVendor({ action: 'create_vendor', core, branch, bank });
    if (!res.success) {
      setButtonLoading(btn, false);
      msg.className = 'msg error';
      msg.textContent = res.error;
      return;
    }
    const vendorId = res.vendor_id;
    const uploadPromises = Object.entries(pendingUploads).map(([slot, data]) =>
      apiVendor({ action: 'upload_document', vendor_id: vendorId, slot, file_base64: data.base64, file_ext: data.ext, document_name: data.document_name })
    );
    await Promise.all(uploadPromises);
    pendingUploads = {};

    setButtonLoading(btn, false);
    msg.className = 'msg success';
    msg.textContent = res.note || 'Saved successfully.';
    const listRes = await apiVendor({ action: 'get_vendor_list' });
    if (listRes.success) vendorListData = listRes.vendors;
    setTimeout(() => switchVendorView('list'), 1200);
  }

          <button class="btn" id="editSaveBtn">Save Changes</button>
          <button class="btn btn-outline" id="editCancelBtn2" type="button">Cancel</button>
        </div>
        <div class="msg" id="editFormMsg"></div>
      </div>
    </div>`;

    area.innerHTML = html;

    // ---- Documents: reuse the same upload wiring/pending-uploads pattern as the create form ----
    pendingUploads = {};
    wireDocUploadTrigger(isIndividual ? 'aadhar_card' : 'pan_card', { documentName: isIndividual ? 'Aadhar Card' : 'PAN Card' });
    if (!isIndividual) wireDocUploadTrigger('gst_certificate', { documentName: 'GST Certificate' });
    if (!isIndividual) wireDocUploadTrigger('msme_certificate', { documentName: 'MSME Certificate' });

    // ---- Bank accounts list: render, wire edit/delete per row, wire +Add ----
    function renderBankRows() {
      const tbody = document.getElementById('ef_banks_tbody');
      const table = document.getElementById('ef_banks_table');
      const banks = detail.bankAccounts || [];
      table.style.display = banks.length ? '' : 'none';
      tbody.innerHTML = banks.map(b => `
        <tr data-bank-id="${b.id}">
          <td>${b.bank_name}</td>
          <td>${b.account_number}</td>
          <td>${b.ifsc}</td>
          <td>${b.is_primary ? 'Yes' : ''}</td>
          <td>
            <button type="button" class="btn btn-sm btn-outline ef-bank-edit" data-id="${b.id}" style="padding:4px 8px;">Edit</button>
            <button type="button" class="btn btn-sm btn-outline ef-bank-remove" data-id="${b.id}" style="padding:4px 8px; color:var(--danger); border-color:#efd2cf;">Remove</button>
          </td>
        </tr>`).join('');
      document.querySelectorAll('.ef-bank-edit').forEach(btn => btn.addEventListener('click', () => editBankRow(btn.dataset.id)));
      document.querySelectorAll('.ef-bank-remove').forEach(btn => btn.addEventListener('click', () => removeBankRow(btn.dataset.id)));
    }
    async function editBankRow(bankId) {
      const bankMsg = document.getElementById('ef_bankMsg');
      const existing = (detail.bankAccounts || []).find(b => b.id === bankId);
      if (!existing) return;
      const bankName = prompt('Bank Name:', existing.bank_name);
      if (!bankName) return;
      const accountNumber = prompt('Account Number:', existing.account_number);
      if (!accountNumber) return;
      const ifsc = prompt('IFSC Code:', existing.ifsc);
      if (!ifsc || !/^[A-Z]{4}0[0-9A-Z]{6}$/.test(ifsc.toUpperCase())) { bankMsg.className = 'msg error'; bankMsg.textContent = 'Invalid IFSC format.'; return; }
      const res = await apiVendor({ action: 'update_bank_account', bank_account_id: bankId, bank: { bank_name: bankName, account_number: accountNumber, ifsc: ifsc.toUpperCase() } });
      if (!res.success) { bankMsg.className = 'msg error'; bankMsg.textContent = res.error; return; }
      existing.bank_name = bankName; existing.account_number = accountNumber; existing.ifsc = ifsc.toUpperCase();
      renderBankRows();
      bankMsg.className = 'msg success'; bankMsg.textContent = 'Bank account updated.';
    }
    async function removeBankRow(bankId) {
      const bankMsg = document.getElementById('ef_bankMsg');
      const existing = (detail.bankAccounts || []).find(b => b.id === bankId);
      if (!existing) return;
      if (!confirm(`Remove ${existing.bank_name} (${existing.account_number}) from this vendor? This can't be undone from here, but the record is kept for history, not deleted.`)) return;
      const res = await apiVendor({ action: 'deactivate_bank_account', bank_account_id: bankId });
      if (!res.success) { bankMsg.className = 'msg error'; bankMsg.textContent = res.error; return; }
      detail.bankAccounts = (detail.bankAccounts || []).filter(b => b.id !== bankId);
      renderBankRows();
      bankMsg.className = 'msg success'; bankMsg.textContent = 'Bank account removed.';
    }
    document.getElementById('ef_addBankBtn').addEventListener('click', async () => {
      const bankMsg = document.getElementById('ef_bankMsg');
      const bankName = prompt('Bank Name:');
      if (!bankName) return;
      const accountNumber = prompt('Account Number:');
      if (!accountNumber) return;
      const ifsc = prompt('IFSC Code:');
      if (!ifsc || !/^[A-Z]{4}0[0-9A-Z]{6}$/.test(ifsc.toUpperCase())) { bankMsg.className = 'msg error'; bankMsg.textContent = 'Invalid IFSC format.'; return; }
      const res = await apiVendor({ action: 'add_bank_account', vendor_id: v.id, branch_id: primaryBranch?.id, bank: { bank_name: bankName, account_number: accountNumber, ifsc: ifsc.toUpperCase() } });
      if (!res.success) { bankMsg.className = 'msg error'; bankMsg.textContent = res.error; return; }
      detail.bankAccounts = detail.bankAccounts || [];
      detail.bankAccounts.push(res.bank);
      renderBankRows();
      bankMsg.className = 'msg success'; bankMsg.textContent = 'Bank account added.';
    });
    renderBankRows();

    // Pre-select State/City correctly (find real IDs from the loaded dropdown data, matched by name)
    const matchedState = (dd.states || []).find(s => s.name === primaryBranch?.states?.name);
    if (matchedState) document.getElementById('ef_state_id').value = matchedState.id;
    function refreshCities(selectedStateId, selectedCityName) {
      const stateId = selectedStateId || document.getElementById('ef_state_id').value;
      const cities = (dd.cities || []).filter(c => c.state_id === stateId);
      document.getElementById('ef_city_id').innerHTML = opt(cities, null);
      const matchedCity = cities.find(c => c.name === selectedCityName);
      if (matchedCity) document.getElementById('ef_city_id').value = matchedCity.id;
    }
    refreshCities(matchedState?.id, primaryBranch?.cities?.name);
    document.getElementById('ef_state_id').addEventListener('change', () => refreshCities());

    if (!isIndividual) {
      const selectedTags = [v.is_trader && 'Trader', v.is_manufacturer && 'Manufacturer', v.is_exporter && 'Exporter', v.is_service_provider && 'Service Provider'].filter(Boolean);
      document.getElementById('ef_vendor_tags_wrap').innerHTML = multiSelectDropdown('ef_vendor_tags', 'Vendor Is', ['Trader', 'Manufacturer', 'Exporter', 'Service Provider'], selectedTags);
      wireMultiSelectDropdown('ef_vendor_tags');
      document.getElementById('ef_msme_registered').addEventListener('change', (ev) => {
        const showMsme = ev.target.value === 'yes';
        document.getElementById('ef_msme_number_field').style.display = showMsme ? 'block' : 'none';
        document.getElementById('ef_msme_doc_field').style.display = showMsme ? 'block' : 'none';
        if (showMsme) wireDocUploadTrigger('msme_certificate', { documentName: 'MSME Certificate' });
      });
    }
    document.getElementById('editBackBtn').addEventListener('click', () => openVendorView(v.id));
    document.getElementById('editCancelBtn2').addEventListener('click', () => openVendorView(v.id));

    document.getElementById('editSaveBtn').addEventListener('click', async () => {
      const btn = document.getElementById('editSaveBtn');
      const msg = document.getElementById('editFormMsg');
      msg.className = 'msg';
      const val = (id) => document.getElementById(id)?.value.trim() || null;
      const vendorTags = isIndividual ? [] : getMultiSelectValues('ef_vendor_tags');

      const core = {
        vendor_name: val('ef_vendor_name'),
        vendor_alias: val('ef_vendor_alias'),
        deals_in: val('ef_deals_in'),
        primary_contact_mobile: val('ef_primary_contact_mobile'),
        primary_contact_email: val('ef_primary_contact_email'),
        other_numbers: val('ef_other_numbers'),
        primary_contact_name: isIndividual ? val('ef_vendor_name') : val('ef_primary_contact_name'),
        is_trader: vendorTags.includes('Trader'), is_manufacturer: vendorTags.includes('Manufacturer'),
        is_exporter: vendorTags.includes('Exporter'), is_service_provider: vendorTags.includes('Service Provider'),
        msme_registered: !isIndividual && document.getElementById('ef_msme_registered')?.value === 'yes',
        msme_number: val('ef_msme_number'),
        pan: !isIndividual ? val('ef_pan')?.toUpperCase() : null,
        aadhar_number: isIndividual ? val('ef_aadhar_number') : null,
      };
      const branch = {
        branch_name: !isIndividual ? val('ef_branch_name') : undefined,
        branch_alias: !isIndividual ? val('ef_branch_alias') : undefined,
        gstin: !isIndividual ? val('ef_gstin')?.toUpperCase() : undefined,
        address: val('ef_address'),
        state_id: val('ef_state_id'),
        city_id: val('ef_city_id'),
        pincode: val('ef_pincode'),
        location_url: val('ef_location_url'),
      };

      const errors = [];
      if (!core.vendor_name) errors.push('Name');
      if (!core.deals_in) errors.push('Deals In');
      if (!core.primary_contact_mobile || !/^[6-9][0-9]{9}$/.test(core.primary_contact_mobile)) errors.push('a valid Primary Mobile');
      if (!isIndividual && !core.pan) errors.push('PAN');
      if (isIndividual && !core.aadhar_number) errors.push('Aadhar Number');
      if (!branch.address) errors.push('Address');
      if (!branch.state_id) errors.push('State');
      if (!isIndividual && !branch.branch_name) errors.push('Branch Name');
      if (!isIndividual && !branch.gstin) errors.push('GST Number');

      if (errors.length > 0) {
        msg.className = 'msg error';
        msg.textContent = 'Please fill: ' + errors.join(', ');
        return;
      }

      setButtonLoading(btn, true, 'Saving');
      const res = await apiVendor({ action: 'update_vendor', vendor_id: v.id, core, branch });
      if (!res.success) { setButtonLoading(btn, false); msg.className = 'msg error'; msg.textContent = res.error; return; }

      // Flush any newly-selected document replacements
      for (const slot of Object.keys(pendingUploads)) {
        const p = pendingUploads[slot];
        const uploadRes = await apiVendor({ action: 'upload_document', vendor_id: v.id, slot, file_base64: p.base64, file_ext: p.ext, document_name: p.document_name });
        if (!uploadRes.success) { setButtonLoading(btn, false); msg.className = 'msg error'; msg.textContent = `Saved details, but ${p.document_name} upload failed: ` + uploadRes.error; return; }
      }

      setButtonLoading(btn, false);
      msg.className = 'msg success';
      msg.textContent = 'Saved.';
      setTimeout(() => openVendorView(v.id), 800);
    });
  }

  async function openVendorView(vendorId) {

  }

  // ---------------- QUICK ADD: Document to existing vendor ----------------
  function openQuickAddDoc(vendorId) {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*,application/pdf';
    input.onchange = async () => {
      const file = input.files[0];
      if (!file) return;
      const slotName = prompt('What is this document? (e.g. "GST Certificate", "Agreement")', 'Other Document');
      if (!slotName) return;
      const reader = new FileReader();
      reader.onload = async () => {
        const base64 = reader.result;
        const ext = file.name.split('.').pop().toLowerCase();
        const res = await apiVendor({ action: 'upload_document', vendor_id: vendorId, slot: 'other', file_base64: base64, file_ext: ext, document_name: slotName });
        if (!res.success) { alert(res.error); return; }
        openVendorView(vendorId);
      };
      reader.readAsDataURL(file);
    };
    input.click();
  }

  // ---------------- QUICK ADD: Bank Account to existing vendor's primary branch ----------------
  function openQuickAddBank(vendorId, branchId) {
    const bankName = prompt('Bank Name:');
    if (!bankName) return;
    const accountNumber = prompt('Account Number:');
    if (!accountNumber) return;
    const ifsc = prompt('IFSC Code:');
    if (!ifsc || !/^[A-Z]{4}0[0-9A-Z]{6}$/.test(ifsc.toUpperCase())) { alert('Invalid IFSC format (should be AAAA0999999).'); return; }
    apiVendor({ action: 'quick_add_bank', vendor_id: vendorId, branch_id: branchId, bank: { bank_name: bankName, account_number: accountNumber, ifsc: ifsc.toUpperCase() } }).then(res => {
      if (!res.success) { alert(res.error); return; }
      openVendorView(vendorId);
    });
  }

    const contacts = reuse.success ? reuse.contacts : [];
    const banks = reuse.success ? reuse.bankAccounts : [];

    const body = document.getElementById('branchWizardBody');
    body.innerHTML = `
      <p style="font-size:12.5px; color:var(--muted); margin-bottom:14px;">${mode === 'same' ? 'This GSTIN must match this vendor\'s existing PAN — contradictions are blocked.' : 'This will create a brand-new, separate vendor record, linked back to this one as a related company.'}</p>
      ${mode === 'different' ? `
        <h3 class="form-section-heading" style="margin-top:0;">New Vendor Details</h3>
        <div class="form-grid">
          <div class="field"><label>Company Name *</label><input id="ab_vendor_name" /></div>
          <div class="field"><label>Vendor Alias <span style="font-weight:400; color:var(--muted); font-size:10.5px;">(optional)</span></label><input id="ab_vendor_alias" /></div>
          <div class="field"><label>Deals In *</label><input id="ab_deals_in" /></div>
          <div class="field"><label>PAN Number *</label><input id="ab_pan" style="text-transform:uppercase;" maxlength="10" /></div>
        </div>
      ` : ''}
      <h3 class="form-section-heading">Branch Details</h3>
      <div class="form-grid">
        <div class="field"><label>Branch Name *</label><input id="ab_branch_name" /></div>
        <div class="field"><label>Branch Alias <span style="font-weight:400; color:var(--muted); font-size:10.5px;">(optional)</span></label><input id="ab_branch_alias" /></div>
        <div class="field"><label>GST Number *</label><input id="ab_gstin" style="text-transform:uppercase;" maxlength="15" /></div>
        <div class="field"><label>State *</label><select id="ab_state_id">${opt(dd.states, null)}</select></div>
        <div class="field"><label>City</label><select id="ab_city_id"></select></div>
        <div class="field"><label>Pincode</label><input id="ab_pincode" maxlength="6" /></div>
        <div class="field"><label>Location URL</label><input id="ab_location_url" /></div>
        <div class="field full"><label>Address *</label><textarea id="ab_address" rows="2" style="width:100%; border:1px solid var(--border); border-radius:6px; padding:10px 11px; background:var(--surface-sunken);"></textarea></div>
      </div>

      <p class="section-label">Branch Contact Person</p>
      ${contacts.length > 0 ? `<label style="display:flex; align-items:center; gap:6px; font-size:13px; margin-bottom:8px;"><input type="checkbox" id="ab_reuse_contact_toggle" style="width:auto;" />Same person as another branch</label>
      <select id="ab_reuse_contact_select" style="display:none; margin-bottom:10px;">${contacts.map(c => `<option value="${c.id}">${c.name} — ${c.mobile}</option>`).join('')}</select>` : ''}
      <div class="form-grid" id="ab_new_contact_fields">
        <div class="field"><label>Name *</label><input id="ab_contact_name" /></div>
        <div class="field"><label>Mobile *</label><input id="ab_contact_mobile" maxlength="10" /></div>
        <div class="field"><label>Email</label><input id="ab_contact_email" /></div>
        <div class="field"><label>Designation</label><input id="ab_contact_designation" /></div>
      </div>

      <p class="section-label">Branch Bank Account</p>
      ${banks.length > 0 ? `<label style="display:flex; align-items:center; gap:6px; font-size:13px; margin-bottom:8px;"><input type="checkbox" id="ab_reuse_bank_toggle" style="width:auto;" />Same account as another branch</label>
      <select id="ab_reuse_bank_select" style="display:none; margin-bottom:10px;">${banks.map(b => `<option value="${b.id}">${b.bank_name} — ${b.account_number}</option>`).join('')}</select>` : ''}
      <div class="form-grid" id="ab_new_bank_fields">
        <div class="field"><label>Bank Name *</label><input id="ab_bank_name" /></div>
        <div class="field"><label>Account No. *</label><input id="ab_account_number" /></div>
        <div class="field"><label>IFSC Code *</label><input id="ab_ifsc" style="text-transform:uppercase;" maxlength="11" /></div>
        <div class="field"><label>Branch (bank)</label><input id="ab_bank_branch" /></div>
      </div>

      <div style="margin-top:20px; display:flex; gap:10px;">
        <button class="btn" id="ab_saveBtn">Save Branch</button>
      </div>
      <div class="msg" id="ab_msg"></div>
    `;

    document.getElementById('ab_state_id').addEventListener('change', () => {
      document.getElementById('ab_city_id').innerHTML = opt((dd.cities || []).filter(c => c.state_id === document.getElementById('ab_state_id').value), null);
    });
    document.getElementById('ab_reuse_contact_toggle')?.addEventListener('change', (ev) => {
      document.getElementById('ab_reuse_contact_select').style.display = ev.target.checked ? 'block' : 'none';
      document.getElementById('ab_new_contact_fields').style.display = ev.target.checked ? 'none' : 'grid';
    });
    document.getElementById('ab_reuse_bank_toggle')?.addEventListener('change', (ev) => {
      document.getElementById('ab_reuse_bank_select').style.display = ev.target.checked ? 'block' : 'none';
      document.getElementById('ab_new_bank_fields').style.display = ev.target.checked ? 'none' : 'grid';
    });

    document.getElementById('ab_saveBtn').addEventListener('click', () => saveAddBranch(vendorId, mode));
  }

  async function saveAddBranch(vendorId, mode) {
    const btn = document.getElementById('ab_saveBtn');
    const msg = document.getElementById('ab_msg');
    msg.className = 'msg';
    const val = (id) => document.getElementById(id)?.value.trim() || null;
    const checked = (id) => document.getElementById(id)?.checked || false;

    const branch = {
      branch_name: val('ab_branch_name'), branch_alias: val('ab_branch_alias'), gstin: val('ab_gstin')?.toUpperCase(),
      address: val('ab_address'), state_id: val('ab_state_id'), city_id: val('ab_city_id'), pincode: val('ab_pincode'), location_url: val('ab_location_url'),
      contact: checked('ab_reuse_contact_toggle') ? { reuse_contact_id: val('ab_reuse_contact_select') } : { name: val('ab_contact_name'), mobile: val('ab_contact_mobile'), email: val('ab_contact_email'), designation: val('ab_contact_designation') },
    };
    const bank = checked('ab_reuse_bank_toggle') ? { reuse_bank_account_id: val('ab_reuse_bank_select') } : { bank_name: val('ab_bank_name'), account_number: val('ab_account_number'), ifsc: val('ab_ifsc')?.toUpperCase(), branch: val('ab_bank_branch') };

    if (!branch.branch_name || !branch.gstin || !branch.address || !branch.state_id) {
      msg.className = 'msg error'; msg.textContent = 'Branch Name, GSTIN, Address, and State are required.'; return;
    }

    setButtonLoading(btn, true, 'Saving');

    if (mode === 'different') {
      const core = { vendor_type: 'company', vendor_name: val('ab_vendor_name'), vendor_alias: val('ab_vendor_alias'), deals_in: val('ab_deals_in'), pan: val('ab_pan')?.toUpperCase(), primary_contact_mobile: branch.contact.mobile || (branch.contact.reuse_contact_id ? '9999999999' : null) };
      if (!core.vendor_name || !core.deals_in || !core.pan) {
        setButtonLoading(btn, false); msg.className = 'msg error'; msg.textContent = 'New Vendor Name, Deals In, and PAN are required.'; return;
      }
      const res = await apiVendor({ action: 'create_vendor', core, branch, bank, related_vendor_id: vendorId });
      setButtonLoading(btn, false);
      if (!res.success) { msg.className = 'msg error'; msg.textContent = res.error; return; }
      msg.className = 'msg success'; msg.textContent = 'New related vendor created.';
      setTimeout(() => openVendorView(vendorId), 1200);
    } else {
      const res = await apiVendor({ action: 'add_branch', vendor_id: vendorId, branch, bank });
      setButtonLoading(btn, false);
      if (!res.success) { msg.className = 'msg error'; msg.textContent = res.error; return; }
      msg.className = 'msg success'; msg.textContent = 'Branch added.';
      setTimeout(() => openVendorView(vendorId), 1200);
    }
  }


  // This must stay the LAST statement in the script — it can trigger navigation to any view
  // (via the saved-view restore below), so every module's functions/consts it might call into
  // need to already be defined by the time it runs.
  //
  // This is the actual security fix: identity comes only from the signed session token that
  // REF holds. Nobody is logged in here — index.html does that, and anyone arriving without a
  // valid session (or still on a starter password) is sent back there by REF.requireSession.
  REF.requireSession().then(function (user) {
    if (!user) return;               // REF already redirected
    completeLogin(user);
  }).catch(function () { REF.goToLogin(); });
</script>


</body>
