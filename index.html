<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Refcon ERP — Sign In</title>
<script>window.__BUILD_VERSION__ = '1789748747';</script>
<script>
(function() {
  function checkVersion() {
    fetch('version.txt?_=' + Date.now(), { cache: 'no-store' })
      .then(function(r) { return r.text(); })
      .then(function(v) {
        v = v.trim();
        if (v && v !== window.__BUILD_VERSION__) {
          window.location.href = window.location.pathname + '?_v=' + Date.now();
        }
      })
      .catch(function() {
        setTimeout(checkVersion, 8000);
      });
  }
  checkVersion();
  setInterval(checkVersion, 60000);
  window.addEventListener('focus', checkVersion);
  window.addEventListener('online', checkVersion);
  document.addEventListener('visibilitychange', function() { if (!document.hidden) checkVersion(); });
})();
</script>
<style>
  :root {
    --bg: #eef1f4;
    --surface: #ffffff;
    --line: #dde2e8;
    --primary: #3b5b74;
    --primary-dark: #2c4457;
    --text: #263238;
    --muted: #6b7684;
    --danger: #a5453a;
    --danger-bg: #fbeceb;
    --success: #3a7a5d;
    --success-bg: #eaf5ef;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 34px 28px 28px;
    box-shadow: 0 1px 3px rgba(38,50,56,0.06), 0 8px 24px rgba(38,50,56,0.04);
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--primary);
    font-weight: 600;
    margin: 0 0 10px;
  }
  .badge::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--primary);
    display: inline-block;
  }
  h1 {
    font-size: 22px;
    font-weight: 650;
    letter-spacing: -0.2px;
    margin: 0 0 6px;
    color: var(--text);
  }
  .sub {
    color: var(--muted);
    font-size: 13.5px;
    margin: 0 0 26px;
    line-height: 1.5;
  }

  label {
    display: block;
    font-size: 12.5px;
    color: var(--muted);
    margin: 0 0 6px;
    font-weight: 500;
  }
  .field { margin-bottom: 16px; }
  input {
    width: 100%;
    background: #fafbfc;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 15.5px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    outline: none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  input:focus { border-color: var(--primary); background: #fff; }
  input::placeholder { color: #a3aab3; }

  button {
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: none;
    background: var(--primary);
    color: #fff;
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: 0.2px;
    cursor: pointer;
    margin-top: 6px;
    transition: background 0.15s ease;
  }
  button:hover { background: var(--primary-dark); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }

  .linkbtn {
    display: block;
    width: 100%;
    background: none;
    border: none;
    color: var(--primary);
    font-size: 12.5px;
    font-weight: 500;
    text-align: center;
    margin-top: 14px;
    padding: 0;
    cursor: pointer;
  }
  .linkbtn:hover { background: none; text-decoration: underline; }

  .msg {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 13.5px;
    display: none;
    line-height: 1.5;
  }
  .msg.error {
    display: block;
    background: var(--danger-bg);
    border: 1px solid #f0d3d0;
    color: var(--danger);
  }
  .msg.success {
    display: block;
    background: var(--success-bg);
    border: 1px solid #cfe6da;
    color: var(--success);
  }
  .footer-note {
    text-align: center;
    font-size: 11.5px;
    color: #a3aab3;
    margin-top: 20px;
    line-height: 1.6;
  }
  .simple-brand {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--primary);
    margin-bottom: 10px;
  }

  /* ---- ON A PHONE ----
     Signing in happens wherever the person is. The form is already full
     width; what it needed was a field iOS will not zoom into (16px, not
     15.5px) and a "Forgot password" link tall enough to tap — it was only as
     tall as its own letters. */
  @media (max-width: 880px) {
    input { font-size: 16px; min-height: 44px; }
    button { min-height: 44px; }
    .linkbtn { min-height: 44px; padding: 12px 0; }
    input { scroll-margin-top: 80px; scroll-margin-bottom: 120px; }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="simple-brand">REF</div>
    <p class="badge">Refcon ERP</p>
    <h1>Sign In</h1>
    <p class="sub">Use your email address, or your employee number if you were given one.</p>

    <form id="loginForm">
      <div class="field">
        <label for="userid">Email or Employee Number</label>
        <input type="text" id="userid" placeholder="you@refconveyors.com or EMP-0014"
               autocomplete="username" autocapitalize="none" spellcheck="false" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Your password"
               autocomplete="current-password" required />
      </div>
      <button type="submit" id="submitBtn">Sign In</button>
    </form>

    <button type="button" class="linkbtn" id="forgotBtn">Forgotten your password?</button>

    <div class="msg" id="msgBox"></div>
    <p class="footer-note">
      Every sign-in is recorded.<br />
      Raghbir Erectors &amp; Fabricators, Ludhiana
    </p>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app-config.js"></script>
<script>
(function () {
  'use strict';

  var form      = document.getElementById('loginForm');
  var msgBox    = document.getElementById('msgBox');
  var submitBtn = document.getElementById('submitBtn');
  var useridEl  = document.getElementById('userid');
  var passEl    = document.getElementById('password');
  var forgotBtn = document.getElementById('forgotBtn');

  function show(kind, text) {
    msgBox.className = 'msg ' + kind;
    msgBox.textContent = text;
  }
  function clear() {
    msgBox.className = 'msg';
    msgBox.textContent = '';
  }

  /* Already signed in? Go straight through. */
  REF.getSession().then(function (session) {
    if (session) routeOnward();
  }).catch(function () { /* not signed in, stay here */ });

  function routeOnward() {
    return REF.me(true).then(function (user) {
      if (user.must_change_password) {
        window.location.href = 'reset.html?first=1';
        return;
      }
      /* Office staff go to the main screen. A driver with nothing but
         Km Tracker access goes straight to the reading screen.        */
      var officeKeys = ['employee_master.view','vendor_master.view','payroll.view',
                        'loans_advances.view','holidays.view','km_tracker.view',
                        'admin.users','admin.permissions','admin.audit','admin.settings'];
      var hasOffice = user.is_owner || officeKeys.some(function (k) {
        return REF.can(user, k);
      });
      window.location.href = hasOffice ? 'admin.html' : 'submit.html';
    });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    clear();
    submitBtn.disabled = true;
    submitBtn.textContent = 'Checking...';

    REF.signIn(useridEl.value, passEl.value).then(function (result) {
      if (result.error) {
        /* Deliberately vague: never reveal whether the account exists. */
        show('error', 'Those details were not recognised. Check and try again.');
        return;
      }
      show('success', 'Signed in. Just a moment...');
      return routeOnward();
    }).catch(function () {
      show('error', 'Could not reach the server. Check your connection and try again.');
    }).then(function () {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign In';
    });
  });

  forgotBtn.addEventListener('click', function () {
    clear();
    var who = useridEl.value.trim();
    if (!who) {
      show('error', 'Type your email or employee number first, then press this again.');
      useridEl.focus();
      return;
    }
    forgotBtn.disabled = true;
    REF.sendPasswordReset(who).then(function () {
      /* Same message either way, so nobody can use this to discover
         which email addresses exist. */
      show('success', 'If that account exists, a reset link is on its way. Check the inbox.');
    }).catch(function () {
      show('success', 'If that account exists, a reset link is on its way. Check the inbox.');
    }).then(function () {
      forgotBtn.disabled = false;
    });
  });

  useridEl.focus();
})();
</script>
</body>
</html>
