<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Submit Reading — Vehicle KM Tracker</title>
<script>window.__BUILD_VERSION__ = '1789110669';</script>
<script>
(function() {
  function checkVersion() {
    fetch('version.txt?_=' + Date.now(), { cache: 'no-store' })
      .then(function(r) { return r.text(); })
      .then(function(v) {
        v = v.trim();
        if (v && v !== window.__BUILD_VERSION__) {
          window.location.href = window.location.pathname + '?_v=' + Date.now();
        }
      })
      .catch(function() {
        setTimeout(checkVersion, 8000);
      });
  }
  checkVersion();
  setInterval(checkVersion, 60000);
  window.addEventListener('focus', checkVersion);
  window.addEventListener('online', checkVersion);
  document.addEventListener('visibilitychange', function() { if (!document.hidden) checkVersion(); });
})();
</script>
<style>
  :root {
    --bg: #eef1f4;
    --surface: #ffffff;
    --line: #dde2e8;
    --primary: #3b5b74;
    --primary-dark: #2c4457;
    --text: #263238;
    --muted: #6b7684;
    --danger: #a5453a;
    --danger-bg: #fbeceb;
    --success: #3a7a5d;
    --success-bg: #eaf5ef;
    --warn: #8a6d1f;
    --warn-bg: #fbf3df;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    padding-bottom: 60px;
  }
  .wrap { max-width: 420px; margin: 0 auto; padding: 0 16px; }

  .topbar {
    background: var(--primary);
    color: #fff;
    padding: 16px;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .topbar-title { font-size: 15.5px; font-weight: 700; letter-spacing: 0.2px; }
  .topbar-sub { font-size: 11px; opacity: 0.75; font-weight: 500; letter-spacing: 0.5px; }
  .page-title { font-size: 18px; font-weight: 650; margin: 4px 0 14px; color: var(--text); }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--primary);
    font-weight: 600;
    margin: 10px 0 4px;
  }
  .badge::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--primary);
    display: inline-block;
  }
  h1 { font-size: 21px; font-weight: 650; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13.5px; margin: 0 0 20px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 16px;
    box-shadow: 0 1px 3px rgba(38,50,56,0.05);
  }
  .toggle-row {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .toggle-btn {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #fafbfc;
    color: var(--muted);
    font-weight: 600;
    font-size: 13.5px;
    cursor: pointer;
  }
  .toggle-btn.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }

  label { display: block; font-size: 12.5px; color: var(--muted); margin: 0 0 6px; font-weight: 500; }
  .field { margin-bottom: 16px; }
  input, select {
    width: 100%;
    background: #fafbfc;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 15.5px;
    color: var(--text);
    outline: none;
  }
  input:focus { border-color: var(--primary); background: #fff; }

  .photo-box {
    border: 1.5px dashed var(--line);
    border-radius: 10px;
    padding: 18px;
    text-align: center;
    cursor: pointer;
    background: #fafbfc;
    margin-bottom: 8px;
  }
  .photo-box img { max-width: 100%; border-radius: 8px; display: block; margin: 0 auto 8px; }
  .photo-box .hint { color: var(--muted); font-size: 13px; }
  .photo-size { font-size: 11.5px; color: var(--muted); margin-bottom: 16px; }

  .loc-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    color: var(--muted);
    margin-bottom: 16px;
    padding: 10px 12px;
    background: #fafbfc;
    border-radius: 8px;
    border: 1px solid var(--line);
  }
  .loc-status.ok { color: var(--success); }
  .loc-status.err { color: var(--danger); }
  .loc-icon { flex-shrink: 0; }

  button.submit {
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: none;
    background: var(--primary);
    color: #fff;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
  }
  button.submit:hover { background: var(--primary-dark); }
  button.submit:disabled { opacity: 0.55; cursor: not-allowed; }

  .msg {
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 13.5px;
    display: none;
    line-height: 1.5;
  }
  .msg.error { display: block; background: var(--danger-bg); border: 1px solid #f0d3d0; color: var(--danger); }
  .msg.success { display: block; background: var(--success-bg); border: 1px solid #cfe6da; color: var(--success); }
  .msg.warn { display: block; background: var(--warn-bg); border: 1px solid #ecdca8; color: var(--warn); }
  .simple-brand {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--primary);
    margin-bottom: 4px;
  }
</style>
</head>
<body>
<div class="topbar">
  <div>
    <span class="topbar-title">REF</span>
    <span class="topbar-sub">KM TRACKER</span>
  </div>
  <div style="display:flex; align-items:center; gap:10px;">
    <span class="topbar-sub" id="empNameDisplay"></span>
    <button onclick="REF.signOut().then(function(){ window.location.href='index.html'; });" style="background:none; border:1px solid rgba(255,255,255,0.4); color:#fff; padding:4px 10px; border-radius:5px; font-size:11px; cursor:pointer;">Log out</button>
  </div>
</div>
<div class="wrap">
  <p class="page-title">Submit Odometer Reading</p>

  <div class="card">
    <div class="toggle-row">
      <button type="button" class="toggle-btn active" id="btnMorning">Morning</button>
      <button type="button" class="toggle-btn" id="btnEvening">Evening</button>
    </div>

    <form id="readingForm">
      <div class="field">
        <label>Vehicle</label>
        <div id="vehicleDisplay" style="padding:12px 14px; background:#fafbfc; border:1px solid var(--line); border-radius:8px; font-size:14.5px; color:var(--muted);">Loading...</div>
      </div>
      <div class="field">
        <label>Odometer Photo</label>
        <div class="photo-box" id="photoBox">
          <div id="photoPreviewArea">
            <div class="hint">Tap to take or choose a photo</div>
          </div>
        </div>
        <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none" />
        <div class="photo-size" id="photoSizeInfo"></div>
      </div>

      <div class="field">
        <label for="reading">Odometer Reading (KM)</label>
        <input type="number" id="reading" placeholder="e.g. 24531" inputmode="decimal" required />
      </div>

      <div class="loc-status" id="locStatus">
        <svg class="loc-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 22s7-7.58 7-12.5A7 7 0 0 0 5 9.5C5 14.42 12 22 12 22z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <circle cx="12" cy="9.5" r="2.3" stroke="currentColor" stroke-width="1.8"/>
        </svg>
        <span id="locText">Waiting for location permission...</span>
      </div>

      <button type="submit" class="submit" id="submitBtn" disabled>Submit Morning Reading</button>
    </form>

    <div class="msg" id="msgBox"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app-config.js"></script>
<script>
  // Who is signed in comes from the session token, never from anything
  // this page could have been told to believe.
  let CURRENT_USER = null;
  let SELECTED_VEHICLE_ID = null;

  let entryType = "morning";
  let compressedPhotoBase64 = null;
  let currentLocation = null;

  const btnMorning = document.getElementById('btnMorning');
  const btnEvening = document.getElementById('btnEvening');
  const submitBtn = document.getElementById('submitBtn');
  const photoBox = document.getElementById('photoBox');
  const photoInput = document.getElementById('photoInput');
  const photoPreviewArea = document.getElementById('photoPreviewArea');
  const photoSizeInfo = document.getElementById('photoSizeInfo');
  const locStatus = document.getElementById('locStatus');
  const locText = document.getElementById('locText');
  const msgBox = document.getElementById('msgBox');
  const readingForm = document.getElementById('readingForm');

  function setEntryType(type) {
    entryType = type;
    btnMorning.classList.toggle('active', type === 'morning');
    btnEvening.classList.toggle('active', type === 'evening');
    submitBtn.textContent = `Submit ${type === 'morning' ? 'Morning' : 'Evening'} Reading`;
  }
  btnMorning.addEventListener('click', () => setEntryType('morning'));
  btnEvening.addEventListener('click', () => setEntryType('evening'));

  photoBox.addEventListener('click', () => photoInput.click());

  // Compress image client-side using canvas before storing as base64
  function compressImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const MAX_DIM = 800;
          let { width, height } = img;
          if (width > height && width > MAX_DIM) {
            height = Math.round((height * MAX_DIM) / width);
            width = MAX_DIM;
          } else if (height > MAX_DIM) {
            width = Math.round((width * MAX_DIM) / height);
            height = MAX_DIM;
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          // Start at moderate quality, compress further if still too big
          let quality = 0.7;
          let dataUrl = canvas.toDataURL('image/jpeg', quality);
          while (dataUrl.length * 0.75 > 200 * 1024 && quality > 0.2) {
            quality -= 0.1;
            dataUrl = canvas.toDataURL('image/jpeg', quality);
          }
          resolve(dataUrl);
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  photoInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const originalSizeKB = (file.size / 1024).toFixed(0);
    photoSizeInfo.textContent = `Compressing... (original: ${originalSizeKB} KB)`;

    try {
      const compressedDataUrl = await compressImage(file);
      compressedPhotoBase64 = compressedDataUrl;
      const compressedSizeKB = ((compressedDataUrl.length * 0.75) / 1024).toFixed(0);
      photoPreviewArea.innerHTML = `<img src="${compressedDataUrl}" alt="Odometer preview" />`;
      photoSizeInfo.textContent = `Compressed: ${originalSizeKB} KB → ${compressedSizeKB} KB`;
      checkFormReady();
    } catch (err) {
      photoSizeInfo.textContent = 'Could not process photo. Try again.';
    }
  });

  function requestLocation() {
    if (!navigator.geolocation) {
      locStatus.className = 'loc-status err';
      locText.textContent = 'Location not supported on this device/browser.';
      return;
    }
    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        const { latitude, longitude } = pos.coords;
        currentLocation = { lat: latitude, lng: longitude, text: null };
        locText.textContent = 'Location found. Looking up address...';
        try {
          const res = await fetch(
            `https://nominatim.openstreetmap.org/reverse?lat=${latitude}&lon=${longitude}&format=json`
          );
          const data = await res.json();
          const addr = data.display_name || `${latitude.toFixed(4)}, ${longitude.toFixed(4)}`;
          currentLocation.text = addr;
          locStatus.className = 'loc-status ok';
          locText.textContent = addr;
        } catch (err) {
          currentLocation.text = `${latitude.toFixed(4)}, ${longitude.toFixed(4)}`;
          locStatus.className = 'loc-status ok';
          locText.textContent = `Location captured (${currentLocation.text})`;
        }
        checkFormReady();
      },
      (err) => {
        locStatus.className = 'loc-status err';
        locText.textContent = 'Location permission denied. Submission is blocked until allowed.';
        currentLocation = null;
        checkFormReady();
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }

  function checkFormReady() {
    const readingVal = document.getElementById('reading').value;
    submitBtn.disabled = !(compressedPhotoBase64 && currentLocation && readingVal && SELECTED_VEHICLE_ID);
  }
  document.getElementById('reading').addEventListener('input', checkFormReady);

  async function loadMyVehicle() {
    const display = document.getElementById('vehicleDisplay');
    try {
      const data = await REF.call('get-my-vehicle', {});
      if (data.success && data.vehicle) {
        SELECTED_VEHICLE_ID = data.vehicle.id;
        display.textContent = data.vehicle.vehicle_name;
        display.style.color = 'var(--text)';
      } else {
        display.textContent = 'No vehicle assigned to your account. Contact admin.';
        display.style.color = 'var(--danger)';
      }
    } catch (err) {
      display.textContent = 'Could not load vehicle. Check your connection.';
      display.style.color = 'var(--danger)';
    }
    checkFormReady();
  }

  REF.requireSession().then(function (user) {
    if (!user) return;               // REF already redirected
    CURRENT_USER = user;
    document.getElementById('empNameDisplay').textContent = user.name || '';
    loadMyVehicle();
    requestLocation();
  }).catch(function () { REF.goToLogin(); });

  readingForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    msgBox.className = 'msg';
    msgBox.textContent = '';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting...';

    const reading = document.getElementById('reading').value;

    try {
      const data = await REF.call('submit-reading', {
        vehicle_id: SELECTED_VEHICLE_ID,
        entry_type: entryType,
        reading: parseFloat(reading),
        photo_base64: compressedPhotoBase64,
        location_text: currentLocation.text,
        lat: currentLocation.lat,
        lng: currentLocation.lng,
      });

      if (data.success) {
        msgBox.className = 'msg success';
        if (entryType === 'evening') {
          msgBox.textContent = `Evening reading submitted. KM traveled: ${data.entry.km_traveled}, Cost: ₹${data.entry.cost}`;
        } else {
          msgBox.textContent = 'Morning reading submitted successfully.';
        }
        resetFormToDefault();
      } else {
        msgBox.className = 'msg error';
        msgBox.textContent = data.error || 'Submission failed.';
      }
    } catch (err) {
      msgBox.className = 'msg error';
      msgBox.textContent = 'Could not reach the server. Check your connection.';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = `Submit ${entryType === 'morning' ? 'Morning' : 'Evening'} Reading`;
      checkFormReady();
    }
  });

  function resetFormToDefault() {
    // Clear reading input
    document.getElementById('reading').value = '';

    // Clear photo state and preview
    compressedPhotoBase64 = null;
    photoInput.value = '';
    photoPreviewArea.innerHTML = '<div class="hint">Tap to take or choose a photo</div>';
    photoSizeInfo.textContent = '';

    // Switch back to Morning as the default view
    setEntryType('morning');

    // Re-check location fresh for the next submission
    currentLocation = null;
    locStatus.className = 'loc-status';
    locText.textContent = 'Waiting for location permission...';
    requestLocation();

    // Disable submit until photo+location+reading are provided again
    submitBtn.disabled = true;
  }
</script>
</body>
</html>
